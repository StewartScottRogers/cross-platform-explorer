# CPE-1710: `std::fs::rename` replaces its destination SILENTLY on both Windows and Unix, and it does not
# follow the final component — so a link sitting at the destination is destroyed rather than written
# through. Six sites in this repo shipped with a guard that could not see that, four of them after the PR
# that wrote the rule down.
#
# So the call is disallowed and each use has to say why it is safe:
#
#   - a rename onto a slot the USER named  -> call `fsutil::rename_into_slot`, which guards then renames;
#   - anything else (a tmp -> final replace of a file the app itself owns, a test fixture, a protocol
#     server's own rename semantics) -> `#[allow(clippy::disallowed_methods)]` with a one-line reason at
#     the site.
#
# The point of the second form is that the justification lives in the code, where the next reviewer reads
# it. CPE-1710's first round kept that reasoning in a PR description instead, and it was wrong twice — it
# called `metadata_write`'s destination "a file we own" when it is the user's own media file.
#
# Known gaps, both real:
#   - `disallowed_methods` resolves paths, not `dyn` dispatch. An `impl` body IS covered (which is why
#     `crates/server`'s `provider.rs` needs its own `#[allow]`); what is NOT covered is a CALLER reaching
#     rename through a trait object, e.g. `&dyn FileSystemProvider`. The round-4 UAT probed six other
#     shapes -- alias, re-export, fn value, macro, const fn-pointer, impl body -- and the lint flagged all
#     six; only the `dyn` caller slipped.
#   - The lint is warn-by-default. It only fails a build because CI passes `-D warnings`; a bare local
#     `cargo clippy` prints a warning that scrolls past.
disallowed-methods = [
    { path = "std::fs::rename", reason = "replaces its destination silently and destroys a link at it — use fsutil::rename_into_slot_claimed_slot for a name a picker just chose (it CLAIMS the name, so a name taken in the gap is a loud refusal), or fsutil::rename_into_slot for a slot the user named directly, or allow with a reason" },
]
