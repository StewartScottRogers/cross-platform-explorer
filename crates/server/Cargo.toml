[package]
name = "cpe-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "The Cross-Platform Explorer Server: Tauri-free domain logic behind the ServerCtx runtime seam + the contract envelope (CPE-810/815)."
license = "MIT"

# The pure Server (CPE-810). Holds domain logic that depends only on the runtime
# seam (`ctx::ServerCtx`, CPE-814) and the wire contract (`cpe-contract`, CPE-811) —
# never on Tauri — so it is headless- and remote-runnable. The Tauri app is a thin
# adapter that provides a `TauriCtx` and dispatches to this crate. Standalone (out of
# any workspace) to keep that one-way boundary, like `sidecar/contract`.

[dependencies]
cpe-contract = { path = "../contract" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Optional TypeScript-binding type derives (CPE-953, epic CPE-810). OFF by default so normal builds/tests
# never compile specta and the lean crate is unchanged; the app's `export_bindings` bin turns it on via
# `cpe-server/specta` to derive `specta::Type` on the serde types that appear in command signatures.
specta = { version = "=2.0.0-rc.22", features = ["derive"], optional = true }
# Streaming SHA-256 for file checksums / integrity baselines (CPE-412/791). Pure-Rust, no system libs.
sha2 = "0.10"
# Work-stealing parallelism for the recursive directory-size walk (CPE-754). Pure-Rust.
rayon = "1"
# Archive listing (CPE-064/109/110/113) — browse into an archive's directory without extracting. All
# pure-Rust, no system libs: zip, tar, flate2 (miniz_oxide backend), sevenz-rust, iso9660.
zip = "2"
tar = "0.4"
flate2 = "1"
sevenz-rust = "0.6"
iso9660 = "0.1"
# Structured binary previews (CPE-210/214/215/216/218). All pure-Rust: goblin (PE headers), midly
# (MIDI), wasmprinter (wasm->wat), serde_bencode (torrent metadata).
goblin = "0.8"
midly = "0.5"
wasmprinter = "0.2"
serde_bencode = "0.2"
# Structured-data previews (CPE-088/089/090/091). rusqlite bundles SQLite (no system lib); calamine and
# parquet are pure-Rust (parquet with default features off to avoid pulling arrow/compression stacks).
rusqlite = { version = "0.32", features = ["bundled"] }
calamine = "0.26"
parquet = { version = "53", default-features = false }
# Image decode/thumbnail + transcode + EXIF metadata (CPE-642/644/099/101/659). All pure-Rust, no
# system libs: image (decoders), psd (PSD composite), kamadak-exif (EXIF), base64 (data-URL encoding).
image = { version = "0.25", default-features = false, features = ["tiff", "png", "jpeg", "gif", "webp", "bmp"] }
psd = "0.3"
kamadak-exif = "0.6"
base64 = "0.22"
# macOS Finder-tag interop: the `_kMDItemUserTags` extended attribute is a binary property list
# (CPE-829, epic CPE-717). Pure-Rust plist (binary + XML) reader/writer, no system libs. The codec is
# cross-platform (round-trip-testable everywhere); only the storage side is macOS-specific.
plist = "1"
# SVG + font glyph-sheet thumbnails (CPE-1236, epic CPE-718). Both pure-Rust, no system libs, no
# browser engine: `resvg` (re-exports `usvg` for XML->scene-tree parsing and `tiny-skia` for
# rasterization) renders `.svg`; `ab_glyph` (already-minimal: pulls in only `ab_glyph_rasterizer` +
# `owned_ttf_parser`) rasterizes `.ttf`/`.otf`/`.woff` glyph outlines. `resvg`'s default features are
# trimmed to just `text` — `system-fonts`/`raster-images`/`gif`/`image-webp` are dropped since we don't
# want a filesystem font-directory scan (non-deterministic across the 3-OS CI matrix) or embedded-raster
# support the thumbnail use case doesn't need.
resvg = { version = "0.45.1", default-features = false, features = ["text"] }
ab_glyph = "0.2.32"
# Encrypted-vaults crypto core (CPE-1247, epic CPE-738): the `age` crate in **passphrase mode** — scrypt
# KDF + ChaCha20-Poly1305 streaming AEAD, pure-Rust, audited. This is the approved crypto dependency; the
# module MUST NOT hand-roll AEAD/KDF/nonces. Pinned to an exact version (the passphrase entry points moved
# across 0.9→0.11). `default-features = false` — age's default feature set is already empty, so this keeps
# armor/ssh/cli-common/plugin out; passphrase (scrypt) support lives in the base crate.
age = { version = "=0.12.1", default-features = false }
# Best-effort wipe of the decrypted-plaintext buffer once it has been unpacked (CPE-1247). The passphrase
# itself is already a zeroize-on-drop `age::secrecy::SecretString`; this covers the intermediate plaintext.
zeroize = "1"
# PDF first-page thumbnail extractor (CPE-1256, epic CPE-718). Optional: `pdfium-render` (MIT/Apache)
# drives a **dynamically loaded** pdfium prebuilt (BSD-3-Clause, Chrome's own PDF engine) — never
# statically linked into the binary; resolved at runtime via `Pdfium::bind_to_library`/
# `bind_to_system_library`. Gated behind the `pdf-thumb` feature (off by default) so the plain build
# carries zero PDF code or the pdfium dependency. See the decision log in research-library entry
# `thumbnail-native-deps-pdf-video-2026-08-02.md` — `mupdf` (AGPL) was rejected outright as a
# copyleft landmine in a distributed, signed binary.
pdfium-render = { version = "0.9", optional = true }
# Configurable real embedder for content search (CPE-1273, epic CPE-976): a blocking HTTP client for an
# OpenAI-compatible `/embeddings` endpoint. Optional + feature-gated (`http-embedder`) so the lean default
# build pulls in zero HTTP/TLS code. NOT a new workspace dependency — `ureq` is already used by
# `cpe-webdav` and the app adapter; this reuses the same crate/version (same pure-Rust rustls TLS, no C
# build tooling), so `cargo tree`/`Cargo.lock` gain no new crate.
ureq = { version = "2", default-features = false, features = ["tls", "gzip"], optional = true }
# DICOM medical-image reading (CPE-1345, gated-format-reader lane). Optional: `dicom-object` (parse the
# file meta + data set) and `dicom-pixeldata` (decode pixel data to raw windowed samples). Both
# pure-Rust, MIT OR Apache-2.0. `default-features = false` + explicit `rayon`/`native` (CPE-1352):
# `dicom-pixeldata`'s default `image` feature pulled its OWN `image` dependency in with
# `default-features = true`, which via Cargo feature-unification expanded the app's already-curated
# `image` dep (`tiff/png/jpeg/gif/webp/bmp` only, see below) to also compile in `exr` + `pnm` decoders
# DICOM never uses — pure ship-cost. `native` keeps the pure-Rust JPEG-baseline/RLE/deflate decoders;
# `rayon` keeps the parallel pixel-transform maps. `dicom.rs::read_dicom_image_data_url` instead reads
# raw windowed pixel bytes via `DecodedPixelData::to_vec_frame_with_options` (un-feature-gated) and
# builds the `image::DynamicImage` itself from the app's own curated `image` dep. The native-codec
# `openjp2`/`charls`/`gdcm` features (JPEG2000/JPEG-LS/vendor libs, all requiring a C toolchain) are
# deliberately left off — a compressed transfer syntax needing one of those cleanly errors instead of
# pulling in native code.
dicom-object = { version = "0.10", optional = true }
dicom-pixeldata = { version = "0.10", default-features = false, features = ["rayon", "native"], optional = true }
# Re-exported transitively by `dicom-object`/`dicom-pixeldata`, but declared directly too since the
# module uses their tag/UID constants and `DataElement`/`VR` types by name.
dicom-core = { version = "0.10", optional = true }
dicom-dictionary-std = { version = "0.10", optional = true }

# POSIX extended attributes for the native-metadata bridge (CPE-826, epic CPE-717). Pure-Rust (libc
# syscalls, no system libs); Unix-only — Windows uses NTFS alternate data streams via std file I/O,
# which needs no dependency.
[target.'cfg(unix)'.dependencies]
xattr = "1"

# Windows registry access for the shell-citizen integration — writing/removing the "Open in CPE"
# context-menu entries under HKCU (CPE-1020, epic CPE-712). Windows-only; same version the app adapter
# already uses. The registration *decision* is pure (`shell_menu::windows_shell_plan`); this only applies it.
# `junction` creates NTFS directory junctions (reparse points) via the correct DeviceIoControl reparse-point
# buffer layout (CPE-1210, epic CPE-715) — hand-rolling that buffer is error-prone, so we take the small,
# focused, Windows-only dep rather than reimplement it. Flagged for review per the ticket.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
junction = "1"

# The ticket-directives MCP server (CPE-962): a stdio MCP server an external agent launches to
# list/reply to Agent Board directives. `ticket-mcp <repo-root>`.
[[bin]]
name = "ticket-mcp"
path = "src/bin/ticket_mcp.rs"

[features]
# Opt-in `specta::Type` derives for the TypeScript-binding codegen (CPE-953). OFF by default.
specta = ["dep:specta"]
# Opt-in instant-search index engine (CPE-832, epic CPE-703). OFF by default so the plain build compiles
# **zero** indexer code (the "small when off" delete-test) — the `index` module needs no extra crates, only
# this gate. Turn on with `--features index` (or from the app adapter that exposes the index commands).
index = []
# Opt-in PDF first-page thumbnail rendering via `pdfium-render` (CPE-1256, epic CPE-718). OFF by
# default so the plain build compiles zero PDF code / pulls in no pdfium dependency (the "small when
# off" rule, mirrored from `index` above). Turn on with `--features pdf-thumb`; ship-enablement (the
# app adapter turning it on + CI/release binary acquisition) is CPE-1258.
pdf-thumb = ["dep:pdfium-render"]
# Opt-in video representative-frame thumbnail extraction by shelling out to a bundled `ffmpeg`
# executable (CPE-1257, epic CPE-718) — never linked in-process, so no `dep:` here at all (this feature
# adds ZERO Cargo dependencies; `cargo tree` is unchanged with it on). OFF by default so the plain build
# compiles zero video code (the "small when off" rule). Turn on with `--features video-thumb`;
# ship-enablement (bundling the ffmpeg binary as a release resource) is CPE-1258.
video-thumb = []
# Opt-in real HTTP embedder for content search (CPE-1273, epic CPE-976). OFF by default so the lean
# default build compiles zero HTTP code / pulls in no `ureq`/TLS stack (the "small when off" rule,
# mirrored from `index`/`pdf-thumb` above). The `http_embedder` module always compiles (its pure
# request-build/parse logic + transport seam are unit-tested with no network); only the real `ureq`
# transport + `connect()` are behind this gate. The app adapter turns it on.
http-embedder = ["dep:ureq"]
# Opt-in real HTTP planner for the AI file copilot (CPE-1275, epic CPE-977). OFF by default so the lean
# default build compiles zero copilot HTTP code / pulls in no `ureq`/TLS stack (the "small when off" rule,
# mirrored from `http-embedder` above). The `copilot_planner`/`copilot` modules always compile (their pure
# prompt-build/parse logic + seams are unit-tested with no network); only the real `ureq` `ChatTransport` +
# `connect()` + `resolve_planner`/`probe_planner` are behind this gate. Reuses `ureq` (no new dep); the app
# adapter turns it on.
copilot = ["dep:ureq"]
# Opt-in DICOM medical-image reading (CPE-1345, gated-format-reader lane). OFF by default so the plain
# build compiles zero DICOM code / pulls in no `dicom-object`/`dicom-pixeldata` dependencies (the "small
# when off" rule, mirrored from `pdf-thumb`/`video-thumb` above). Turn on with `--features dicom-thumb`.
dicom-thumb = ["dep:dicom-object", "dep:dicom-pixeldata", "dep:dicom-core", "dep:dicom-dictionary-std"]

[dev-dependencies]
# Temp dirs for the ticket-board tests (moved from the app with the module, CPE-815).
tempfile = "3"
# Author a real .xlsx in the spreadsheet-preview test (write side; calamine reads).
rust_xlsxwriter = "0.79"
