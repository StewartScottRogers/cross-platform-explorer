# CPE-1710 — see `crates/server/clippy.toml` for the full rationale. Each workspace root needs its own
# copy (this repo has no root `Cargo.toml`).
#
# A rename onto a slot the USER named must be guarded first (`cpe_server::fsutil::rename_into_slot` is the
# shared implementation). Anything else — a protocol server implementing its own rename semantics against
# a sandbox root, a test fixture — takes `#[allow(clippy::disallowed_methods)]` with a one-line reason at
# the site, so the justification lives in the code rather than in a PR description.
disallowed-methods = [
    { path = "std::fs::rename", reason = "replaces its destination silently and destroys a link at it — guard the slot first, or allow with a reason" },
]
