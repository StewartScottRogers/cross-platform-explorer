[package]
name = "cpe-vfs"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Scheme router for the Cross-Platform Explorer (epic CPE-616/CPE-1502): opens the right FileSystemProvider (local / SFTP / WebDAV / FTP) from a saved connection profile + its secret."
license = "MIT"

# The integration seam that ties the connections model (cpe-server::connections) to the concrete remote
# providers: `open(connection, secret, …)` dispatches by scheme to cpe-sftp, cpe-webdav, or cpe-ftp and
# returns a boxed FileSystemProvider. The app fetches the secret from the OS keychain and calls this.
# Standalone (out of any workspace), like the sibling crates.

[dependencies]
cpe-server = { path = "../server" }
cpe-sftp = { path = "../sftp" }
cpe-webdav = { path = "../webdav" }
cpe-ftp = { path = "../ftp" }

[features]
# Forwards to cpe-ftp's own `e2e-extra-ca` (CPE-1673): OFF by default, so a normal build of this crate
# (including the shipped app, via src-tauri's plain dependency on cpe-vfs) never compiles in cpe-ftp's
# throwaway-FTPS-CA test hook. Only `tests/real_server_conformance.rs`'s `ftps_conformance_against_real_vsftpd_with_tls`
# needs it — turned on by the CI real-server-rig job passing `--features e2e-extra-ca` to `cargo test`.
e2e-extra-ca = ["cpe-ftp/e2e-extra-ca"]
