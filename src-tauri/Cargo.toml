[package]
name = "cross-platform-explorer"
version = "0.57.52"
description = "A cross-platform file explorer with one-click install and auto-updates."
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

# The library that Tauri's mobile entry point and desktop main.rs both use.
[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Typed-binding codegen entry (CPE-812). Built only with the `specta-bindings` feature, so a normal
# build/`cargo test` never compiles it (nor the specta deps it links).
[[bin]]
name = "export_bindings"
required-features = ["specta-bindings", "sidecar-platform"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-cli = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Typed-binding codegen (CPE-812, epic CPE-810), all OPTIONAL behind the `specta-bindings` feature so a
# normal build/`cargo test` never compiles them. Version set: tauri-specta docs pin rc.21; specta-typescript
# 0.0.9 requires specta rc.22; tauri-specta rc.22 doesn't exist.
specta = { version = "=2.0.0-rc.22", optional = true }
specta-typescript = { version = "0.0.9", optional = true }
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"], optional = true }
# The Cross-Platform Explorer Server: Tauri-free domain logic behind the `ServerCtx` seam +
# the wire contract (CPE-810/815). A normal (non-optional) dependency — it pulls only
# serde/serde_json/cpe-contract, all already in the tree, so it adds no weight to the plain
# explorer. The app is the thin adapter that provides `TauriCtx` and dispatches to it.
# The `index` feature turns on the instant-search index engine + service (CPE-832/1137, epic CPE-703).
# The app is the adapter that exposes the index commands, so it enables the gate here (the crate default
# stays OFF, keeping `cpe-server`'s own plain build/test the delete-test). Adds no new crates — the index
# is std-only.
# `pdf-thumb` (CPE-1256) + `video-thumb` (CPE-1257) turn on the PDF first-page / video representative-
# frame thumbnail extractors for the shipped build (CPE-1258, epic CPE-718). Both stay feature-gated OFF
# in `cpe-server`'s own default build — enabling them here is what actually ships the code. `pdf-thumb`
# pulls in `pdfium-render`, which loads the pdfium shared library at RUNTIME via `libloading` (never
# statically linked), so the app still *builds and ships* with zero local pdfium install — the native
# libs (pdfium + a bundled ffmpeg) are provisioned as release bundle resources (CPE-1258;
# release-sidecar.yml) and resolved next to the running executable at startup, falling back gracefully
# to the generic type icon if either is missing. `video-thumb` adds zero new crates (shells out to a
# bundled `ffmpeg`, never linked).
# `dicom-thumb` (CPE-1345/1350, epic CPE-102) turns on the DICOM tag reader + pixel-data-to-PNG decoder
# for the shipped build — it stays OFF in `cpe-server`'s own default build; enabling it here is what
# actually ships the code (pulls in the pure-Rust `dicom-object`/`dicom-pixeldata` crates, no native
# codec toolchain required — see `crates/server/Cargo.toml`).
cpe-server = { path = "../crates/server", features = ["index", "pdf-thumb", "video-thumb", "http-embedder", "copilot", "dicom-thumb"] }
# (sha2 moved to `cpe-server` with the checksum/backup/thumbnail domains, CPE-815/821 — no longer a
# direct app dep.)
# (The recursive directory-size walk that used rayon moved to `cpe-server` (CPE-815, disk_usage);
# rayon is no longer a direct app dependency.)

# Editable file timestamps (CPE-785). Pure-Rust, already in the tree transitively — this makes it direct.
filetime = "0.2"

# Optional: the sidecar platform host (ADR 0001), a standalone crate under ../sidecar.
# Compiled ONLY with the `sidecar-platform` feature, so the plain explorer builds and
# ships with zero sidecar code — the delete-test (CPE-272). One-way dependency: the app
# may use the host; the host never depends on the app.
sidecar-host = { path = "../sidecar/host", optional = true }
sidecar-contract = { path = "../sidecar/contract", optional = true }
# The Repositories sidecar's domain crate (CPE-429). Pulled in ONLY to reuse its already-tested,
# hardened `git clone` argv builder for the host `forge_clone` command (CPE-436) — same feature gate,
# so the plain explorer still ships with zero repos/clone code (the delete-test).
repos = { path = "../sidecar/repos", optional = true }

# (Archive listing + create/extract — zip/tar/flate2/sevenz-rust — moved to `cpe-server` with the
# `archive` domain, CPE-815/822 — no longer direct app deps. Also gone: the binary/data preview crates
# goblin/midly/wasmprinter/serde_bencode/calamine/rusqlite/parquet, CPE-815.)
# (image/kamadak-exif/psd moved to `cpe-server` with the thumbnail + image_preview domains, CPE-815 —
# no longer direct app deps. base64 stays: the thumbnail command still encodes the PNG as a data URL.)
base64 = "0.22"
# (iso9660 moved to `cpe-server` with the archive-listing domain, CPE-815 — no longer a direct app dep.)

# The terminal dock's embedded PTY backend (CPE-1242, epic CPE-714): mirrors the proven `PtySession` in
# `sidecar/ai-console/src/pty.rs`. Same version, no drift — it's already a workspace dep there.
# Cross-platform: Windows ConPTY, Unix openpty. Core-explorer feature (not sidecar-gated): the docked
# terminal is additive but always available, like list_dir/thumbnails.
portable-pty = "0.8"

# Live provider API-key verification for the AI Console (CPE-347). Optional + gated behind
# `sidecar-platform` so the plain explorer pulls no HTTP/TLS stack. ureq's default backend is
# pure-Rust rustls — no OpenSSL / system libs.
ureq = { version = "2", optional = true }

# Filesystem-activity watcher for Agent Watch (CPE-398). Optional + gated behind
# `sidecar-platform` so the plain explorer pulls no watcher/thread machinery — off means off
# (AGENT-WATCH.md). notify is pure-Rust on every target (ReadDirectoryChangesW / FSEvents / inotify).
notify = { version = "6", optional = true }

# Delete must go to the OS Recycle Bin / Trash, never `fs::remove_*`. A file
# manager that irreversibly destroys data on a mis-click is dangerous (CPE-030).
trash = "5"

# Free/total disk space for the status bar (CPE-403). Cross-platform (statvfs /
# GetDiskFreeSpaceExW) with no system libs; `sync` = the plain std stat functions.
fs4 = { version = "1", features = ["sync"] }

# The updater plugin only makes sense on desktop targets. Window-state (remember
# window size/position/maximized across restarts, CPE-228) is likewise desktop-
# only — mobile has no free-floating, user-positioned window to restore.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
# Spotlight global hotkey (CPE-1215, epic CPE-704): summons Spotlight (CPE-1216) with an OS-wide chord
# even while the main window is hidden/unfocused. Desktop-only — mobile has no global-shortcut surface.
# Registered with zero shortcuts at startup; Settings opts in (off means no background cost).
tauri-plugin-global-shortcut = "2"

# Native OS drag-OUT plumbing (CPE-1264, epic CPE-661 follow-on for CPE-672/674): starts a real OS-level
# file drag from `startDrag` in `src/lib/dragOut.ts` so a drop lands in Explorer/Finder/other apps — HTML5
# webview drag can't expose real filesystem paths cross-platform. This slice only registers the plugin;
# nothing calls it yet (no row is wired to drag-out). Desktop-only — mobile has no OS drag-out surface.
tauri-plugin-drag = "2"

# Keep the display awake while the app is open (CPE-225). Cross-platform screen-
# lock / screensaver / display-sleep inhibition: Windows SetThreadExecutionState,
# macOS IOPMAssertion, Linux org.freedesktop.ScreenSaver via zbus (no system dbus
# headers needed). Desktop-only — mobile has no equivalent assertion.
keepawake = "0.6"

# Windows known folders (Desktop/Documents/Pictures/...) can be redirected
# anywhere by OneDrive — on a real machine Pictures was found at
# "…\OneDrive\Exteriors Cave Homes\Pictures". No env-var heuristic can find that;
# the registry is the only authoritative source (CPE-025). This is a
# Windows-only dependency, which is exactly why CI also compiles on
# windows-latest (CPE-028).
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
# Windows file attributes (hidden/system/archive) for the attributes editor (CPE-785). Version matches the
# copy Tauri already pulls in, so it's not a second `windows` crate in the tree.
windows = { version = "0.56", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # Safe drive eject (CPE-1278): CreateFileW (needs Win32_Security for SECURITY_ATTRIBUTES) +
    # DeviceIoControl + the FSCTL_LOCK/DISMOUNT + IOCTL_STORAGE_EJECT control codes.
    "Win32_Security",
    "Win32_System_Ioctl",
    "Win32_System_IO",
    # HEIC/HEIF preview via the Windows Imaging Component (CPE-1351, epic CPE-097): WIC decoder +
    # format-converter to 32bpp RGBA (Win32_Graphics_Imaging), plus COM apartment init/CoCreateInstance
    # (Win32_System_Com). Same `windows` dep — just more features, no second crate.
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
] }
# Encrypted-vault passphrase storage in the OS credential store (CPE-1248, epic CPE-738): the ONLY place a
# vault passphrase persists. The `KeyringBackend` adapter (mirroring the sidecar's, CPE-268/322) is the real
# `cpe_server::vault_manager::SecretAccess` impl; `cpe-server` stays Tauri- and keyring-free. Same per-OS
# `keyring` v3 feature set as `sidecar/host` so there's no version/feature drift. Windows Credential Manager.
keyring = { version = "3", features = ["windows-native"] }

# macOS Keychain via the Security framework for vault passphrases (CPE-1248) — pure system framework, no libs.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# HEIC/HEIF preview via ImageIO (CPE-1351, epic CPE-097): pure Rust bindings to the system ImageIO +
# CoreGraphics frameworks — macOS decodes HEIC natively (since 10.13), no Store install needed. All
# permissive (`Zlib OR Apache-2.0 OR MIT`); no bundled C — the frameworks are dynamically linked from
# the OS. objc2 0.6 / objc2-* 0.3 per the vetted plan. objc2 crates gate every type behind a
# per-type feature, so the exact ones the ImageIO decode path names are enabled explicitly.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFURL", "CFCGTypes", "CFBase"] }
objc2-core-graphics = { version = "0.3", features = [
    "CGImage",
    "CGContext",
    "CGColorSpace",
    "CGBitmapContext",
] }
objc2-image-io = { version = "0.3", features = ["CGImageSource", "objc2-core-graphics"] }

# Linux Secret Service over D-Bus (GNOME Keyring / KWallet) for vault passphrases (CPE-1248).
# `sync-secret-service` uses zbus (pure-Rust D-Bus, no libdbus); `crypto-rust` keeps session crypto pure-Rust.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[dev-dependencies]
# (rust_xlsxwriter moved to `cpe-server` dev-deps with the spreadsheet-preview test, CPE-815.)
# Temp dirs for filesystem tests (e.g. the Agent Board project-root walk-up, CPE-554).
tempfile = "3"
# Dev-only: build STRUCTURED image fixtures for the image-similarity integration test. A hand-embedded
# featureless PNG is (correctly) excluded by the CPE-1205 featureless-guard, so the test needs a real
# structured image; matches `cpe-server`'s image dep. Not a runtime dependency.
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
# This feature is used for production builds where `devUrl` is disabled.
default = []
# Opt-in sidecar platform integration (ADR 0001 / CPE-260). OFF by default so the plain
# explorer compiles and ships with no sidecar code whatsoever — the delete-test (CPE-272).
sidecar-platform = ["dep:sidecar-host", "dep:sidecar-contract", "dep:ureq", "dep:notify", "dep:repos"]
# Opt-in typed-binding codegen (CPE-812, epic CPE-810). OFF by default so a normal build/`cargo test`
# never compiles specta/tauri-specta — keeping the default lean AND avoiding the Windows loader failure
# they trigger in a libtest binary. Enabled only for `cargo run --bin export_bindings --features
# specta-bindings`, which regenerates `src/lib/bindings.gen.ts`.
specta-bindings = ["dep:specta", "dep:specta-typescript", "dep:tauri-specta", "cpe-server/specta", "sidecar-contract?/specta", "repos?/specta"]
