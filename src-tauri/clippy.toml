# CPE-1710 — see `crates/server/clippy.toml` for the full rationale. Each workspace root needs its own
# copy because this repo has no root `Cargo.toml`: `crates/server`, `src-tauri`, every `crates/*` and every
# `sidecar/*` are independent roots, and clippy reads `clippy.toml` from the crate root upwards.
#
# A rename onto a slot the USER named -> `cpe_server::fsutil::rename_into_slot`. Anything else ->
# `#[allow(clippy::disallowed_methods)]` with a one-line reason at the site.
disallowed-methods = [
    { path = "std::fs::rename", reason = "replaces its destination silently and destroys a link at it — use cpe_server::fsutil::rename_into_slot for a user-named slot, or allow with a reason" },
]
