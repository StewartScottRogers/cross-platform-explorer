name: GUI smoke

# Headless GUI end-to-end smoke test (CPE-1045): drives the REAL built app via tauri-driver +
# WebdriverIO and asserts `--open <dir>` (CPE-1043, fixed by CPE-1044) actually navigates. This
# pins the exact manual "launch the build and eyeball a screenshot" check that used to be the
# only guard on that flow, so a regression reds this job instead of needing a human to notice.
#
# Two legs today: `gui-smoke` (windows-latest, Edge/msedgedriver) below, and `gui-smoke-linux`
# (CPE-1171 — ubuntu-latest, WebKitWebDriver under xvfb) further down, burning down
# Manual-Test-Burndown row #4 (cross-OS GUI). Both run the IDENTICAL WebdriverIO suite in
# `gui-smoke/` — `wdio.conf.ts` already resolves the app binary + native driver per-OS (see its
# `APP_BINARY`/`TAURI_DRIVER_BIN` `process.platform` branches and `tauri-driver`'s own
# `webkitgtk:browserOptions` vs `ms:edgeOptions` split), so no per-OS spec forking was needed.
# macOS is unsupported by tauri-driver (no WKWebView WebDriver) and stays attended.
#
# `npm test` (both legs' "Run GUI smoke suite" step below) discovers every `gui-smoke/specs/*.smoke.ts`
# automatically via `wdio.conf.ts`'s `specs` glob — no per-spec wiring needed here. CPE-1358 added
# `specs/samples.smoke.ts` this way: it walks EVERY file in the repo's `samples/` tree on the real built
# app and asserts no crash + a rendered/graceful preview for each, reproducing the CPE-1357 PDF-preview
# crash as a regression guard (`documents/malformed.pdf`, run last in that spec so a still-open crash
# doesn't blind the rest of the walk — see that file's header comment).
#
# CPE-1594: the Linux leg is now the BLOCKING gate (its own `if:`/`continue-on-error` below), pinned by
# `gui-smoke/lib/ratchet.ts` against `gui-smoke/known-failing.json` rather than requiring every spec to
# be green — see that file + `gui-smoke/README.md`'s "Reading a CI run" section for how the ratchet
# works and how to retire a known-failing entry. The Windows leg stays a non-blocking diagnostic (CPE-1048
# — WebView2 never gets past `session not created: DevToolsActivePort file doesn't exist` on stock
# `windows-latest`) and is off the push/PR hot path so its 45-minute zero-signal runs stop starving the
# runner queue and stop stamping every push/PR run `cancelled` — see the `gui-smoke` job's own `if:` below.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # CPE-1594: lets a human kick off the Windows leg on demand (Actions tab -> Run workflow) once
  # investigating CPE-1048, without it running unattended on every push/PR.
  workflow_dispatch:
  # CPE-1594: a nightly, off-hot-path run of BOTH legs. For the Windows leg this is the canary for "has
  # the hosted `windows-latest` image started giving WebView2 a working DevToolsActivePort" — when it
  # goes green here, that's the signal to reconsider making it blocking again (see CPE-1048).
  schedule:
    - cron: "0 7 * * *"

# CPE-1266: a newer push/PR to a ref cancels that ref's superseded in-flight run, so rapid pushes
# don't pile up dozens of gui-smoke runs (which, being flaky, could hang and starve the queue).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-smoke:
    name: GUI smoke (windows-latest) — tauri-driver + WebdriverIO
    runs-on: windows-latest
    # CPE-1594: taken off the every-push/every-PR hot path. It has NEVER executed a single assertion in
    # CI (CPE-1048 below) — every session dies before WebDriver even connects — so burning 45 min of
    # `windows-latest` per push/PR bought zero information and its timeout-kill was what stamped the
    # WHOLE workflow run `cancelled` (see gui-smoke.yml's header comment and the CPE-1594 ticket's
    # Actions-API evidence: 796/800 runs `cancelled`, 0 `success`). Runs only on `workflow_dispatch`
    # (manual) or the nightly `schedule:` trigger above — never on `push`/`pull_request`.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    # CPE-1266: hard cap so a hung WebView2 WebDriver session (CPE-1048 flakiness) dies in minutes
    # instead of running to GitHub's 6-hour max and holding a concurrency slot the whole time.
    # CPE-1481 raised this 20 -> 35 -> 45 while the job was still on the hot path, chasing a full run
    # that never happened (CPE-1048). CPE-1594 drops it back down to 15: taken off the hot path, there is
    # no reason to let a job that has never produced one assertion burn a full hour when it *should* die
    # in minutes if DevToolsActivePort is still broken — a nightly canary just needs to fail fast and free
    # the runner, not stretch out hoping for a different outcome.
    timeout-minutes: 15
    # CPE-1048 (Option E — non-blocking): the WebView2 `DevToolsActivePort` startup crash on stock
    # `windows-latest` did NOT clear even with `--no-sandbox`/`--disable-gpu` (the canonical fix), so this
    # job is kept NON-BLOCKING: it still builds + runs the smoke suite (a real diagnostic a human can read
    # on a manual/nightly run, and it goes green on a real desktop / self-hosted runner), but a failure
    # never reds anything (it isn't even wired into a required check). This is a deferral, not a decision
    # that Windows GUI coverage doesn't matter: the real fix is a self-hosted / interactive-session
    # Windows runner (see the research Library entry `gui-smoke-devtoolsactiveport-webview2-ci.md`) — the
    # nightly `schedule:` run above is the canary for when the stock hosted image starts working, at which
    # point this can move back onto the hot path. Until then burndown #1/#2 stay 🔧 for the Windows
    # residual (the Linux leg below is what's blocking and ✅, CPE-1594).
    continue-on-error: true
    # CPE-1048: on stock windows-latest the WebView2 browser process crashes at startup (no GPU,
    # restricted CI session) before it can write the DevToolsActivePort file, so WebDriver session
    # creation fails with "session not created: DevToolsActivePort file doesn't exist" — the harness
    # runs green on a real desktop, only CI needs this. WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS is read
    # by the WebView2 Runtime itself and merged into the *browser* process command line, so setting it
    # here at job level flows down the whole chain: wdio -> tauri-driver -> msedgedriver -> the app ->
    # WebView2. This is the correct channel for Chromium flags — do NOT put them in wdio.conf.ts's
    # `tauri:options.args`, which lands on the app exe's clap-parsed argv and would reject them.
    env:
      WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--disable-gpu --no-sandbox --disable-dev-shm-usage"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # `--no-bundle` skips installer packaging + updater-artifact signing (which needs secrets
      # this job intentionally does not carry) but is still a real Tauri CLI **build** — the CLI
      # subcommand that actually matters for embedding `frontendDist` instead of falling back to
      # `devUrl` (see gui-smoke/README.md and wdio.conf.ts for the CPE-1044 root-cause detail).
      # This is NOT a `--debug` build and NOT a bare `cargo build` — both of those would load the
      # dev server and make `--open` silently no-op, which is the exact regression this job exists
      # to catch.
      - name: Build release binary (tauri build --no-bundle)
        run: npm run tauri build -- --no-bundle

      # Install a msedgedriver matching this runner's Edge/WebView2 version.
      - name: Install msedgedriver-tool
        run: cargo install --git https://github.com/chippers/msedgedriver-tool

      - name: Run msedgedriver-tool and add its dir to PATH
        run: |
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The official WebDriver proxy — version is independent of the Tauri crate version.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install gui-smoke dependencies
        working-directory: gui-smoke
        run: npm ci

      - name: Type-check gui-smoke
        working-directory: gui-smoke
        run: npm run typecheck

      # CPE-1694: the ratchet's own unit tests (gui-smoke/lib/*.test.ts — 71 cases, including every
      # guard CPE-1680/CPE-1698 added) previously ran ONLY when a developer chose to run them locally;
      # nothing in CI ever executed them. Cheap and fast (well under a second) — placed before the ~15/45
      # minute real wdio run on both legs so a broken unit test fails in seconds, not after the full
      # suite. This leg is off the push/PR hot path (see the job `if:` above) and non-blocking
      # (`continue-on-error: true`), so this step's result here only feeds the manual/nightly Windows
      # canary — see gui-smoke-linux's identically-named step below for the leg that actually gates PRs.
      - name: Run gui-smoke unit tests
        working-directory: gui-smoke
        run: npm run test:unit

      - name: Run GUI smoke suite
        working-directory: gui-smoke
        run: npm test

      # CPE-1594: this leg is manual/nightly-only (see the job `if:` above), so its screenshots are
      # rarer than the Linux leg's — but the day CPE-1048 is fixed, a reviewer needs them without
      # rebuilding locally. `if: always()` matters: the `-fail.png` shots (CPE-1149) captured on a
      # failing/timed-out run are exactly what's useful for diagnosing CPE-1048 itself.
      # `include-hidden-files: true` — REQUIRED. `gui-smoke/.screenshots/` starts with a dot, and
      # `actions/upload-artifact@v4` treats any path under a dot-prefixed folder as "hidden" and
      # silently excludes it from the glob by default (confirmed via the action's own docs: "any file
      # beginning with `.` or files within folders beginning with `.`" — this bit the Linux leg on PR
      # #801's first live run: "No files were found ... gui-smoke/.screenshots/**" even though the
      # suite ran to completion and the directory is real and gitignored-but-present). Without this
      # flag the whole artifact step is a no-op on both legs, defeating the ticket's core promise.
      - name: Upload gui-smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-screenshots-windows
          path: gui-smoke/.screenshots/**
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  gui-smoke-linux:
    name: GUI smoke (ubuntu-latest) — tauri-driver + WebdriverIO (CPE-1171)
    runs-on: ubuntu-latest
    # CPE-1266: hard cap so a hung WebKitGTK-under-Xvfb WebDriver session dies in minutes instead of
    # holding a concurrency slot for hours.
    # CPE-1481: raised 20 -> 35 (round 1) -> 45 (round 2), same rationale as the windows leg above —
    # the CPE-1479 mouse fix made specs actually run; 35 min still left the sequential run's media-heavy
    # back half (~18 of 39 specs) unrun at the cap. 45 gives margin; sharding (CPE-1266) is the real fix.
    timeout-minutes: 45
    # CPE-1594: this leg is now the BLOCKING gate — `continue-on-error` removed. It has run the whole
    # 40-spec suite to completion in CI (33 passed / 7 failed / 100% completed, ~28 min, confirmed on
    # PR #801's own live run — one of those 7, `network.smoke.ts`, had a stale test selector fixed in
    # this same PR, but the corrected selector STILL fails live on this WebKitGTK/Xvfb stack, the same
    # class of `.fav-title` `getText()` issue `saved-search.smoke.ts` is already known-failing for — see
    # `gui-smoke/known-failing.json`'s entry for it — so the baseline stays 7, not 6), so "flaky" was
    # never the right diagnosis; the fix is a ratchet, not more slack. The suite's own exit code below is
    # deliberately swallowed (`|| true`) — the "Ratchet — no new GUI regressions" step owns the verdict:
    # since CPE-1677 it works at TEST-CASE granularity, so it reds the job on any CASE failing that ISN'T
    # in `gui-smoke/known-failing.json` (including a case inside a spec file that already has entries
    # there — the hole CPE-1677 closed), on a known-failing case starting to PASS (the ratchet is one-way
    # — see `gui-smoke/lib/ratchet.ts`), on a listed case title matching no test at all (titles drift), or
    # on the run not completing at all (fewer spec files reporting than `specs/*.smoke.ts` globs to — the
    # exact "timeout kills the job and the whole run reads as cancelled" failure mode this ticket exists
    # to fix). WebKitGTK-under-Xvfb's own class of headless-CI flakiness (GPU-less compositing crashes,
    # cold-start jitter) is still possible — that shows up as an `incomplete` ratchet failure, which is
    # the correct, honest verdict for it, not a swallowed non-blocking log nobody reads.
    env:
      # Analogous to the Windows leg's WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: a defensive,
      # commonly-recommended mitigation for WebKitGTK compositor crashes on GPU-less/restricted CI
      # sessions (the Tauri docs' "Linux Graphics Issues" page lists this as the last-resort fix for
      # silent crashes under Xvfb). Best-effort — not verified live yet (see PR description).
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Same package set the ubuntu-latest leg of the 3-OS `Backend` job (.github/workflows/ci.yml)
      # already builds `cargo tauri build` with, plus the two packages unique to WebDriver-under-CI:
      # `webkit2gtk-driver` (installs `/usr/bin/WebKitWebDriver`, already on PATH — tauri-driver's own
      # `which::which("WebKitWebDriver")` PATH lookup needs no extra step) and `xvfb` (the virtual
      # display GTK needs to initialize at all in a headless session; tauri-driver must be started
      # AFTER a display exists — wrapping the whole `npm test` invocation in `xvfb-run` below, rather
      # than just the app, sets `DISPLAY` before tauri-driver's own child process ever spawns, which
      # sidesteps the known "Failed to initialize gtk backend" ordering trap).
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Same rationale as the Windows leg's identically-named step above: `--no-bundle` skips
      # installer packaging + signing, not the CLI `build` subcommand that embeds `frontendDist`
      # (see the CPE-1044 comment on the Windows step and in wdio.conf.ts). No display needed for a
      # build, so this step does not need `xvfb-run`.
      - name: Build release binary (tauri build --no-bundle)
        run: npm run tauri build -- --no-bundle

      # The official WebDriver proxy — version is independent of the Tauri crate version. Locates
      # `WebKitWebDriver` via PATH on Linux automatically (tauri-driver's own per-OS default —
      # `msedgedriver.exe` on Windows, `WebKitWebDriver` on Linux); no `--native-driver` flag needed
      # since `webkit2gtk-driver` above already put it at `/usr/bin/WebKitWebDriver`.
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install gui-smoke dependencies
        working-directory: gui-smoke
        run: npm ci

      - name: Type-check gui-smoke
        working-directory: gui-smoke
        run: npm run typecheck

      # CPE-1694: the ratchet's own unit tests (gui-smoke/lib/*.test.ts — 71 cases, including every
      # guard CPE-1680/CPE-1698 added) previously ran ONLY when a developer chose to run them locally;
      # nothing in CI ever executed them. `test:unit`'s glob (`lib/**/*.test.ts`) already covers every
      # test file in this repo — CPE-1680 moved the ratchet's reduction logic (`toCaseStatus`,
      # `reduceResultChunks`) from `scripts/run-ratchet.ts` into `lib/ratchet.ts`, and no `.test.ts` file
      # lives under `gui-smoke/scripts/`, so the glob needed no widening. THIS is the leg that gates: it
      # runs on every `push`/`pull_request` (this job carries no `if:` skip, unlike the Windows leg above)
      # and has no `continue-on-error`, so a failing unit test reds the PR the same way the ratchet step
      # below does. Placed before the ~45-minute real wdio run so a broken unit test fails in seconds
      # instead of after the full suite.
      - name: Run gui-smoke unit tests
        working-directory: gui-smoke
        run: npm run test:unit

      # `xvfb-run` wraps the whole test command in a fake X display so tauri-driver -> WebKitWebDriver
      # -> the app's GTK/WebKitGTK webview can all initialize headlessly (see the system-deps comment
      # above for why the WHOLE command, not just the app, needs to run under it).
      # CPE-1594: `|| true` deliberately swallows wdio's own exit code — a run with known-failing specs
      # is EXPECTED to exit non-zero here, and the "Ratchet" step below is what actually decides pass/
      # fail (see its comment and `gui-smoke/lib/ratchet.ts`). This also lets the suite step finish
      # normally (rather than the job aborting) so the JSON reporter output + screenshots below always
      # exist to upload/ratchet, even on a run with failures.
      - name: Run GUI smoke suite (xvfb-run)
        working-directory: gui-smoke
        run: xvfb-run --auto-servernum npm test || true

      # CPE-1594: the actual gate, and DELIBERATELY the very next step after the suite — nothing that
      # can fail (like the screenshot upload below) is allowed to sit between the suite finishing and
      # this step running, because that would let an unrelated step's failure silently skip the verdict
      # (default step conditions require the previous step to have succeeded — see PR #801's first live
      # run, where `if-no-files-found: error` on the OLD upload-before-ratchet ordering aborted the job
      # before the ratchet ever executed: no ratchet output anywhere in that log). Reads the JSON results
      # `wdio.conf.ts`'s `json` reporter just wrote to `gui-smoke/.results/` and compares against
      # `gui-smoke/known-failing.json`. Exits non-zero (redding this job, and — unlike every other step
      # here — WITHOUT `continue-on-error` — this is a hard gate) on a new failing CASE, a listed case
      # that now passes, a listed case title that matches no test, or an incomplete run (CPE-1677). Its
      # log also prints every failing case by name, so a verdict can never again be byte-identical across
      # a clean run and a run with a broken case inside an already-listed spec file. See
      # `gui-smoke/lib/ratchet.ts` for the exact rules and `gui-smoke/README.md` for how to retire an
      # entry once its case is fixed.
      - name: Ratchet — no new GUI regressions
        working-directory: gui-smoke
        run: npm run ratchet

      # CPE-1594: unlocks the CPE-1148 Visual Critic in CI — before this, the ~75 `snap()` calls per run
      # wrote to a gitignored dir on an ephemeral runner and were simply discarded, so nothing (human or
      # agent) could ever review a PR's rendered UI without a Foreman rebuilding locally. `if: always()`
      # matters both for running after a RATCHET failure (screenshots are still useful evidence when the
      # gate reds) and for running after a suite crash. `include-hidden-files: true` — REQUIRED.
      # `gui-smoke/.screenshots/` starts with a dot, and `actions/upload-artifact@v4` treats any path
      # under a dot-prefixed folder as "hidden" and silently excludes it from the glob by default
      # (confirmed via the action's own docs: "any file beginning with `.` or files within folders
      # beginning with `.`"). This bit PR #801's first live run: "No files were found ...
      # gui-smoke/.screenshots/**" even though the suite ran to completion and genuinely wrote PNGs —
      # without this flag the artifact step is a silent no-op on every run, defeating the ticket's core
      # promise. `if-no-files-found: warn` (not `error`, unlike the PR #801 original) — a missing gallery
      # is now a loud step warning, not something that can ever again abort the job and mask the ratchet
      # verdict above; the ratchet, not the screenshot upload, owns whether this leg is red or green.
      # Retrieve with `gh run download <run-id> -n gui-smoke-screenshots-ubuntu -D <dir>` (see
      # gui-smoke/README.md "Reading a CI run").
      - name: Upload gui-smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-screenshots-ubuntu
          path: gui-smoke/.screenshots/**
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true
