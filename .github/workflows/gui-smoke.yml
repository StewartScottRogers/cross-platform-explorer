name: GUI smoke

# Headless GUI end-to-end smoke test (CPE-1045): drives the REAL built app via tauri-driver +
# WebdriverIO and asserts `--open <dir>` (CPE-1043, fixed by CPE-1044) actually navigates. This
# pins the exact manual "launch the build and eyeball a screenshot" check that used to be the
# only guard on that flow, so a regression reds this job instead of needing a human to notice.
#
# Two legs today: `gui-smoke` (windows-latest, Edge/msedgedriver) below, and `gui-smoke-linux`
# (CPE-1171 — ubuntu-latest, WebKitWebDriver under xvfb) further down, burning down
# Manual-Test-Burndown row #4 (cross-OS GUI). Both run the IDENTICAL WebdriverIO suite in
# `gui-smoke/` — `wdio.conf.ts` already resolves the app binary + native driver per-OS (see its
# `APP_BINARY`/`TAURI_DRIVER_BIN` `process.platform` branches and `tauri-driver`'s own
# `webkitgtk:browserOptions` vs `ms:edgeOptions` split), so no per-OS spec forking was needed.
# macOS is unsupported by tauri-driver (no WKWebView WebDriver) and stays attended.
#
# CPE-1753: the Linux leg is now THREE jobs, not one — `gui-smoke-linux-build` (compiles the app once),
# `gui-smoke-linux` (a 4-way matrix, each shard running a disjoint quarter of the spec files) and
# `gui-smoke-linux-verdict` (the join that owns the pass/fail verdict for the whole suite). The old single
# job had reached 41.70 minutes on a fully healthy GREEN run against its own 45-minute cap, and suite
# duration scales with spec count at 0.73-1.80 min per added spec file, so 2-4 more specs would have
# killed it mid-suite on every PR with no verdict left to report. Read `gui-smoke/lib/shard.ts`'s header
# for the design and `gui-smoke/README.md` "Sharding" for how to read a run — in particular why a MISSING
# SHARD has to be a red rather than a smaller expectation.
#
# `npm test` (each leg's "Run GUI smoke suite" step below) discovers every `gui-smoke/specs/*.smoke.ts`
# automatically via `wdio.conf.ts` (which enumerates them through `lib/specFiles.ts` and, on a shard job,
# keeps only that shard's slice) — no per-spec wiring needed here. CPE-1358 added
# `specs/samples.smoke.ts` this way: it walks EVERY file in the repo's `samples/` tree on the real built
# app and asserts no crash + a rendered/graceful preview for each, reproducing the CPE-1357 PDF-preview
# crash as a regression guard (`documents/malformed.pdf`, run last in that spec so a still-open crash
# doesn't blind the rest of the walk — see that file's header comment).
#
# CPE-1594: the Linux leg is now the BLOCKING gate (its own `if:`/`continue-on-error` below), pinned by
# `gui-smoke/lib/ratchet.ts` against `gui-smoke/known-failing.json` rather than requiring every spec to
# be green — see that file + `gui-smoke/README.md`'s "Reading a CI run" section for how the ratchet
# works and how to retire a known-failing entry. The Windows leg stays a non-blocking diagnostic (CPE-1048
# — WebView2 never gets past `session not created: DevToolsActivePort file doesn't exist` on stock
# `windows-latest`) and is off the push/PR hot path so its 45-minute zero-signal runs stop starving the
# runner queue and stop stamping every push/PR run `cancelled` — see the `gui-smoke` job's own `if:` below.
on:
  push:
    branches: [main]
    # CPE-1781: same reasoning as ci.yml's identical block — see it for the full writeup, including
    # WHY `Ticketing/**` is wrong (it swallows `Ticketing/Epics/**`, which
    # `src/lib/epicsQueueLayout.test.ts` reads as a real test input in the `frontend` job of ci.yml)
    # and WHY the "required check" framing this comment used to carry was factually wrong for this
    # repo (no branch protection, no required status checks, and `main` moves by direct push as often
    # as by PR). Narrowed to `Ticketing/Tickets/**` and `Ticketing/Sprints/**` — the two trees a
    # routine ticketing-workflow commit actually touches, neither read by any test or build step —
    # plus `.claude/**` (verified inert: prose-only references, no `run:` step reads it, already
    # excluded from vitest). Not a blanket `**/*.md`: `src/docs/*.md` is guarded by
    # `sectionDocs.test.ts` (in ci.yml, not this workflow), and `docs/design/*.md` is kept out
    # conservatively rather than because a specific guard reads it today — see ci.yml's identical note
    # for the correction of an earlier, wrong CPE-1761 citation here. Naming only the two unambiguous
    # ticketing paths avoids having to reason per-workflow about which Markdown is a shipped input.
    # PUSH ONLY, not `pull_request` below: the
    # `pull_request` trigger carries no path filter, so any change routed through a PR still gets the
    # full run regardless of diff — that, plus direct-push discipline, is this repo's only automated
    # signal (there being no required-check mechanism to fall back on), and the filtered `push` run
    # was the only signal a direct-to-`main` `Ticketing/Tickets/**`/`Ticketing/Sprints/**`/`.claude/**`
    # -only commit would otherwise have gotten — a deliberate, understood trade, not a gap assumed
    # covered elsewhere.
    paths-ignore:
      - "Ticketing/Tickets/**"
      - "Ticketing/Sprints/**"
      - ".claude/**"
  pull_request:
    branches: [main]
  # CPE-1594: lets a human kick off the Windows leg on demand (Actions tab -> Run workflow) once
  # investigating CPE-1048, without it running unattended on every push/PR.
  workflow_dispatch:
  # CPE-1594: a nightly, off-hot-path run of BOTH legs. For the Windows leg this is the canary for "has
  # the hosted `windows-latest` image started giving WebView2 a working DevToolsActivePort" — when it
  # goes green here, that's the signal to reconsider making it blocking again (see CPE-1048).
  schedule:
    - cron: "0 7 * * *"

# CPE-1266: a newer push/PR to a ref cancels that ref's superseded in-flight run, so rapid pushes
# don't pile up dozens of gui-smoke runs (which, being flaky, could hang and starve the queue).
# CPE-1781 keeps this as-is (see ci.yml's identical note): correct for rapid CODE pushes, and no
# longer contended-for by bookkeeping-only pushes now that those don't start a run at all.
#
# CPE-1799 applies the same `main`-only carve-out as ci.yml — read that file's block for the full
# reasoning, the measured cancellation rate, and the empirical check that `concurrency:` really does
# evaluate this expression. Only what is specific to THIS workflow is repeated here.
#
# WHY THIS WORKFLOW IS IN SCOPE TOO, rather than leaving it cancelling to save runners. A tempting
# cheaper option was to protect only ci.yml, on the theory that it is the one that catches the
# named duplicate-symbol interaction class. But that class is only the example, not the boundary:
# ci.yml catches interactions that break the COMPILE, and the Linux legs below — the blocking gate
# since CPE-1594, ratcheted against `known-failing.json` — are the only thing that catches an
# interaction between two PRs that compiles perfectly and misbehaves at RUNTIME in the real built
# app. Protecting one and not the other would leave the net with a hole shaped exactly like the
# defects that are hardest to find by reading a diff. The pending-supersession mechanic described in
# ci.yml means including this workflow costs `1 + ceil(burst_span / run_duration)` coalesced runs per
# merge burst rather than one run per merge — 2 for a burst inside a single run duration, 3 for one
# spanning two, not a flat number — which is affordable; and the hang risk that motivated CPE-1266 is
# held by the per-job `timeout-minutes` caps below, which are what actually stop a wedged WebDriver
# from holding a slot, not by cancel-in-progress. Verdict latency roughly doubles here too, for the
# same queue-behind-the-in-flight-run reason ci.yml's LATENCY note spells out.
#
# Note the `schedule:` and `workflow_dispatch:` triggers above also carry `github.ref` =
# `refs/heads/main`, so they stop being cancellable by an incoming merge as well. That is wanted:
# the nightly run is the CPE-1048 canary that CPE-1594 depends on to decide when the Windows leg can
# become blocking again, and a merge landing mid-run used to be able to destroy that night's reading.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # False on `main`, true everywhere else. See ci.yml's block — same expression, same reasoning.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gui-smoke:
    name: GUI smoke (windows-latest) — tauri-driver + WebdriverIO
    runs-on: windows-latest
    # CPE-1594: taken off the every-push/every-PR hot path. It has NEVER executed a single assertion in
    # CI (CPE-1048 below) — every session dies before WebDriver even connects — so burning 45 min of
    # `windows-latest` per push/PR bought zero information and its timeout-kill was what stamped the
    # WHOLE workflow run `cancelled` (see gui-smoke.yml's header comment and the CPE-1594 ticket's
    # Actions-API evidence: 796/800 runs `cancelled`, 0 `success`). Runs only on `workflow_dispatch`
    # (manual) or the nightly `schedule:` trigger above — never on `push`/`pull_request`.
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    # CPE-1266: hard cap so a hung WebView2 WebDriver session (CPE-1048 flakiness) dies in minutes
    # instead of running to GitHub's 6-hour max and holding a concurrency slot the whole time.
    # CPE-1481 raised this 20 -> 35 -> 45 while the job was still on the hot path, chasing a full run
    # that never happened (CPE-1048). CPE-1594 drops it back down to 15: taken off the hot path, there is
    # no reason to let a job that has never produced one assertion burn a full hour when it *should* die
    # in minutes if DevToolsActivePort is still broken — a nightly canary just needs to fail fast and free
    # the runner, not stretch out hoping for a different outcome.
    timeout-minutes: 15
    # CPE-1048 (Option E — non-blocking): the WebView2 `DevToolsActivePort` startup crash on stock
    # `windows-latest` did NOT clear even with `--no-sandbox`/`--disable-gpu` (the canonical fix), so this
    # job is kept NON-BLOCKING: it still builds + runs the smoke suite (a real diagnostic a human can read
    # on a manual/nightly run, and it goes green on a real desktop / self-hosted runner), but a failure
    # never reds anything (it isn't even wired into a required check). This is a deferral, not a decision
    # that Windows GUI coverage doesn't matter: the real fix is a self-hosted / interactive-session
    # Windows runner (see the research Library entry `gui-smoke-devtoolsactiveport-webview2-ci.md`) — the
    # nightly `schedule:` run above is the canary for when the stock hosted image starts working, at which
    # point this can move back onto the hot path. Until then burndown #1/#2 stay 🔧 for the Windows
    # residual (the Linux leg below is what's blocking and ✅, CPE-1594).
    continue-on-error: true
    # CPE-1048: on stock windows-latest the WebView2 browser process crashes at startup (no GPU,
    # restricted CI session) before it can write the DevToolsActivePort file, so WebDriver session
    # creation fails with "session not created: DevToolsActivePort file doesn't exist" — the harness
    # runs green on a real desktop, only CI needs this. WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS is read
    # by the WebView2 Runtime itself and merged into the *browser* process command line, so setting it
    # here at job level flows down the whole chain: wdio -> tauri-driver -> msedgedriver -> the app ->
    # WebView2. This is the correct channel for Chromium flags — do NOT put them in wdio.conf.ts's
    # `tauri:options.args`, which lands on the app exe's clap-parsed argv and would reject them.
    env:
      WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: "--disable-gpu --no-sandbox --disable-dev-shm-usage"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # `--no-bundle` skips installer packaging + updater-artifact signing (which needs secrets
      # this job intentionally does not carry) but is still a real Tauri CLI **build** — the CLI
      # subcommand that actually matters for embedding `frontendDist` instead of falling back to
      # `devUrl` (see gui-smoke/README.md and wdio.conf.ts for the CPE-1044 root-cause detail).
      # This is NOT a `--debug` build and NOT a bare `cargo build` — both of those would load the
      # dev server and make `--open` silently no-op, which is the exact regression this job exists
      # to catch.
      # CPE-1865: `npm run tauri build` drives the Tauri CLI, which has no flag to pass `--locked`
      # through to the `cargo build` it runs internally -- so this is a real, separate
      # `cargo check --locked` against the SAME `src-tauri/Cargo.lock` the step below is about to
      # build the real (not `tauri dev`) binary from, run immediately before it.
      - name: Verify src-tauri/Cargo.lock is current before the real build (CPE-1865)
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: Build release binary (tauri build --no-bundle)
        run: npm run tauri build -- --no-bundle

      # Install a msedgedriver matching this runner's Edge/WebView2 version.
      - name: Install msedgedriver-tool
        run: cargo install --git https://github.com/chippers/msedgedriver-tool

      - name: Run msedgedriver-tool and add its dir to PATH
        run: |
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # The official WebDriver proxy — version is independent of the Tauri crate version.
      #
      # CPE-1772 nit: this Windows leg is schedule/dispatch-only (see the job `if:` above), so it was
      # never part of this ticket's evidence trail — but its Linux twin (`gui-smoke-linux-build`'s
      # "Install tauri-driver") got a `timeout-minutes` and this one hadn't, which reads as an
      # oversight rather than a deliberate choice. Added for consistency; low value given how rarely
      # this leg runs, but a hang here now fails named instead of riding to the job's own 15-minute cap.
      #
      # CPE-1843: VERSION-PINNED, and the pin is load-bearing — do not drop it back to "whatever
      # crates.io has newest today". `wdio.conf.ts`'s `beforeSession` spawns this binary with `--port
      # 4444 --native-port 4445` and then waits on BOTH of those ports before letting WDIO issue its
      # first `POST /session` (the CPE-1772 + CPE-1832 startup-race fix). That harness depends on this
      # exact binary's CLI in two DIFFERENT ways, and the difference is the whole point:
      #
      #   * `--port` / `--native-port` — the harness passes both EXPLICITLY (wdio.conf.ts, the `spawn`
      #     in `beforeSession`), so what matters is only that the flag NAMES still exist and still take a
      #     port NUMBER. Their defaults do NOT matter here: an explicit value overrides them, so a
      #     re-defaulted `--port`/`--native-port` cannot silently break this harness. And a RENAMED one
      #     cannot break it silently either — tauri-driver rejects unknown args (`args.finish()` errors
      #     on anything extraneous), so the process dies loudly at spawn.
      #   * `--native-host` — the harness does NOT pass this, and polls `127.0.0.1`, which is only that
      #     flag's DEFAULT. This is the one that can rot silently: if upstream ever re-defaults the
      #     native host, tauri-driver would put the native driver somewhere the harness never looks and
      #     the wait would time out with a misleading "never accepted a connection" message pointing at
      #     the wrong thing entirely. The silent-re-default argument applies HERE, not to the two flags
      #     above.
      #
      # Verified for 2.0.6 by reading its own `src/cli.rs`: `args.value_from_str("--port")
      # .unwrap_or(4444)`, `--native-port` -> 4445, `--native-host` -> "127.0.0.1", plus the
      # `args.finish()` strictness. 2.0.6 was also the newest published version on crates.io when this
      # pin was added, so pinning changed nothing about what CI installs today — it only stops a future
      # upstream release from changing any of the above without anyone deciding to accept it.
      # WHEN YOU BUMP THIS: re-read the new version's `src/cli.rs`, confirm the two flag names and
      # `--native-host`'s default, and update TAURI_DRIVER_PORT / NATIVE_DRIVER_PORT (or start passing
      # `--native-host`) in `gui-smoke/wdio.conf.ts` if anything moved. The other install site in this
      # file (`gui-smoke-linux-build`) must be bumped in lockstep.
      - name: Install tauri-driver
        timeout-minutes: 8
        run: cargo install tauri-driver --version 2.0.6 --locked

      - name: Install gui-smoke dependencies
        working-directory: gui-smoke
        run: npm ci

      - name: Type-check gui-smoke
        working-directory: gui-smoke
        run: npm run typecheck

      # CPE-1694: the ratchet's own unit tests (gui-smoke/lib/*.test.ts — 71 cases, including every
      # guard CPE-1680/CPE-1698 added) previously ran ONLY when a developer chose to run them locally;
      # nothing in CI ever executed them. Cheap and fast (well under a second) — placed before the ~15/45
      # minute real wdio run on both legs so a broken unit test fails in seconds, not after the full
      # suite. This leg is off the push/PR hot path (see the job `if:` above) and non-blocking
      # (`continue-on-error: true`), so this step's result here only feeds the manual/nightly Windows
      # canary — see gui-smoke-linux's identically-named step below for the leg that actually gates PRs.
      #
      # `package.json`'s `test:unit` script was narrowed from `lib/**/*.test.ts` to `lib/*.test.ts` as
      # part of this ticket: the double-star glob relies on bash's `globstar` shell option, which is OFF
      # by default — a real run on gui-smoke-linux's `bash -e {0}` step shell (and `npm`'s own `sh -c`
      # wrapper around the script itself, which doesn't support globstar at all) failed with "Could not
      # find '.../lib/**/*.test.ts'" every time, regardless of whether the tests themselves passed. Since
      # every test file sits flat directly under `lib/` (no nested subdirectories), a single `*` is both
      # correct today and portable across every POSIX shell without needing any shell option.
      - name: Run gui-smoke unit tests
        working-directory: gui-smoke
        run: npm run test:unit

      - name: Run GUI smoke suite
        working-directory: gui-smoke
        run: npm test

      # CPE-1594: this leg is manual/nightly-only (see the job `if:` above), so its screenshots are
      # rarer than the Linux leg's — but the day CPE-1048 is fixed, a reviewer needs them without
      # rebuilding locally. `if: always()` matters: the `-fail.png` shots (CPE-1149) captured on a
      # failing/timed-out run are exactly what's useful for diagnosing CPE-1048 itself.
      # `include-hidden-files: true` — REQUIRED. `gui-smoke/.screenshots/` starts with a dot, and
      # `actions/upload-artifact@v4` treats any path under a dot-prefixed folder as "hidden" and
      # silently excludes it from the glob by default (confirmed via the action's own docs: "any file
      # beginning with `.` or files within folders beginning with `.`" — this bit the Linux leg on PR
      # #801's first live run: "No files were found ... gui-smoke/.screenshots/**" even though the
      # suite ran to completion and the directory is real and gitignored-but-present). Without this
      # flag the whole artifact step is a no-op on both legs, defeating the ticket's core promise.
      - name: Upload gui-smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-screenshots-windows
          path: gui-smoke/.screenshots/**
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  # CPE-1753: the Linux leg is now THREE jobs — build once, fan out to a matrix of shards, join on a
  # single verdict — instead of one 41.70-minute job. See `gui-smoke/lib/shard.ts`'s header for the full
  # rationale and `gui-smoke/README.md` "Sharding" for how to read a run.
  #
  # WHY, measured. Before this change, a fully healthy GREEN run of the old single job took 41.70 min
  # against its own 45-minute cap (run 31871682587, head 856dbebc): 1.30 min checkout/apt/node/frontend,
  # 9.65 min `tauri build --no-bundle`, 0.75 min driver + gui-smoke deps + typecheck + unit tests, 29.93
  # min suite, 0.33 min verdict/upload tail. Suite duration scales with spec count — bucketed by the spec
  # count at each run's own head sha, 40 specs ran 27.50/28.15/29.25 min (n=6) and 41 specs ran
  # 29.57/29.95/30.42 (n=4), disjoint ranges, +1.80 min at the median per added spec and 0.73 min/spec
  # flat-averaged. The repo went 22 -> 39 -> 41 specs between 2026-08-01 and 08-15, so two to four more
  # spec files would have breached the cap — and unlike CPE-1728's cancellations, `if: always()` cannot
  # rescue that, because a job killed at its own cap leaves no verdict to report. A step-level cap was
  # tried in CPE-1728 and removed: the usable window was [30.4, 32.5], about two minutes, narrower than
  # one spec file's growth.
  #
  # WHY BUILD ONCE rather than a plain matrix. The 9.65-minute release build is 81% of the pre-suite
  # setup. Four shards each doing their own build would burn ~39 min of extra runner time per run, have
  # four jobs racing to write the same `swatinem/rust-cache` key, and still leave every shard at ~19 min.
  # Building once and shipping the binary + `tauri-driver` to the shards as one artifact puts each shard
  # at roughly 2.5 min of setup plus its slice of the suite, and — the part that matters for the growth
  # curve — the build job's duration does not depend on the spec count AT ALL, while the shards divide it.
  #
  # THE PRIZE IS BIGGER THAN THE CAP. `concurrency: cancel-in-progress` (CPE-1266) means any second push
  # within the run's own wall clock kills the in-flight verdict; 31% of sampled PR runs died that way
  # (CPE-1728's measurement). No timeout value fixes that — only a shorter run does.
  #
  # AFTER, measured on this change's own TWO green runs — both at 41 specs, the SAME spec count as the
  # 41.70-minute before-run, so it is a like-for-like comparison. Two samples rather than one deliberately:
  # a single measurement at a fixed input size is exactly what made the old job look near-deterministic
  # (stdev 0.102 min) right up until it was measured across spec counts.
  #                       run 31903995127   run 31906687574
  #                       (head aad21a57)   (head 5f508a8f)
  #   build                    9.58              11.53      (`tauri build` 7.78 / 9.53 of it)
  #   shard 1  (11 specs)      7.15              10.15
  #   shard 2  (10 specs)     14.27              16.22   <- the long pole (0.87 setup + 13.32 suite in #1)
  #   shard 3  (10 specs)      6.68               8.93
  #   shard 4  (10 specs)      6.40               6.28
  #   verdict                  0.38               0.35
  #   LONGEST SINGLE JOB      14.27              16.22      vs 41.70 before  ->  -61% to -66%
  # Whole-leg wall clock was 25.68 min in run #1 (vs 41.70, -38%); run #2's 34.80 is not comparable — 6.6
  # of it was the verdict job waiting for a free runner while four other PRs' matrices were in flight,
  # which is queue time, not job time. The per-JOB numbers are what the caps and the growth curve are
  # about, and those are the two columns above.
  # Both runs' verdict job reported `41/41 spec file(s) reported ... manifests received from shard(s):
  # 1, 2, 3, 4` and `92 passed, 25 failed, 25 known-failing listed` — the semantics of the unsharded run,
  # reassembled from four. Run #1's merged screenshot artifact was verified by DOWNLOAD to be 82 PNGs flat
  # at the root with zero nested directories (the pre-sharding gallery was also 82).
  #
  # THE LONG POLE IS ONE SPEC FILE, NOT THE SHARD COUNT. Shard 2's 13.32-minute suite against ~5.5-6.2 for
  # the others is `samples.smoke.ts` (46 cases, roughly 8 of those minutes on its own). Raising the shard
  # count cannot get any shard below that floor — the next real lever, if the long pole ever becomes the
  # binding constraint again, is SPLITTING `samples.smoke.ts`, not adding shards. (That is a bigger change
  # than it looks: 25 of `known-failing.json`'s entries name it, and the `spec` field is the exemption
  # key.)
  #
  # HEADROOM, stated honestly in both directions. A new spec file joins ONE shard, and round-robin over a
  # sorted list rotates which. At 0.73-1.80 min per added spec: averaged over the rotation the long pole
  # gains 0.18-0.45 min per spec added to the repo, so the 13.78 min between the WORSE observed long pole
  # (16.22) and the 30-minute shard cap absorbs roughly 30-76 more spec files; in the adversarial case
  # where every new spec is heavy AND lands on the long-pole shard, about 7. Before this change the same
  # margin was 2-4 spec files, full stop.
  #
  # ---------------------------------------------------------------------------------------------------
  # CPE-1858 — THE LONG POLE WAS HALF INHERENT. The block above is correct that no shard count gets below
  # `samples.smoke.ts`'s own ~8 minutes. It was wrong to leave the rest there: under round-robin the shard
  # that drew that file carried it ON TOP OF a full ninth of everything else, so it ran ~14 min against
  # ~6-7 for its siblings on EVERY run — three consecutive sightings (this workflow's own runs
  # 32585350872 / 32589428833 / 32592641384: 12.67 / 12.67 / 12.70 min of in-session suite against
  # 4.7-5.7 for the other three) with nothing causal in any diff.
  #
  # MEASURED per spec file, from those three runs' `gui-smoke-results-ubuntu-shard-<n>` artifacts (each
  # `wdio-*.json`'s top-level start/end is one spec file's in-session wall time), mean of 3:
  #   samples.smoke.ts       479.3 s  (479.5 / 479.7 / 478.8 — n=3, spread 0.9 s)
  #   preview-pane.smoke.ts   18.2 s
  #   network.smoke.ts        16.2 s
  #   saved-search.smoke.ts   12.0 s
  #   the other 37         1.3-4.0 s
  #   ALL 41                 611.5 s  <- ONE spec file is 78% of it
  # plus a fixed ~29.5 s of session setup/teardown per spec file (`span - sum(durations)` per shard:
  # 29.9 / 29.0 / 30.6 / 29.0 s), which for 40 of the 41 specs DWARFS the spec's own work.
  #
  # So `lib/shard.ts#assignShardSpecs` now cost-weights (session overhead + measured-or-default runtime)
  # and longest-processing-time-first bin-packs onto the least-loaded shard, instead of dealing round-
  # robin. That gives `samples.smoke.ts` a shard of its own and spreads the other 40 evenly. PREDICTED
  # in-session, against the three runs above:
  #                        before (measured)        after (predicted)
  #   shard 1                   5.62                    8.48   <- samples.smoke.ts alone; the real floor
  #   shard 2                  12.67                    7.65
  #   shard 3                   5.45                    7.11
  #   shard 4                   4.78                    7.11
  #   LONG POLE                12.67                    8.48   (job time ~14.0 -> ~9.8, +1.33 min setup)
  # Four shards is still right: with the heaviest file isolated, adding shards only shrinks the other
  # three, which are already BELOW the floor it sets. Read `gui-smoke/lib/shard.ts`'s "THE COST MODEL"
  # block for the inclusion rule, the rot analysis (there is NO self-correcting static proxy — `it()`
  # count, lines and bytes were all measured and all fail) and the re-measurement recipe.
  # ---------------------------------------------------------------------------------------------------
  gui-smoke-linux-build:
    name: GUI smoke (ubuntu-latest) — build once for every shard (CPE-1753)
    runs-on: ubuntu-latest
    # Constant work: checkout, apt, node, frontend build, release build, driver. Measured ~12 min with a
    # warm Rust cache. 30 leaves room for a cold cache (the build is the only variable part) while still
    # honouring CPE-1266's "a genuinely hung job dies in minutes, not hours". Nothing here scales with the
    # spec count, so this number does not need revisiting as specs are added — that was the whole problem
    # with the old single job's 45.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Deliberately the SAME package list as the shard jobs below, not a trimmed build-only subset. The
      # shards run the binary this job produces, so any divergence between "what it was linked against"
      # and "what is installed where it runs" surfaces as a runtime loader failure inside xvfb — the
      # hardest class of CI failure to read. One list, copied verbatim, is worth the ~45 seconds of apt in
      # each job. See the long CPE-1702 note on the shard job's copy for why the GStreamer codec packages
      # are deliberately NOT here.
      #
      # CPE-1772 — this step's OWN hang, reproduced live and repeatedly on THIS PR's own CI, not
      # merely theorised. `timeout-minutes` below is new. Unambiguous record of what was tried, by run
      # id + run ATTEMPT (a `gh run rerun` reuses the run id and increments the attempt; a fresh push
      # gets a new run id) — kept as the record, not just the current state:
      #   run 32270751601 attempt 1, build job (id 96126309515), 15:35:43-15:44:24 UTC: hung with ZERO
      #      further output for the full 8 minutes, stopping right after apt-get's last InRelease fetch
      #      (archive.ubuntu.com noble-security) and before anything from `apt-get install` printed.
      #   run 32270751601 attempt 2 (rerun of the failed job, same run id), build job (id 96130399692),
      #      15:45:53-15:54:30 UTC: the SAME hang at the SAME point. Both attempts hypothesised as the
      #      documented GitHub-hosted-runner dpkg-lock gotcha (a background `apt-daily`/
      #      `apt-daily-upgrade` service holding `/var/lib/dpkg/lock-frontend` for the first few
      #      minutes after boot) and "fixed" with the lock-wait loop below, added in the next push.
      #   run 32273686091 attempt 1 (new run, new push carrying the lock-wait loop), build job
      #      (id 96135901916), 16:03:16-16:11:58 UTC: the SAME hang, at the SAME exact point, with the
      #      lock-wait loop now in place and printing NOTHING (both `fuser` checks found no lock)
      #      before falling straight through to `apt-get update` — which then hung again regardless.
      #      This DISPROVES the dpkg-lock hypothesis for all three occurrences above; the loop is kept
      #      anyway (harmless, real GH-runner gotcha, just not this one) but is not what protects this
      #      step — see the timeout-sizing note further down for why it is no longer cost-free either.
      #   run 32275319086 attempt 1 (new run, new push adding `Acquire::ForceIPv4` below), build job
      #      (id 96141255204), 16:39:56-16:48:44 UTC: SUCCESS — first clean run of this step. BUT in
      #      the SAME run attempt, all four shard jobs' OWN copy of this step (see below) hit the
      #      identical hang independently: shard 1 (id 96149957353) 16:53:39-17:02:03, shard 2
      #      (id 96149957281) 16:50:49-16:59:09, shard 3 (id 96149957270) 16:52:15-17:00:35, shard 4
      #      (id 96149957321) 16:58:26-17:06:53 — all four timed out at 8 minutes, all in the same
      #      ~15-minute window. Rerunning just the failed jobs (run 32275319086 attempt 2) passed all
      #      four cleanly: shard 1 17:19:20-17:27:59, shard 2 17:19:20-17:33:18, shard 3
      #      17:19:21-17:26:57, shard 4 17:19:21-17:26:24, build job's cached success carried forward,
      #      verdict 17:33:21-17:33:45 success.
      # Current best account, NOT confirmed as fully resolved: the build job succeeding once with
      # `ForceIPv4` while four sibling shard jobs hung in the same narrow window, then all four passing
      # on a bare retry with no code change, is not the shape of a deterministic misconfiguration — it
      # is the shape of a time-windowed external condition (a specific mirror or network path degraded
      # for roughly the 16:50-17:07 UTC stretch, recovered by ~17:19). That is CONSISTENT WITH, but
      # does not conclusively prove, the GitHub-hosted-runner IPv6 connectivity-stall class (a runner
      # advertising non-routing IPv6 hangs on the OS TCP timeout before falling back to IPv4, and apt
      # prints nothing while a single request is stalled, matching the zero-output shape above exactly)
      # — `ForceIPv4` is applied below as the standard mitigation for that class regardless, since it
      # is low-risk and was in place for the one clean run. `timeout-minutes: 8` stands independent of
      # which of these is right: it is what turned five otherwise-silent ~30-minute mystery kills into
      # five fast, named, readable failures — this ticket's actual AC1/AC2 — whether or not the IPv4
      # forcing also reduces how often the underlying stall occurs. This PR's own CI is the honest
      # test of the latter, not a claim made in advance of it.
      - name: Install Linux system dependencies
        timeout-minutes: 8
        run: |
          # CPE-1772: capped at 2 minutes (24 x 5s), not the 5-minute ceiling an earlier commit on
          # this branch shipped (seq 1 60). That earlier loop was sized before the disproof above
          # existed: at 60 x 5s = 300s worst case inside this step's 480s (8-minute) `timeout-minutes`
          # cap, a run that was BOTH lock-contended (a real, separate GH-runner gotcha this loop still
          # guards against) AND hit a slow/degraded mirror would have had only 180s left for the actual
          # apt operations the cap exists to bound, and would fail attributed to apt when dpkg-lock
          # contention was still a real contributor. 2 minutes leaves 6 minutes for apt itself —
          # comfortably above the ~45s this step normally costs, generous even under contention — while
          # still capping the now-disproved-but-harmless-to-keep lock wait at a minority of the budget.
          for i in $(seq 1 24); do
            if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
              echo "waiting for background apt/dpkg lock (attempt $i/24)..."
              sleep 5
            else
              break
            fi
          done
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install gui-smoke dependencies
        working-directory: gui-smoke
        run: npm ci

      # CPE-1694 put these on the leg that gates; CPE-1753 moves them to the FRONT of the build job. They
      # take under a second, they gate (no `continue-on-error`), and running them before the 9.65-minute
      # release build means a broken ratchet unit test fails the whole leg in about a minute instead of
      # after a build — while also running ONCE instead of once per shard.
      - name: Type-check gui-smoke
        working-directory: gui-smoke
        run: npm run typecheck

      - name: Run gui-smoke unit tests
        working-directory: gui-smoke
        run: npm run test:unit

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      # Same rationale as the Windows leg's identically-named step above: `--no-bundle` skips
      # installer packaging + signing, not the CLI `build` subcommand that embeds `frontendDist`
      # (see the CPE-1044 comment on the Windows step and in wdio.conf.ts). No display needed for a
      # build, so this step does not need `xvfb-run`.
      # CPE-1865: `npm run tauri build` drives the Tauri CLI, which has no flag to pass `--locked`
      # through to the `cargo build` it runs internally -- so this is a real, separate
      # `cargo check --locked` against the SAME `src-tauri/Cargo.lock` the step below is about to
      # build the real (not `tauri dev`) binary from, run immediately before it.
      - name: Verify src-tauri/Cargo.lock is current before the real build (CPE-1865)
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: Build release binary (tauri build --no-bundle)
        run: npm run tauri build -- --no-bundle

      # The official WebDriver proxy — version is independent of the Tauri crate version. Locates
      # `WebKitWebDriver` via PATH on Linux automatically (tauri-driver's own per-OS default), so
      # `webkit2gtk-driver`'s `/usr/bin/WebKitWebDriver` is all the shards need alongside it.
      #
      # CPE-1772: `timeout-minutes` here is where PR #933's shared-build cancellation actually landed
      # (mid `Install tauri-driver`, after `tauri-driver v2.0.6` had already installed and the job's
      # own unit tests had passed) — see the apt step's identical comment above for the full
      # reasoning. Compiling `tauri-driver` from source normally takes well under a minute with a warm
      # `cargo install` cache; 8 minutes covers a cold one.
      #
      # CPE-1843: version-pinned for the same load-bearing reason as the Windows leg's identical step
      # above — `gui-smoke/wdio.conf.ts` passes `--port 4444` / `--native-port 4445` explicitly and waits
      # on both ports, so it depends on those two flag NAMES existing (a rename fails loudly; their
      # defaults are irrelevant because the harness overrides them) and on `--native-host` still
      # defaulting to 127.0.0.1, which the harness does NOT pass and therefore can rot SILENTLY. Read
      # that step's comment before bumping this, verify the new version's `src/cli.rs`, and bump BOTH
      # sites together.
      - name: Install tauri-driver
        timeout-minutes: 8
        run: cargo install tauri-driver --version 2.0.6 --locked

      # The two binaries a shard job needs and cannot cheaply reproduce. `ls -l` is not decoration: it is
      # the record of what was actually staged, and the file sizes are the first thing to check if a shard
      # later reports "release binary not found" or a zero-byte driver.
      - name: Stage the app binary + tauri-driver for the shard jobs
        run: |
          mkdir -p gui-smoke/dist-app
          cp src-tauri/target/release/cross-platform-explorer gui-smoke/dist-app/
          cp "$HOME/.cargo/bin/tauri-driver" gui-smoke/dist-app/
          ls -l gui-smoke/dist-app

      # `if-no-files-found: error` — unlike every other upload in this file, which uses `warn`. Those are
      # evidence (a missing gallery must never mask a verdict); THIS one is an input every shard depends
      # on, so a silent empty artifact here would turn into four identical, mystifying "release binary not
      # found" failures ten minutes later. Fail at the source instead.
      # `retention-days: 1` — it is a build intermediate for this run only, not something anyone downloads
      # after the fact; the screenshots and suite logs are the artifacts with a 14-day life.
      - name: Upload the built app for the shard jobs
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-linux-app
          path: gui-smoke/dist-app/*
          retention-days: 1
          if-no-files-found: error

  gui-smoke-linux:
    name: GUI smoke (ubuntu-latest) shard ${{ matrix.shard }} — tauri-driver + WebdriverIO (CPE-1171)
    runs-on: ubuntu-latest
    needs: gui-smoke-linux-build
    strategy:
      # LOAD-BEARING. With the default `fail-fast: true`, one shard going red cancels its siblings — and a
      # cancelled shard never uploads its results, so the verdict job would report MISSING SHARD for
      # jobs that were healthy and killed. The gate must red for the reason that is actually true, so
      # every shard runs to completion and reports.
      fail-fast: false
      matrix:
        # The ONE place the shard count is chosen. `strategy.job-total` below derives each shard's total
        # from the size of this list, so there is no second literal to drift from it here — and the
        # verdict job's `GUI_SMOKE_EXPECT_SHARDS` (the only other place a number appears) is cross-checked
        # against it on every run: add an entry here without bumping it and every manifest reports a
        # `shardTotal` the join does not expect (SHARD PLAN MISMATCH); bump it without adding an entry
        # here and one index never reports (MISSING SHARD). Neither direction can go quietly green.
        # Four was chosen from the measured numbers and CONFIRMED by the first real run (see the job-level
        # AFTER block above): three shards land at 6.40-7.15 min and one — the one holding
        # `samples.smoke.ts` — at 14.27. Raising the count would not move that long pole, because a single
        # 46-case spec file cannot be split across shards; it would only shave the already-cheap three
        # while multiplying runner slots consumed per push. Four it stays until `samples.smoke.ts` itself
        # is split.
        #
        # CPE-1858 re-derived that conclusion from per-spec measurements and it survives, for a slightly
        # different reason. The cost-weighted split now gives `samples.smoke.ts` a shard of its OWN
        # (~8.48 min predicted) and deals the other 40 specs across the remaining three (~7.1-7.7 min
        # each). Those three are already BELOW the floor the isolated heavy spec sets, so adding a fifth
        # shard shortens only jobs that are not the long pole — it cannot move the leg's wall clock at
        # all, and would buy that nothing at the price of another runner slot per push. Still four; still
        # until `samples.smoke.ts` itself is split.
        shard: [1, 2, 3, 4]
    # CPE-1753: was 45 for the whole unsharded suite, which a green run had crept to 41.70 of. Measured
    # across two green sharded runs the shards ran 6.28-16.22 min, so 30 is ~1.85x the WORSE observed LONG
    # POLE (sized against that, not against the ~8-minute average, which would flatter it), leaving 13.78
    # min of headroom worth roughly 30-76 more spec files averaged over the round-robin, or ~7 in the
    # adversarial case. Compare the old 45: it had 3.3 minutes and 2-4 spec files left. CPE-1266's original
    # rationale is unchanged and is why this is not simply left at 45: a genuinely hung
    # WebKitGTK-under-Xvfb session must die in minutes, not hours, and 30 against a 16-minute job still
    # means "died in minutes".
    #
    # History of this number, kept because it is the record of what was tried and why it did not work:
    # CPE-1481 raised it 20 -> 35 -> 45 while the suite ran sequentially (35 still left the media-heavy
    # back half unrun); CPE-1728 measured ~160 runs' step-level timestamps and left it at 45, finding
    # (1) the cap itself had NEVER fired — 0 of 155 completed runs reached 44 min, max observed 42.5 —
    # and (2) that 26 of 85 sampled `pull_request` runs (31%) produced no verdict at all because a newer
    # push had cancelled them mid-suite, which no timeout value can fix. CPE-1728 also tried a
    # STEP-level cap on the suite and removed it on review: the usable window was ~2 min wide against a
    # 0.73-1.80 min/spec growth rate, so any value in it would have reded every PR within a spec file or
    # two. `if: always()` on the verdict steps, not a timing coincidence between two numbers, is what
    # protects the verdict from a cancellation — and that is preserved per shard below.
    timeout-minutes: 30
    # CPE-1594: this leg is now the BLOCKING gate — `continue-on-error` removed. It has run the whole
    # 40-spec suite to completion in CI (33 passed / 7 failed / 100% completed, ~28 min, confirmed on
    # PR #801's own live run — one of those 7, `network.smoke.ts`, had a stale test selector fixed in
    # this same PR, but the corrected selector STILL fails live on this WebKitGTK/Xvfb stack, the same
    # class of `.fav-title` `getText()` issue `saved-search.smoke.ts` is already known-failing for — see
    # `gui-smoke/known-failing.json`'s entry for it — so the baseline stays 7, not 6), so "flaky" was
    # never the right diagnosis; the fix is a ratchet, not more slack. The suite's own exit code below is
    # deliberately swallowed (`|| true`) — the "Ratchet — no new GUI regressions" step owns the verdict:
    # since CPE-1677 it works at TEST-CASE granularity, so it reds the job on any CASE failing that ISN'T
    # in `gui-smoke/known-failing.json` (including a case inside a spec file that already has entries
    # there — the hole CPE-1677 closed), on a known-failing case starting to PASS (the ratchet is one-way
    # — see `gui-smoke/lib/ratchet.ts`), on a listed case title matching no test at all (titles drift), or
    # on the run not completing at all (fewer spec files reporting than `specs/*.smoke.ts` globs to — the
    # exact "timeout kills the job and the whole run reads as cancelled" failure mode this ticket exists
    # to fix). WebKitGTK-under-Xvfb's own class of headless-CI flakiness (GPU-less compositing crashes,
    # cold-start jitter) is still possible — that shows up as an `incomplete` ratchet failure, which is
    # the correct, honest verdict for it, not a swallowed non-blocking log nobody reads.
    env:
      # Analogous to the Windows leg's WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: a defensive,
      # commonly-recommended mitigation for WebKitGTK compositor crashes on GPU-less/restricted CI
      # sessions (the Tauri docs' "Linux Graphics Issues" page lists this as the last-resort fix for
      # silent crashes under Xvfb). Best-effort — not verified live yet (see PR description).
      WEBKIT_DISABLE_COMPOSITING_MODE: "1"
      # CPE-1753: which slice of `specs/*.smoke.ts` this job runs. Read by `wdio.conf.ts` (which files to
      # run), `scripts/write-shard-manifest.ts` (what this shard declares it owes) and
      # `scripts/run-ratchet.ts` (the shard-local verdict's expectation and known-failing scope) — one
      # partition function, `gui-smoke/lib/shard.ts#assignShardSpecs`, behind all three.
      GUI_SMOKE_SHARD_INDEX: ${{ matrix.shard }}
      # `strategy.job-total` is GitHub's own count of the jobs this matrix expands to, so the total is
      # LITERALLY the size of `matrix.shard` above rather than a second number that could drift from it.
      GUI_SMOKE_SHARD_TOTAL: ${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4

      # Same package set the ubuntu-latest leg of the 3-OS `Backend` job (.github/workflows/ci.yml)
      # already builds `cargo tauri build` with, plus the two packages unique to WebDriver-under-CI:
      # `webkit2gtk-driver` (installs `/usr/bin/WebKitWebDriver`, already on PATH — tauri-driver's own
      # `which::which("WebKitWebDriver")` PATH lookup needs no extra step) and `xvfb` (the virtual
      # display GTK needs to initialize at all in a headless session; tauri-driver must be started
      # AFTER a display exists — wrapping the whole `npm test` invocation in `xvfb-run` below, rather
      # than just the app, sets `DISPLAY` before tauri-driver's own child process ever spawns, which
      # sidesteps the known "Failed to initialize gtk backend" ordering trap).
      # CPE-1702: `libwebkit2gtk-4.1-dev` alone pulls in `gstreamer1.0-plugins-base` but not
      # `-good`/`-bad`/`-ugly`/`-libav` — the packages that actually provide MP3, AAC and H.264
      # decoders. Without them, `samples/audio/track.{mp3,flac,ogg}` + `samples/video/clip.mp4` (all
      # real, valid, ffmpeg-encoded media — confirmed in the CPE-1679 UAT, not stubs) can never
      # decode here, so this job only ever exercises MediaPlayer.svelte's graceful-degrade path
      # (`.mp-fallback`) and never real playback (`.mp-media`).
      #
      # CPE-1702 TRIED installing the four plugin packages here, on two separate real CI runs (once
      # alone, once combined with `WEBKIT_DISABLE_SANDBOX=1` after the first attempt suggested
      # WebKitGTK's sandboxed GStreamer plugin-scanner might be failing to launch under GitHub Actions'
      # restricted namespaces). Both runs installed the packages successfully (`Unpacking`/`Setting up`
      # for all four, confirmed in the job logs) and both still showed EVERY media fixture — including
      # the three real, previously-working audio files and the real video — rendering `.mp-fallback`,
      # not `.mp-media` (checked against the actual rendered DOM in each run's raw log, not just the
      # green ratchet: `class="mp...` never matched anything but `mp-fallback`/`mp-fallback-msg`/
      # `mp-open-ext`). Best remaining hypothesis, NOT confirmed: apt's own "Suggested packages" output
      # lists `pipewire`/`pulseaudio`/`gstreamer1.0-alsa` as available but not installed on this
      # runner, so GStreamer's `autoaudiosink` may have nothing to attach to even with every decoder
      # present — video's failure too suggests the same class of sink problem, not a missing-codec one.
      # Confirming that would need GStreamer/WebKitGTK's own diagnostic output piped to CI stdout
      # first (it isn't currently), which is materially more work than this ticket's decision scope.
      # Decision: leave the codec packages OUT — real decode is not achieved here, so paying the apt
      # cost buys nothing. `samples/audio/corrupt.mp3` (see samples/README.md) still ships as a
      # permanent, environment-independent regression pin for the graceful-fallback UI, and
      # `samples.smoke.ts` now asserts ALL FIVE media fixtures land on `.mp-fallback` specifically (not
      # just "settled somehow") — so the day this runner's audio/video pipeline starts working for
      # real, that assertion breaks loudly instead of staying silently green, and this comment is the
      # place to come update it.
      #
      # CPE-1772: `timeout-minutes` + the lock-wait loop + `Acquire::ForceIPv4` here are new — this is
      # the exact step where PR #924's shard 1 was cancelled, before any test ran, and the same class of
      # silent hang reproduced live and repeatedly on the build job's copy of this step AND on all four
      # of THIS job's own shard instances during THIS PR's own CI (run 32275319086 attempt 1: shards
      # 1-4 all hung 8 minutes in the same ~16:50-17:07 UTC window; attempt 2, a bare rerun with no code
      # change, passed all four cleanly). See the build job's copy of this comment for the full
      # run-id/attempt-by-attempt record and why that shape argues for a time-windowed external
      # condition over a deterministic misconfiguration (dpkg-lock hypothesis — disproved live; current
      # best account — an IPv6-connectivity stall — plausible, not conclusively proven). Doesn't scale
      # with spec count (unlike the suite step below, which deliberately has no step cap — see its own
      # CPE-1728/1753 note), so a tight cap here has no growth-curve fuse. Lock-wait loop capped at 2
      # minutes (not 5), same reasoning as the build job's copy: leaves 6 of the 8-minute cap for apt
      # itself instead of letting the now-disproved-but-harmless lock wait eat more than half the budget.
      - name: Install Linux system dependencies
        timeout-minutes: 8
        run: |
          for i in $(seq 1 24); do
            if sudo fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 || sudo fuser /var/lib/apt/lists/lock >/dev/null 2>&1; then
              echo "waiting for background apt/dpkg lock (attempt $i/24)..."
              sleep 5
            else
              break
            fi
          done
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # CPE-1753: the app binary and `tauri-driver` come from `gui-smoke-linux-build`, which compiled
      # them ONCE for the whole matrix — that 9.65-minute release build was 81% of this job's old
      # pre-suite setup, and four shards each repeating it would have wasted ~39 min of runner time per
      # run for an identical result. There is no Rust toolchain, Rust cache, root `npm ci` or frontend
      # build in this job at all any more; nothing here compiles.
      - name: Download the app built by gui-smoke-linux-build
        uses: actions/download-artifact@v4
        with:
          name: gui-smoke-linux-app
          path: gui-smoke/dist-app

      # `install -m 0755`, not `cp`: artifact upload/download does NOT preserve the executable bit, and a
      # non-executable app binary fails as a bare EACCES from deep inside tauri-driver rather than as
      # anything that names the cause. The destinations are exactly the two paths `wdio.conf.ts` resolves
      # (`src-tauri/target/release/<name>` and `~/.cargo/bin/tauri-driver`) — see its APP_BINARY /
      # TAURI_DRIVER_BIN constants; this job deliberately does not change those, so a local run and a CI
      # shard resolve the same paths.
      - name: Restore the app binary + tauri-driver to the paths wdio.conf.ts expects
        run: |
          mkdir -p src-tauri/target/release "$HOME/.cargo/bin"
          install -m 0755 gui-smoke/dist-app/cross-platform-explorer src-tauri/target/release/cross-platform-explorer
          install -m 0755 gui-smoke/dist-app/tauri-driver "$HOME/.cargo/bin/tauri-driver"
          ls -l src-tauri/target/release/cross-platform-explorer "$HOME/.cargo/bin/tauri-driver"

      - name: Install gui-smoke dependencies
        working-directory: gui-smoke
        run: npm ci

      # CPE-1753: declares which spec files this shard owes, BEFORE the suite runs. The verdict job
      # counts these manifests and reds on any missing index — see `gui-smoke/lib/shard.ts` and
      # `lib/ratchet.ts` clause 9. Written early on purpose: a shard killed mid-suite has still told the
      # join what it owed (so its missing results read as an incomplete run naming real spec files), and
      # a mis-set matrix fails here in seconds instead of after the suite. It also prints this shard's
      # assignment, which is the only place a reader can see which shard runs a given spec.
      - name: Declare this shard's spec assignment
        working-directory: gui-smoke
        run: npm run shard-manifest

      # CPE-1753: the type-check and the ratchet's own unit tests moved to `gui-smoke-linux-build`, at the
      # front of that job — they gate exactly as CPE-1694 established, but now run once for the matrix
      # and fail the whole leg in about a minute rather than once per shard after a build.
      # CPE-1694 (retained for the history): `test:unit`'s glob is `lib/*.test.ts`, NOT `lib/**/*.test.ts`
      # — the double-star relies on bash's `globstar`, which is off by default on a `bash -e {0}` step
      # shell and unsupported by npm's own `sh -c` script wrapper, so the starred form failed with "Could
      # not find '.../lib/**/*.test.ts'" on every real run before reaching a single test.
      #
      # `xvfb-run` wraps the whole test command in a fake X display so tauri-driver -> WebKitWebDriver
      # -> the app's GTK/WebKitGTK webview can all initialize headlessly (see the system-deps comment
      # above for why the WHOLE command, not just the app, needs to run under it).
      # CPE-1594: `|| true` deliberately swallows wdio's own exit code — a run with known-failing specs
      # is EXPECTED to exit non-zero here, and the "Ratchet" step below is what actually decides pass/
      # fail (see its comment and `gui-smoke/lib/ratchet.ts`). This also lets the suite step finish
      # normally (rather than the job aborting) so the JSON reporter output + screenshots below always
      # exist to upload/ratchet, even on a run with failures.
      # CPE-1728: this step deliberately has NO step-level `timeout-minutes`. A 32-minute cap was tried
      # and removed after review measured that it had a one-to-two-spec-file fuse against the unsharded
      # suite. CPE-1753 does not reintroduce one: the reason it was unsafe is unchanged in kind (suite
      # duration scales with spec count, so any step cap has a fuse measured in spec files), it is only
      # longer now that each shard carries a quarter of the growth. `if: always()` on the Ratchet step
      # below remains the load-bearing mechanism, and the job-level cap remains the backstop — a
      # job-level timeout concludes `cancelled`, never `success`, and the verdict job turns a
      # cancelled shard into an explicit MISSING SHARD red rather than a quietly smaller expectation.
      # This step still `tee`s the full output to `.results/suite-output.log` (on top of the existing
      # `.results/*.json` per-spec reports) so the classify-log step below has real evidence to classify,
      # and so it can be uploaded as an artifact (see the screenshot-upload step's CPE-1728 comment) —
      # `gh run view --log` truncates a long job's log around ~4 MB, which has already hidden the tail of
      # at least one real incomplete run investigated for this ticket. `|| true` at the end of the whole
      # pipeline (not just after `npm test`) is defensive rather than strictly load-bearing under this
      # workflow's ACTUAL default step shell (`bash -e {0}` — no `pipefail`, since no `defaults.run.shell`
      # is set anywhere in this file or job, so the pipeline's exit status is `tee`'s, which already
      # succeeds); kept anyway as cheap insurance against a future `defaults.run.shell` change
      # reintroducing `pipefail` and silently reviving the "known-failing-only run fails this step" bug
      # this line originally guarded against.
      - name: Run GUI smoke suite (xvfb-run)
        working-directory: gui-smoke
        run: |
          mkdir -p .results
          (xvfb-run --auto-servernum npm test 2>&1 | tee .results/suite-output.log) || true

      # CPE-1728: advisory-only, deliberately BETWEEN the suite and the Ratchet gate — reads the log the
      # suite step above just captured and prints whether this run's failures (if any) carry a real
      # `AssertionError` or only the WebDriver/DRI3-class noise that PR #900 (CPE-1723) showed is not
      # evidence about the app (see `gui-smoke/lib/logSignature.ts` for the full rationale and the exact
      # markers). `if: always()` so it still runs — and still has a log to read — even when the suite step
      # above hit ITS OWN timeout rather than finishing cleanly. Never changes the job's exit code: the
      # Ratchet step immediately below remains the only thing that gates this job, unchanged by this
      # step's classification. This is the answer to "distinguish the app being broken from the runner
      # failing to paint" — printed automatically, not left for a reader to re-derive by counting
      # PASSED/FAILED lines and grepping the raw log by hand. NOTE this classification is only as good as
      # the log it was given: `gh run view --log` truncates a long job well before it reaches this step's
      # own output on a run whose suite step ran a long time, so treat a clean classification on such a
      # run as "nothing suspicious in what was retrievable," not "confirmed clean" — see the
      # screenshot-upload step below, which now uploads the untruncated log as an artifact for exactly
      # this reason.
      - name: Classify suite log — app defect vs runner-could-not-paint (CPE-1728)
        if: always()
        working-directory: gui-smoke
        run: npm run classify-log

      # CPE-1594: the actual gate, and DELIBERATELY the very next step after the suite — nothing that
      # can fail (like the screenshot upload below) is allowed to sit between the suite finishing and
      # this step running, because that would let an unrelated step's failure silently skip the verdict
      # (default step conditions require the previous step to have succeeded — see PR #801's first live
      # run, where `if-no-files-found: error` on the OLD upload-before-ratchet ordering aborted the job
      # before the ratchet ever executed: no ratchet output anywhere in that log). Reads the JSON results
      # `wdio.conf.ts`'s `json` reporter just wrote to `gui-smoke/.results/` and compares against
      # `gui-smoke/known-failing.json`. Exits non-zero (redding this job, and — unlike every other step
      # here — WITHOUT `continue-on-error` — this is a hard gate) on a new failing CASE, a listed case
      # that now passes, a listed case title that matches no test, or an incomplete run (CPE-1677). Its
      # log also prints every failing case by name, so a verdict can never again be byte-identical across
      # a clean run and a run with a broken case inside an already-listed spec file. See
      # `gui-smoke/lib/ratchet.ts` for the exact rules and `gui-smoke/README.md` for how to retire an
      # entry once its case is fixed.
      # CPE-1728: `if: always()` is the fix this ticket is actually about. Before this, ANY cancellation
      # of a prior step — in practice almost always an ordinary CPE-1266 concurrency-supersession (a newer
      # push landing on the same PR) killing an in-flight run, since this job's own 45-minute cap has never
      # been observed to fire (see the job-level CPE-1728 comment above) — skipped this step entirely
      # under its default `if: success()` condition, leaving the log ending in a bare
      # `##[error]The operation was canceled.` that reads as pure infrastructure noise regardless of how
      # far the suite had gotten. PR #900's run (31787491058) was cancelled with its suite step ~3/4
      # through a normal ~30-minute run — genuinely incomplete, not a finished run whose tally got thrown
      # away. `loadCaseResults` (`scripts/run-ratchet.ts`) now also tolerates a completely missing
      # `.results/` dir (0 cases reported) instead of throwing, so even a cancellation BEFORE the suite
      # step started still lands on `evaluate()`'s existing, honest "SUITE DID NOT COMPLETE: expected N
      # spec file(s) ... but only M reported" message (clause 4) — one uniform, readable verdict for every
      # cancellation stage, never a raw stack trace and never silence. NOTE this does not stop a
      # superseded run from concluding `cancelled` at the GitHub UI level — a genuinely obsolete run's
      # verdict SHOULD read that way — it only makes the underlying log honest instead of misleading once
      # someone opens it, which is what PR #900 actually needed.
      # CPE-1753: this is now the SHARD-LOCAL verdict — `GUI_SMOKE_SHARD_INDEX`/`_TOTAL` (set at job level
      # above) put `run-ratchet.ts` in shard mode, where the expectation is THIS shard's assigned spec
      # files and `known-failing.json` is narrowed to entries naming them. It gates exactly as before, and
      # it is fast, local feedback: a new failing case in this shard reds this job by name.
      # What it deliberately CANNOT see, and says so in its own log rather than implying otherwise: the
      # exemption entries belonging to other shards, and entries naming a spec file that no longer exists
      # (which belong to no shard at all). Those, plus "did every shard report?", are the
      # `gui-smoke-linux-verdict` job's business — a global exemption list cannot honestly be judged from
      # one quarter of the suite.
      - name: Ratchet — no new GUI regressions in this shard
        if: always()
        working-directory: gui-smoke
        run: npm run ratchet

      # CPE-1753: the machine-readable half of this shard's output, and the input the verdict job joins on
      # — the `@wdio/json-reporter` chunks plus the `shard-manifest-*.json` this shard wrote before the
      # suite. `if: always()` is LOAD-BEARING here in a way it is not for the evidence artifacts below: a
      # shard whose own ratchet step just reded must STILL hand its results to the join, or the join sees
      # a missing shard and reports an infrastructure failure instead of the real per-case regression.
      # Only `*.json` (not the whole dir) so the artifact's root stays flat and the suite log keeps its own
      # artifact, per the CPE-1728 note below. `include-hidden-files: true` because `.results/` is
      # dot-prefixed — without it this artifact is silently empty and every run reports MISSING SHARD.
      - name: Upload gui-smoke shard results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-results-ubuntu-shard-${{ matrix.shard }}
          path: gui-smoke/.results/*.json
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

      # CPE-1594: unlocks the CPE-1148 Visual Critic in CI — before this, the ~75 `snap()` calls per run
      # wrote to a gitignored dir on an ephemeral runner and were simply discarded, so nothing (human or
      # agent) could ever review a PR's rendered UI without a Foreman rebuilding locally. `if: always()`
      # matters both for running after a RATCHET failure (screenshots are still useful evidence when the
      # gate reds) and for running after a suite crash. `include-hidden-files: true` — REQUIRED.
      # `gui-smoke/.screenshots/` starts with a dot, and `actions/upload-artifact@v4` treats any path
      # under a dot-prefixed folder as "hidden" and silently excludes it from the glob by default
      # (confirmed via the action's own docs: "any file beginning with `.` or files within folders
      # beginning with `.`"). This bit PR #801's first live run: "No files were found ...
      # gui-smoke/.screenshots/**" even though the suite ran to completion and genuinely wrote PNGs —
      # without this flag the artifact step is a silent no-op on every run, defeating the ticket's core
      # promise. `if-no-files-found: warn` (not `error`, unlike the PR #801 original) — a missing gallery
      # is now a loud step warning, not something that can ever again abort the job and mask the ratchet
      # verdict above; the ratchet, not the screenshot upload, owns whether this leg is red or green.
      # Retrieve with `gh run download <run-id> -n gui-smoke-screenshots-ubuntu -D <dir>` (see
      # gui-smoke/README.md "Reading a CI run").
      #
      # CPE-1728: also uploads `.results/suite-output.log` (the `tee`'d full suite output, see the "Run
      # GUI smoke suite" step above) — not just the screenshots. `gh run view --log`/the Actions web UI
      # truncate a job's log around ~4 MB, which for a long-running suite step can cut off well before the
      # end: investigating PR #900's run (31787491058) hit exactly this, losing the last third of that
      # run's own suite output and leaving the "no evidence of an app race" conclusion for that specific
      # incident only partially confirmable, not fully. Uploading the untruncated log is this ticket's
      # AC2 ("a reader should not have to grep the raw log by hand") actually delivered — without it,
      # nobody (human or the classify-log step's own reviewer) can audit a classification after the fact
      # on a run long enough to get truncated.
      #
      # The log goes in its OWN artifact, deliberately. `upload-artifact@v4` roots an artifact at the
      # least common ancestor of everything it matches, so listing both paths here rerooted the artifact
      # at `gui-smoke/` and moved all 82 PNGs from the artifact root into `.screenshots/` — measured by
      # downloading both artifacts and comparing (round 1: 82 PNGs at root, 0 nested; round 2: 0 at root,
      # 82 nested). That directory is DOT-PREFIXED, so a Visual Critic told to download to `<dir>` and
      # read the screenshots globs `<dir>/*.png`, matches nothing (default globbing skips dotfiles) and
      # reports "no screenshots produced" — a silent failure of the visual leg, which is the exact shape
      # of defect this ticket exists to eliminate. Two artifacts keep the gallery flat at its root and
      # need no README or Visual-Critic-instruction edit to stay true.
      #
      # CPE-1753: per-shard names, because artifact names must be unique within a run. These are a
      # QUARTER of the gallery each — the whole, flat gallery is re-published under the unchanged name
      # `gui-smoke-screenshots-ubuntu` by the verdict job below, precisely so the Visual Critic's
      # "download to <dir>, read <dir>/*.png" instruction keeps working without an edit. These per-shard
      # copies are kept anyway: if the verdict job is itself cancelled, they are the only surviving
      # evidence, and that is exactly the case where someone needs it.
      - name: Upload gui-smoke screenshots (this shard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-screenshots-ubuntu-shard-${{ matrix.shard }}
          path: gui-smoke/.screenshots/**
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

      - name: Upload gui-smoke suite log (this shard)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-suite-log-ubuntu-shard-${{ matrix.shard }}
          path: gui-smoke/.results/suite-output.log
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  # CPE-1753 — THE GATE. Everything above is a shard's opinion about its own quarter; this job is the only
  # place the whole suite is judged, and the only place that can tell "every shard reported" from "the
  # shards that reported were happy".
  #
  # `if: always()` + `needs:` every shard is what makes a missing shard visible at all: without it, a
  # cancelled or failed shard would SKIP this job, and a skipped gate is a green PR. With it, this job
  # runs after any outcome and `run-ratchet.ts` in JOIN mode reds on:
  #   - MISSING SHARD — any index in 1..GUI_SMOKE_EXPECT_SHARDS that uploaded no manifest. The
  #     expectation comes from the literal below (the workflow file), NEVER from the artifacts that
  #     downloaded, because an expectation inferred from what arrived can never notice what didn't. This
  #     is the single highest-risk part of sharding and the reason this job exists.
  #   - SUITE DID NOT COMPLETE — fewer spec files reported than `specs/*.smoke.ts` globs to in THIS job's
  #     own checkout. A second, independent net under the first: even if the manifest bookkeeping were
  #     wrong, a missing shard's ten spec files still fail to report against a git-derived expectation.
  #   - STALE EXEMPTION / RATCHET / every other clause, now over the FULL `known-failing.json` against the
  #     FULL merged results. `known-failing.json` is global, so "listed but no longer failing anywhere"
  #     and "listed but matching no test in any shard" are questions only this job can answer.
  gui-smoke-linux-verdict:
    name: GUI smoke (ubuntu-latest) — verdict across all shards (CPE-1753)
    runs-on: ubuntu-latest
    needs: [gui-smoke-linux-build, gui-smoke-linux]
    if: always()
    # Downloads a few MB and runs a pure-TS reduction. Two minutes is a generous real-world estimate; 15
    # is the "something is genuinely wedged" backstop.
    timeout-minutes: 15
    env:
      # The ONE literal that has to match `gui-smoke-linux`'s `matrix.shard` list, and it cannot drift
      # silently in either direction: the shards report their own total from `strategy.job-total` (the
      # matrix size itself), so a mismatch either way reds with SHARD PLAN MISMATCH or MISSING SHARD. When
      # changing the shard count, change both — the failure if you forget is loud, immediate and named.
      GUI_SMOKE_EXPECT_SHARDS: "4"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install gui-smoke dependencies
        working-directory: gui-smoke
        run: npm ci

      # `merge-multiple: true` flattens every shard's results into one directory, which is safe only
      # because each shard's reporter output is name-prefixed with its shard number
      # (`lib/shard.ts#shardResultFilePrefix` — wdio's worker cids restart at `0-0` in every shard, so
      # without that prefix this merge would silently keep one shard's `wdio-0-0.json` and drop the rest).
      #
      # `continue-on-error: true` — deliberately, and it is not laziness. If NO shard uploaded anything
      # (every shard cancelled, or the build job failed so none ever ran), this step errors; letting that
      # abort the job would skip the verdict step below and leave the run with no explanation at all,
      # which is precisely the CPE-1728 failure this whole design is built to avoid. The verdict step is
      # `if: always()` and treats an empty download as "no shard reported" — four MISSING SHARD reds and
      # a SUITE DID NOT COMPLETE. Loud, red, and correct.
      - name: Download every shard's results
        id: download-results
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: gui-smoke-results-ubuntu-shard-*
          merge-multiple: true
          path: gui-smoke/.results

      - name: Ratchet — the gate, across every shard
        if: always()
        working-directory: gui-smoke
        run: npm run ratchet

      # Re-publishes the four per-shard galleries as ONE flat artifact under the name the Visual Critic
      # and gui-smoke/README.md already use. `merge-multiple: true` is what keeps the PNGs at the artifact
      # ROOT: without it each shard's files land under a `gui-smoke-screenshots-ubuntu-shard-N/`
      # subdirectory, and a critic told to glob `<dir>/*.png` finds nothing and reports "no screenshots
      # produced" — the exact silent failure of the visual leg that CPE-1728's two-artifact split was
      # written to prevent. Screenshot names are per-surface and each spec runs in exactly one shard, so
      # the merge has no collisions to resolve.
      # After the verdict step on purpose (CPE-1594's ordering rule: nothing that can fail may sit between
      # the results and the verdict), and `if: always()` so a red gate still publishes its evidence.
      - name: Download every shard's screenshots
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: gui-smoke-screenshots-ubuntu-shard-*
          merge-multiple: true
          path: gui-smoke/.screenshots

      - name: Upload gui-smoke screenshots (whole run, flat)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-smoke-screenshots-ubuntu
          path: gui-smoke/.screenshots/**
          retention-days: 14
          if-no-files-found: warn
          include-hidden-files: true

  # CPE-1882: the generalised real-browser layout guard — scripts/dev-harness/layout-guard/. Reuses
  # this workflow's own shape (real Chrome on a hosted runner, workflow-level `concurrency:` above) but
  # NOT its heavy machinery: no `tauri build`, no msedgedriver/tauri-driver/WebdriverIO, no sharding.
  # It drives plain installed Chrome (`chrome.exe`/`google-chrome --headless=new`) over raw CDP against
  # the project's OWN `vite` dev server — the exact approach
  # scripts/dev-harness/sidebar-drop-stack-overlap/check.mjs already proved out for CPE-1884, now
  # generalised (engine.mjs) into reusable `siblingOverlap`/`clipProbe`/`textOverflow`/`selfPaint`
  # checks any case in cases.mjs can point at a component + a width list, with no WebDriver in the
  # loop. That is most of the point: this job should be far more reliable than gui-smoke's WebDriver
  # legs (see this file's own header — the Windows leg above has NEVER produced a passing run in CI),
  # which is why it is unconditional and BLOCKING on every push/PR rather than schedule/dispatch-only.
  #
  # Cost, measured locally (2 cases / 12 width combinations — StatusBar.svelte red-proofing CPE-1836,
  # TrashView.svelte red-proofing CPE-1827): ~35s dev-server cold start (first module-graph compile) +
  # ~1-2s per width thereafter, under a minute end to end. No build step, no driver install — this is
  # the cheapest real-browser job in this workflow by a wide margin, which is why it runs on EVERY
  # push/PR rather than being path-filtered to layout-relevant paths: at well under a minute, a
  # silently-skipped run (the CPE-1893 shape — a job that produced nothing reading identically, in the
  # checks list, to one that had nothing to do that run) is a worse trade than just always paying it.
  layout-guard:
    name: Layout guard (real-browser rects, no WebDriver) — CPE-1882
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # CPE-1882 UAT finding: pinned to 22, NOT this workflow's usual 20 (every other job here
      # stays on 20 -- do not "fix" this to match them). scripts/dev-harness/layout-guard/engine.mjs
      # calls the global `WebSocket` constructor directly (its own CDP client, no `ws` dependency --
      # see that file's header) and global `WebSocket` is only stable in Node from v22; on v20 it is
      # `ReferenceError: WebSocket is not defined`, unconditionally, on every run -- confirmed on a
      # real CI run (job 98371907013) before this fix. The alternative (drop the global-WebSocket
      # dependency, e.g. the `ws` package) was rejected: it's a new npm dependency, which the ticket's
      # own bar was to avoid, and this job's Chrome-CDP approach otherwise has zero dependencies.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      # google-chrome-stable ships preinstalled on GitHub-hosted ubuntu-latest runner images, but its
      # exact path is an image detail, not a documented contract — resolved here rather than hard-coded
      # in engine.mjs's own `defaultChromePath()`, and exported to CHROME_PATH so that function's
      # `process.env.CHROME_PATH` override picks it up. Fails loud (empty `$CHROME_BIN` -> the
      # `--version` call errors) rather than silently falling through to a guessed path that might not
      # exist on a future runner image.
      - name: Resolve + confirm Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium-browser)"
          echo "Using Chrome at: $CHROME_BIN"
          "$CHROME_BIN" --version
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Run the layout guard (npm run harness:layout-guard)
        run: npm run harness:layout-guard
