name: CI

# Fast checks on every push and PR to main: type-check + test the frontend, and
# compile + lint + test the Rust backend. The full cross-platform bundle runs
# separately in release.yml on version tags.
on:
  push:
    branches: [main]
    # CPE-1781: a commit touching ONLY ticket/agent bookkeeping cannot affect a build, yet without
    # this every ticket-filed/status-moved/Work-Log-appended commit fired the full frontend +
    # 3-OS backend matrix on `main`. Measured during the 2026-08-17/18 batched sprint: ~15
    # ticket-only commits to `main` in one night, each starting the whole matrix AND (because of
    # `cancel-in-progress` below) cancelling the previous bookkeeping commit's still-running matrix
    # mid-flight — burning the same account concurrency the PR queue needed (see CPE-1772, filed
    # from noticing GUI-smoke cancellations the same night) for zero possible signal.
    #
    # NOT `Ticketing/**` — `Ticketing/Epics/**` is a LIVE test input, not inert bookkeeping.
    # `src/lib/epicsQueueLayout.test.ts` (which runs in the `frontend` job below) `readdirSync`s and
    # `readFileSync`s the real `Ticketing/Epics/` tree on disk and asserts no epic sits loose at the
    # old flat location and every epic's frontmatter `status:` agrees with its folder — the guard
    # CLAUDE.md names as what stops the two board implementations plus the ticket MCP from silently
    # lying instead of erroring. `/ticketing-epic activate` and routine sprint bookkeeping already
    # `git mv` files under `Ticketing/Epics/**` straight onto `main`; an ignore list that swallowed
    # that path would have made that exact guard unreachable — a real code-adjacent regression class
    # hidden as a side effect of a CI-cost ticket, surfacing later on a totally unrelated PR. `.md`
    # files elsewhere in `Ticketing/` also is not uniformly inert for the same reason worth stating
    # plainly: `Ticketing/wiki.md` and `Ticketing/_template.md` are prose, not test input, but they
    # are NOT excluded either — narrowing to the two folders below costs nothing (no bookkeeping
    # commit touches either) and avoids re-litigating that distinction file-by-file. Named narrowly
    # instead: `Ticketing/Tickets/**` (ticket status moves + Work Log edits) and `Ticketing/Sprints/**`
    # (sprint bookkeeping) are the two trees a routine ticketing-workflow commit actually touches, and
    # neither is read by any test or build step. Measured against the last 400 commits to `main`: 1
    # touched `Ticketing/Epics/` and it was a code commit that would have run anyway; the ~37
    # bookkeeping-only pushes in the same window are all `Tickets/`-shaped and are still fully
    # skipped — essentially the whole win, none of the risk.
    #
    # Also NOT a blanket `**/*.md` — this repo has Markdown that IS a build input a real code change
    # can break: `src/docs/*.md` is shipped and guarded by `src/lib/sectionDocs.test.ts` (part of the
    # `frontend` job below). `docs/design/*.md` is kept out of the ignore list too, but conservatively,
    # not because of a specific guard: a repo-wide search (ts/rs test files) found nothing that reads
    # its content today — CPE-1761 is scoped to `src/lib` + `src/docs/03-explorer.md` wording, not
    # `docs/design/`. An earlier version of this comment cited CPE-1761 for `docs/design/*.md`
    # specifically; that was wrong and is corrected here rather than repeated. Named anyway because it
    # is exactly the kind of doc a future guard could plausibly read, and — same logic as `Ticketing/
    # Epics/**` in the blocker above — the cost of leaving it un-ignored is zero (no bookkeeping commit
    # ever touches it) against a real, if currently theoretical, risk of silencing a guard added later
    # without this comment being updated to match.
    #
    # `.claude/**` stays in the ignore list — verified safe: every reference to it across the repo
    # (ts/rs/js/svelte/json/yml) is a prose comment, no workflow `run:` step reads a file under it,
    # and `vite.config.ts` already excludes `**/.claude/**` from vitest, so nothing here can be a
    # test or build input the way `Ticketing/Epics/**` is.
    #
    # PUSH ONLY — deliberately NOT applied to the `pull_request` trigger below. Stated accurately,
    # not aspirationally: this repo has **no branch protection and no required status checks**
    # (`gh api repos/:owner/:repo/branches/main/protection` -> 404 "Branch not protected"; `gh api
    # repos/:owner/:repo/rulesets` -> `[]`) — so "required check" is not a mechanism that exists here
    # to protect, and `main` does NOT only move via PR either: history is linear squash-merges with
    # 37 of the last 60 commits being direct pushes carrying no PR number, some of them code (e.g.
    # `86888aed fix: strip the BOM I added to the manifests, and unrot the ffmpeg pin`). What IS true,
    # and is the actual safety argument for narrowing rather than removing this filter: the
    # `pull_request` trigger below carries NO path filter of its own, so any change that goes through
    # a PR — reviewed or not — still gets the full, unfiltered run regardless of diff; and this
    # workflow relies on that `pull_request` run plus direct-push discipline as its only automated
    # signal, there being no required-check mechanism to fall back on. For a commit that goes straight
    # to `main` outside a PR, the filtered `push` run was the ONLY automated signal that would have
    # fired — skipping it for `Ticketing/Tickets/**`/`Ticketing/Sprints/**`/`.claude/**`-only content
    # is a deliberate trade being made with that understood, not a gap being papered over as already
    # covered elsewhere.
    paths-ignore:
      - "Ticketing/Tickets/**"
      - "Ticketing/Sprints/**"
      - ".claude/**"
  pull_request:
    branches: [main]

# CPE-1266: a newer push/PR to a ref cancels that ref's superseded in-flight CI run, so rapid
# back-to-back pushes don't pile up dozens of full matrix runs and clog the account's concurrency.
# CPE-1781 revisited this while adding the paths-ignore above and is keeping it as-is: it is still
# correct for a burst of rapid CODE pushes to `main` (only the last commit's result needs to
# survive), and now that bookkeeping-only pushes no longer start a run at all, they can no longer be
# the thing a real code push's run gets cancelled by, or vice versa.
#
# CPE-1799 carves `main` — and ONLY `main` — out of that cancellation. Everything CPE-1266 and
# CPE-1781 say above about PR branches is unchanged and deliberate: on a PR only the newest push's
# verdict is ever read, and `github.ref` there is `refs/pull/<n>/merge`, so the expression below is
# `true` and those runs still supersede each other exactly as before. What CPE-1781 called "an
# accepted, chosen trade-off" — the last commit of a fast batch being the only one whose result
# survives — is the part being revisited, because on `main` specifically it is not a redundancy
# trade, it is the whole signal.
#
# WHY `main` IS DIFFERENT IN KIND, NOT DEGREE. The post-merge run on `main` is the only thing that
# can catch an INTERACTION between two PRs that were each green in isolation — the parallel-import
# duplicate-symbol class this repo has actually hit, where both branches are individually MERGEABLE,
# individually green, and broken only once combined. No PR's own CI can catch that by construction:
# when each ran, the other change did not exist in its tree. So cancelling `main`'s run does not
# discard a second copy of a signal already in hand; it discards the only copy of a signal nothing
# else in this repo produces. Measured on the 20 CI runs on `main` immediately before this change:
# 12 of the 19 that had completed ended `cancelled` — the escaped-defect net was simply absent for
# about two thirds of merged commits, and absent *more* the faster the crew merged, which is exactly
# backwards. It is also the input the sprint ledger's `post_merge_defect` field depends on (the
# Foreman back-annotates a merged row to `ci-red` when `main` goes red on that commit); a cancelled
# run can never produce that annotation, so the metric reads clean precisely when no verification
# happened.
#
# COST — cheaper than "serialise every merge" sounds, because of a specific GitHub mechanic rather
# than an optimistic reading. `cancel-in-progress: false` does NOT mean every push executes. Within
# one concurrency group GitHub keeps at most ONE pending run: when a run is queued behind an
# in-progress one, any previously pending run in the group is cancelled *while still pending*, having
# burned no runner minutes. Everything merged while a run is in flight therefore COALESCES into one
# follow-up run. The cost of a burst is `1 + ceil(burst_span / run_duration)` executed runs, not one
# per merge — written as the formula rather than a round number because the round number is only
# right for the common case. A burst that fits inside a single run duration costs 2 (the in-flight
# run, which now survives — the entire point of this ticket — plus one coalesced run for whatever
# the tip turned out to be), and with the `Server crates (windows-latest)` leg alone at ~55 minutes
# that does cover most realistic bursts; a burst spanning two run durations costs 3, and so on.
# CPE-1799's own four-commit proof burst is the honest illustration of the difference: it spanned
# roughly two job durations and cost THREE executed runs, not two. Verified empirically on a
# throwaway branch configured exactly like `main`, not taken from the docs — CPE-1799's Work Log
# carries the run IDs, including the pending run that was cancelled without ever starting a job.
#
# LATENCY — the other half of the cost, and it roughly DOUBLES. A merge landing mid-run no longer
# starts immediately: it waits `pending` for the in-flight run to finish and only then runs itself.
# With the ~55-minute Windows leg that is up to ~110 minutes from merge to verdict on this workflow,
# against ~55 before. Called out explicitly rather than left to be discovered, because the sprint
# ledger's `post_merge_defect` back-annotation named above is one of the motivations for this change
# and now has to tolerate a ~2-hour lag. Concretely: a Foreman that checks `main`'s health a few
# minutes after merging and reads a still-`pending` run as clean would reintroduce the exact false
# negative this ticket is about, wearing a different hat — so wait for a *conclusion*, never infer
# one from a status. Still the right trade, since a late verdict is worth incomparably more than a
# cancelled one, but it is a real change in timing rather than a free win.
#
# The trade now being accepted knowingly, in place of the old one: intermediate commits of a burst
# get no run of their own, so a red on the coalesced run does not by itself identify WHICH merge
# caused it. That is strictly better than the status quo, under which those commits get no completed
# run either AND neither does the tip.
#
# WHY AN EXPRESSION RATHER THAN A SEPARATE NEVER-CANCELLING GROUP FOR `main`: convenience, not
# capability. Stating that plainly, because the alternative is easy to rediscover and a reader who
# does should not conclude this block is hiding a reason. A static `group: ci-main` with
# `cancel-in-progress: false` would coalesce IDENTICALLY, and would NOT have reintroduced CPE-1266's
# pile-up — that pile-up came from having no `concurrency` block AT ALL, so each of ~15 rapid pushes
# spawned a full parallel run; ANY group, expression or literal, fixes it. (An earlier draft of this
# comment asserted that a separate group would have "surrendered" CPE-1266's property. That was
# false. It is corrected here rather than quietly dropped, because a wrong premise inside a block
# whose whole purpose is to be trusted and not relitigated does not stay contained — it gets
# believed and reasoned from.) The expression wins only on keeping ONE rule in ONE place: no second
# concurrency block whose group name and settings must be kept in sync with this one, and the
# `main`/not-`main` distinction written once, at the point where it is read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # False on `main` (never cancel the post-merge net), true everywhere else (CPE-1266, unchanged).
  # `concurrency:` is evaluated very early, before much of the run context exists, so "an expression
  # is allowed here" was checked empirically rather than assumed: CPE-1799 ran this arm alongside a
  # control arm carrying the INVERTED comparison on the same branch, and the inverted arm DID cancel
  # while this shape survived. Only a genuinely evaluated value explains that split — had the
  # expression been ignored, or the raw string coerced to truthy, both arms would have behaved alike.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  frontend:
    name: Frontend — type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Unit tests
        run: npm test

  lockfile-preflight:
    # CPE-1932: this repo has 17 independent Cargo.lock files (9 of them pinning cpe-server), and
    # every Rust job below runs `cargo ... --locked`, so a single stale lockfile is a hard failure.
    # Discovering that serially — one stale lockfile per hour-long matrix run — is what this job
    # exists to stop: `cargo metadata --locked` is RESOLVE-ONLY (no compilation), so checking every
    # lockfile in the tree costs seconds, not an hour, and can report every stale file in one pass.
    # `needs:` on the matrix jobs below makes that saving real — a repo-wide stale-lockfile problem
    # is caught here before the expensive 3-OS builds even start, instead of alongside or after them.
    #
    # Lockfiles are enumerated with `git ls-files '*Cargo.lock'` — NEVER a hardcoded list. CPE-1932's
    # own root cause was an enumeration failure, not a forgotten rule: a dependency bump regenerated
    # the two lockfiles everyone remembered (`crates/server`, `src-tauri`) and both reviewers verified
    # those two were fine — they were. Nothing asked "how many lockfiles are there", so the other
    # seven (crates/ftp, crates/mdns, crates/net, crates/s3, crates/sftp, crates/vfs, crates/webdav)
    # went unregenerated and unnoticed until CI hit them one at a time. Reading the list from
    # `git ls-files` instead of memory means a new crate's lockfile is covered the day it lands,
    # with no step here to update.
    #
    # Two more guards, both added after UAT/review found the job could lie about its own coverage:
    #  - A near-zero `${#locks[@]}` (git missing, wrong cwd, a future refactor of this step) must
    #    fail loudly, not silently pass as "0 stale of 0 checked" — that is a zero-enumeration false
    #    green, the exact anti-pattern this ticket exists to stop. Floor of 10 chosen deliberately
    #    below today's real count (17) so removing several crates over time doesn't need this bumped,
    #    while still catching a near-total enumeration loss (0/1/2 files found).
    #  - `cargo metadata --locked` failing does not always mean "stale": an invalid Cargo.toml (typo,
    #    bad merge) fails the same command for an unrelated reason, and the two are trivially
    #    distinguishable by cargo's own stderr — a genuine staleness failure names `--locked`
    #    explicitly ("... because --locked was passed to prevent this"); a manifest parse error does
    #    not. Classify on that text instead of assuming every failure is staleness, and keep the real
    #    cargo error inside the `::group::` log instead of discarding it to /dev/null, so a broken
    #    manifest gets a message that actually helps (fix the syntax) instead of bad advice
    #    (regenerate a lockfile that was never the problem).
    name: Lockfile pre-flight — cargo metadata --locked (no compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo metadata --locked over every Cargo.lock in the tree
        shell: bash
        run: |
          set -uo pipefail  # deliberately no -e: one stale/broken lockfile must not stop the sweep of the rest

          mapfile -t locks < <(git ls-files '*Cargo.lock')
          echo "Found ${#locks[@]} Cargo.lock file(s) via 'git ls-files *Cargo.lock':"
          printf '  %s\n' "${locks[@]}"
          echo

          # Enumeration sanity floor: if this finds (near-)nothing, the job would otherwise report a
          # vacuous "0 stale of 0 checked" success while having verified nothing at all.
          if [ "${#locks[@]}" -lt 10 ]; then
            echo "::error::only ${#locks[@]} Cargo.lock file(s) found via 'git ls-files *Cargo.lock' -- expected at least 10 in this tree. This almost always means enumeration itself is broken (git missing or misconfigured, wrong working directory) rather than lockfiles actually having been removed. A guard that finds nothing and reports success is exactly the failure CPE-1932 exists to prevent -- fix the enumeration, don't relax this floor to make it pass."
            exit 1
          fi

          stale=()
          broken=()
          for lock in "${locks[@]}"; do
            dir="$(dirname "$lock")"
            echo "::group::cargo metadata --locked -- ${dir}"
            err="$(cargo metadata --locked --format-version 1 --manifest-path "${dir}/Cargo.toml" 2>&1 1>/dev/null)"
            status=$?
            if [ "$status" -eq 0 ]; then
              echo "ok: ${lock} matches ${dir}/Cargo.toml"
            else
              echo "$err"
              if printf '%s' "$err" | grep -q -- "--locked was passed to prevent this"; then
                echo "STALE: ${lock} does not match ${dir}/Cargo.toml"
                stale+=("$lock")
              else
                echo "BROKEN: ${dir}/Cargo.toml does not parse -- not a staleness problem, see the cargo error above"
                broken+=("$lock")
              fi
            fi
            echo "::endgroup::"
          done

          if [ "${#stale[@]}" -gt 0 ] || [ "${#broken[@]}" -gt 0 ]; then
            echo
            if [ "${#stale[@]}" -gt 0 ]; then
              echo "::error::${#stale[@]} of ${#locks[@]} Cargo.lock file(s) are stale (Cargo.toml changed but the lockfile wasn't regenerated to match):"
              for lock in "${stale[@]}"; do
                echo "::error file=${lock}::${lock} is stale — its Cargo.toml no longer matches this lockfile"
              done
            fi
            if [ "${#broken[@]}" -gt 0 ]; then
              echo "::error::${#broken[@]} Cargo.toml manifest(s) do not parse (see each one's cargo error in the matching '::group::' above -- this is NOT a lockfile-staleness problem):"
              for lock in "${broken[@]}"; do
                dir="$(dirname "$lock")"
                echo "::error file=${dir}/Cargo.toml::${dir}/Cargo.toml does not parse — fix the syntax error shown in the '${dir}' log group above, then re-run"
              done
            fi

            if [ "${#stale[@]}" -gt 0 ]; then
              cat <<'EOF'

          STALE lockfile(s) listed above -- to fix each one: run `cargo metadata` (no arguments
          beyond that) in its directory to regenerate the lockfile. That is resolve-only and picks
          the same dependency versions your Cargo.toml change already implies.

          Do NOT run `cargo update` to fix this — it re-resolves to the newest allowed versions of
          EVERYTHING, turning a build fix into an unreviewed, unrelated dependency bump.

          Format-version trap: regenerating can silently rewrite the lockfile's leading
          `version = 3` to `version = 4` as a side effect, even though nothing about your change
          asked for that. Diff the regenerated file — if only the version line moved and nothing
          else you intended changed, that's suspicious; if the header bumped alongside real
          dependency changes, revert the version line back to `3` by hand before committing
          (CPE-1896 hit this twice).
          EOF
            fi

            if [ "${#broken[@]}" -gt 0 ]; then
              cat <<'EOF'

          BROKEN manifest(s) listed above -- these are NOT stale lockfiles. `cargo metadata` failed
          because the Cargo.toml itself doesn't parse (a typo, a bad merge). Regenerating a lockfile
          will not fix this: fix the Cargo.toml syntax error shown in that directory's log group
          above, then re-run.
          EOF
            fi

            exit 1
          fi

          echo
          echo "All ${#locks[@]} Cargo.lock files are up to date with their Cargo.toml."

  backend:
    needs: lockfile-preflight
    # Compile on every OS we actually SHIP. Linux alone never compiles
    # `#[cfg(windows)]` code or Windows-only deps (the registry crate), and
    # neither Linux nor Windows catches macOS-only breakage — yet release.yml
    # builds a macOS bundle. Anything not compiled here only fails after a tag
    # is pushed. See CPE-028 (Windows) and CPE-042 (macOS).
    name: Backend (${{ matrix.os }}) — cargo check, clippy, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # CPE-1787: same ForceIPv4/retry/timeout hardening gui-smoke.yml carries for this exact apt-get
      # site (CPE-1772) — a GitHub-hosted-runner IPv6-connectivity stall can hang `apt-get update` with
      # zero output before it ever falls back to IPv4. `timeout-minutes` turns that into a fast, named
      # failure instead of riding to the job's (unset, so 360-minute default) cap.
      # CPE-1916: `ubuntu-latest` preinstalls the `azure-cli` and Microsoft-prod (`packages.microsoft.com`)
      # apt sources — see the `msrv` job's copy of this comment for the real failure this guards against
      # and why removing the lists (not tolerating the error) is the fix. This project installs nothing
      # from either, on any job, so `rm -f` them before `update` — `-f` makes it a no-op if a future
      # runner image ever drops one or both. `install` below is untouched: a genuinely missing package
      # from a source we DO use still fails the step exactly as before.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 8
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri_build needs the frontend dist/ to exist at compile time.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Build frontend (needed by tauri build script)
        run: |
          npm ci
          npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # CPE-1717 — the same neutralisation guard the `crates` job runs, for the app adapter's own
      # staged legs (`cpe_1710_*`, `cpe_1705_*`, `cpe_1696_*` in `src-tauri/src/lib.rs`). Sabotage the
      # staging and the leg must go RED; if it still passes, a runner that quietly lost symlink
      # privilege or ACL denies would report green over zero coverage, which is the whole bug.
      # Nothing recompiles — same profile, same features, one filtered re-run.
      #
      # `CPE_STAGING_STRICT` is deliberately unset — see the `crates` job's copy of this step for the
      # measurement that says why pinning it blinds the guard to the arm it needs to cover.
      #
      # CPE-1806 added the trash-roundtrip sub-blocks below, after PR #961's review found the routing
      # this ticket added (10 `trash_roundtrip_available()` call sites in `lib.rs` — CPE-1770 added an
      # 8th and 9th after this comment first said 7 (PR #986 review), CPE-1891 added a 10th (PR #1044,
      # the confirm-and-retry escape hatch's own end-to-end trash-undo test) — all through
      # `cpe_server::fsutil::require_staged_reason` since CPE-1815) could be deleted from ANY of the 10
      # sites with this step never noticing — the exact silent-vacuity shape CPE-1806 itself exists to
      # close, one level up.
      #
      # CPE-1817: this step originally only ever sabotage-tested 2 of those 9 sites (one of each shape)
      # while this comment read as if the whole mechanism was covered — the same silent-vacuity shape one
      # level up again. It now sabotage-tests all 10 individually (below; CPE-1891's 10th call site is a
      # shared-shape canary, added to the `shared_sites` list), and cross-checks that count against a live
      # grep of `lib.rs` so an 11th site added later either gets a canary or fails this step for drifting,
      # on purpose rather than by omission.
      - name: skip-visibility guard (CPE-1717 / CPE-1806)
        working-directory: src-tauri
        shell: bash
        env:
          CPE_STAGING_SABOTAGE: "1"
        run: |
          set -u
          log="${RUNNER_TEMP:-/tmp}/cpe1717-sabotage.log"   # outside the checkout: no stray file can dirty a later git-diff guard
          fail=0

          filter=cpe_1710_rename_entry_never_renames_over_a_dangling_link_at_the_new_name
          if cargo test --locked "$filter" > "$log" 2>&1; then
            echo "::error::CPE-1717 regression: '$filter' PASSED with staging sabotaged — a leg that staged nothing is reporting green. Check that cpe_server::fsutil::require_staged is still on this path."
            fail=1
          elif ! grep -q 'CPE-1717' "$log"; then
            echo "::error::CPE-1717: '$filter' failed, but not with the require_staged panic, so this step no longer proves anything about skip visibility. Full log:"
            cat "$log"
            fail=1
          else
            echo "OK: '$filter' went red, and for the right reason:"
            grep -m1 -A6 'CPE-1717' "$log"
          fi

          # ── CPE-1806 / CPE-1817: the trash-roundtrip mechanism (`trash_roundtrip_available()` /
          # `cpe_server::fsutil::require_staged_reason("trash_roundtrip", ..)` since CPE-1815, 10 call
          # sites in `lib.rs` — CPE-1891 (PR #1044) added the 10th), asymmetric across all THREE legs of
          # this same job's matrix rather than just two.
          # `supported_here = true` for the two Linux-only malformed-`.trashinfo` panic-boundary tests
          # (CPE-1791/CPE-1803); `supported_here = cfg!(target_os = "linux")` for the eight
          # `cfg(any(target_os = "windows", target_os = "linux"))` round-trip tests — matching the
          # measured verdict now recorded on `trash_roundtrip_available`'s own doc comment (grepped whole
          # raw job logs of two real runs: zero `CPE-1268` notices on Linux, five on Windows, same runs).
          # macOS has no `trash::os_limited` API at all, so none of the ten tests even compile there —
          # a filter for any of their names would match ZERO tests on macOS, and `cargo test <filter>`
          # with zero matches exits 0, which would silently read as evidence of nothing rather than "not
          # applicable" (the same zero-match trap the fourth `link_status` block below guards against).
          # So: Linux must go RED under sabotage, Windows must stay a quiet passing skip, and macOS is
          # explicitly skipped rather than trusted to a false green.
          #
          # CPE-1817: previously only one test of each shape was sabotage-tested here (2 of 9), so the
          # other 7 sites (including the second Linux-only panic-boundary test,
          # `restore_and_empty_trash_fail_loudly_instead_of_reporting_false_success_when_the_dependency_panics`)
          # were deletable with this step never noticing, while the comment above read as if the whole
          # mechanism was covered. Every one of the 10 sites now gets its own `cargo test <name>` below
          # (CPE-1891 round 4 added the shared-shape canary for its own new site, keeping this count
          # exact rather than drifting the way it did before CPE-1817), via two small functions instead
          # of ten copy-pasted blocks, and the Windows arm asserts the `CPE-1268` notice is actually
          # present (previously `grep ... || true`, which could match nothing and still report OK —
          # asserting nothing about whether the skip took the documented path).

          assert_linux_only_trash_canary() {
            local name="$1"
            echo "--- sabotaged run of the Linux-only panic-boundary test: $name"
            if [ "$RUNNER_OS" != "Linux" ]; then
              echo "OK: skipped on $RUNNER_OS — this test is #[cfg(target_os = \"linux\")], so it doesn't compile here at all; a filtered run would prove nothing."
              return 0
            fi
            if cargo test --locked "$name" > "$log" 2>&1; then
              echo "::error::CPE-1806 regression: '$name' PASSED with staging sabotaged, on Linux — the ONLY platform this panic-boundary test ever runs on. A leg that staged nothing reported green; check require_staged_reason is still on this path."
              return 1
            elif grep -qF 'CPE-1717] `trash_roundtrip`' "$log"; then
              # CPE-1817 round 2: matched on the MECHANISM NAME in the panic, not a bare 'CPE-1717'
              # substring — every require_staged/require_staged_reason panic in the binary starts with
              # that prefix, so a bare match would also accept an unrelated gate (e.g. make_dangling_link,
              # which several of these tests also call) firing first and masking a genuinely deleted
              # trash_roundtrip routing behind an unrelated, coincidental red.
              echo "OK: went red, and for the right reason (trash_roundtrip's own gate, not an unrelated one):"
              grep -m1 -A6 -F 'CPE-1717] `trash_roundtrip`' "$log"
              return 0
            else
              echo "::error::CPE-1806: '$name' red, but not with trash_roundtrip's own require_staged_reason panic — a DIFFERENT staging gate firing first would land here too, which is no longer evidence this mechanism's routing is intact. Full log:"
              cat "$log"
              return 1
            fi
          }

          assert_shared_trash_canary() {
            local name="$1"
            echo "--- sabotaged run of the shared trash-roundtrip site: $name"
            if [ "$RUNNER_OS" = "macOS" ]; then
              echo "OK: skipped on macOS — none of the trash-roundtrip tests compile there (no cfg match), so a filtered run would prove nothing but a zero-match exit 0."
              return 0
            fi
            if cargo test --locked "$name" > "$log" 2>&1; then
              if [ "$RUNNER_OS" = "Windows" ]; then
                if grep -q 'CPE-1268' "$log"; then
                  echo "OK: on Windows this mechanism may legitimately not stage (a headless CI session can lack a working Recycle Bin), so it stayed a passing skip, and the log proves it took the documented notice path rather than matching nothing:"
                  grep -m1 'CPE-1268' "$log"
                  return 0
                else
                  echo "::error::CPE-1806: '$name' passed under sabotage on Windows, but the log has no CPE-1268 notice — a bare pass can't be told apart from one that never touched require_staged_reason at all. Full log:"
                  cat "$log"
                  return 1
                fi
              else
                echo "::error::CPE-1806: on $RUNNER_OS the trash round-trip IS supposed to work, so a sabotaged run of '$name' must be red. It passed, which means supported_here is wrong for this site or require_staged_reason is no longer on the path."
                return 1
              fi
            else
              if [ "$RUNNER_OS" = "Windows" ]; then
                echo "::error::CPE-1806: a FALSE RED on Windows for '$name' — the round-trip may legitimately fail to stage there, so this leg must skip quietly, not fail. Check its supported_here is cfg!(target_os = \"linux\"). Full log:"
                cat "$log"
                return 1
              elif grep -qF 'CPE-1717] `trash_roundtrip`' "$log"; then
                # CPE-1817 round 2: mechanism-specific match — see the sibling comment in
                # assert_linux_only_trash_canary. Several of these sites also call make_dangling_link,
                # which stages independently and, under global CPE_STAGING_SABOTAGE, panics on its own —
                # a bare 'CPE-1717' match would accept that unrelated panic as proof of THIS routing.
                echo "OK: on $RUNNER_OS it went red, and for the right reason (trash_roundtrip's own gate):"
                grep -m1 -A6 -F 'CPE-1717] `trash_roundtrip`' "$log"
                return 0
              else
                echo "::error::CPE-1806: '$name' red, but not with trash_roundtrip's own require_staged_reason panic — a DIFFERENT staging gate (e.g. make_dangling_link's) firing first would land here too, which is no longer evidence THIS mechanism's routing is intact. Full log:"
                cat "$log"
                return 1
              fi
            fi
          }

          linux_only_sites=0
          for name in \
            trash_listing_degrades_to_empty_instead_of_crashing_on_a_malformed_trashinfo_file \
            restore_and_empty_trash_fail_loudly_instead_of_reporting_false_success_when_the_dependency_panics \
          ; do
            linux_only_sites=$((linux_only_sites + 1))
            assert_linux_only_trash_canary "$name" || fail=1
          done

          shared_sites=0
          for name in \
            macro_run_convert_step_then_undo_restores_the_original_bytes_via_trash \
            list_trash_then_restore_trash_items_round_trips_a_probe_file \
            restore_trash_items_reports_a_collision_as_a_distinguishable_per_item_error_without_aborting_the_batch \
            cpe_1770_restore_trash_items_refuses_when_a_dangling_link_occupies_the_original_path \
            cpe_1770_restore_from_trash_refuses_when_a_dangling_link_occupies_the_original_path \
            empty_trash_purges_only_the_selected_probe_item \
            list_trash_stream_flushes_batches_over_the_channel_and_matches_the_collect_variant \
            cpe_1891_macro_convert_confirmed_overwrite_replaces_the_plain_target_and_still_trashes_the_original \
          ; do
            shared_sites=$((shared_sites + 1))
            assert_shared_trash_canary "$name" || fail=1
          done

          # CPE-1817: don't just trust the two lists above to stay in sync with lib.rs — count the real
          # call sites and fail loudly on drift, so an 8th, 9th, 10th... site (CPE-1770 already added two
          # after this step was first written) either gets a canary here or fails this step on purpose.
          total_sites=$((linux_only_sites + shared_sites))
          # CPE-1817 round 2: a plain `grep -c` over raw lines false-fails on a cosmetic reflow — wrapping
          # one call's args across several lines is a pure whitespace change, but it moves the function
          # name and the string literal onto different physical lines, so a same-line grep stops matching
          # and the count drops even though nothing was added or removed. Collapse all whitespace
          # (newlines included) to single spaces first, so the count only changes when a call site
          # genuinely appears or disappears, never when one is merely re-wrapped.
          actual_sites=$(tr -s '[:space:]' ' ' < src/lib.rs | grep -o 'require_staged_reason([[:space:]]*"trash_roundtrip"' | wc -l)
          if [ "$actual_sites" -ne "$total_sites" ]; then
            echo "::error::CPE-1817: lib.rs has $actual_sites require_staged_reason(\"trash_roundtrip\", ..) call site(s) (counted with whitespace/newlines between the call's tokens collapsed first, so line-wrapping a call alone cannot move this number) but this step only sabotage-tests $total_sites ($linux_only_sites linux-only + $shared_sites shared) — these two counts have drifted. Most likely a call site was added or removed in lib.rs without updating the two name lists above (and the doc comment counts); if that is not it, the counting pattern above may itself need to change for a new call shape. Either way, update deliberately rather than silencing this."
            fail=1
          fi

          exit $fail

      # The default build above is the delete-test: the explorer compiles with ZERO
      # sidecar code. This proves the opt-in integration also compiles (CPE-272).
      - name: cargo check (sidecar-platform feature)
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets --features sidecar-platform -- -D warnings

      # Typed-bindings drift guard (CPE-813, epic CPE-810): regenerate the superset typed client and fail
      # if the committed `src/lib/bindings.gen.ts` differs — so the Rust contract and the TS bindings can
      # never silently drift. Linux only (one OS is enough; webkit deps are installed above so the plain
      # export bin links + runs). Regenerate locally with the same command if this fails.
      - name: Typed-bindings drift guard
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: |
          cargo run --locked --bin export_bindings --features "specta-bindings sidecar-platform"
          git diff --exit-code ../src/lib/bindings.gen.ts \
            || (echo "::error::bindings.gen.ts is stale — run: cargo run --locked --bin export_bindings --features \"specta-bindings sidecar-platform\"" && exit 1)

  crates:
    # The GUI↔Server "server-side" crates under crates/ (the Decoupled Server epic CPE-810):
    # cpe-contract (the wire contract, CPE-811), cpe-security (the pluggable security core,
    # CPE-816), cpe-server (the Tauri-free domain logic + dispatcher, CPE-815/824), and cpe-net
    # (the headless network transport loop — Client(Rust) proxy + reference Server, CPE-825).
    # Standalone and Tauri-free — deliberately NOT in the app's cargo workspace, so the
    # `backend` job above doesn't cover them (`src-tauri` path-depends on cpe-server, mirroring
    # `sidecar/contract`). Pure Rust, but we lint+test on every shipped OS to match the rest of
    # the Rust matrix.
    name: Server crates (${{ matrix.os }}) — clippy + test
    needs: lockfile-preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # CPE-1690 guard: crates/mdns was the only directory under crates/ this job didn't name, so its
      # 17 tests silently never ran and its test code was silently never linted — a hole invisible from
      # a green CI badge. Read THIS file back and fail if any `crates/*` directory has no matching
      # `working-directory: crates/<name>` step below, so a future new crate (or a deleted step) can't
      # recreate that hole silently. ubuntu-latest only (like the Typed-bindings drift guard in the
      # `backend` job) — a text check against the workflow file, not an OS-dependent build.
      #
      # CPE-1699 extends the same check to sidecar/* (5 crates as of 2026-08-12: agent-board,
      # ai-console, contract, host, repos — enumerated by `ls sidecar/` excluding sidecar/README.md,
      # which the trailing-slash glob below already excludes since it isn't a directory). Unlike
      # crates/*, the sidecar crates are NOT verified by a different mechanism that would make naming
      # them here redundant: the `sidecar` job (below, same file) checks them out on the same 3-OS
      # matrix and clippy+tests each one via its own `working-directory: sidecar/<name>` step, exactly
      # mirroring the crates/ pattern this guard already polices — so the guard is extended, not
      # skipped. (The `sidecar-platform` feature flag gates the *app's* opt-in build of sidecar-platform
      # code in the `backend` job — a separate, unrelated axis from whether a sidecar/* crate's own
      # clippy+test step is named here.)
      #
      # Glob-matches-nothing, made intentional (CPE-1699): the original CPE-1690 script did not set
      # `nullglob`, so if `crates/*/` expanded to nothing (crates/ deleted, renamed, or moved), bash
      # would leave the glob un-expanded as the literal string `crates/*/` and the `for` loop would
      # still run ONCE with that literal — stripping the `crates/` prefix and trailing `/` turns it
      # into the one-character name `*`, and the grep for `working-directory: crates/*$` happens to
      # almost never match (`*` there is a regex quantifier, not a literal), so the loop fell into the
      # same "missing" path as a real uncovered directory and reds anyway. Right outcome, wrong reason —
      # and a naive "count the loop iterations, red if zero" fix does NOT actually detect this case,
      # because the un-expanded literal still counts as one iteration, not zero (verified locally: see
      # the CPE-1699 PR body). The correct fix is `shopt -s nullglob`, set explicitly below: with it, an
      # unmatched glob truly expands to zero words, so the loop genuinely does not run, `*_count` stays
      # 0, and the dedicated "matched no directories" message below fires deliberately instead of by
      # regex accident.
      - name: Guard — every directory under crates/ and sidecar/ is named in this workflow (CPE-1690, CPE-1699)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          missing=0

          check_named() {
            base="$1"
            dir="$2"
            name="${dir#"${base}"/}"
            name="${name%/}"
            if ! grep -q "working-directory: ${base}/${name}\$" .github/workflows/ci.yml; then
              echo "::error::${base}/${name} has no 'working-directory: ${base}/${name}' step in .github/workflows/ci.yml — every directory under ${base}/ must be clippy'd + tested here (CPE-1690, CPE-1699)"
              missing=1
            fi
          }

          crates_count=0
          for dir in crates/*/; do
            crates_count=$((crates_count + 1))
            check_named crates "$dir"
          done
          if [ "$crates_count" -eq 0 ]; then
            echo "::error::crates/*/ matched no directories — crates/ is missing, empty, or renamed, so this guard cannot verify anything under it"
            missing=1
          fi

          sidecar_count=0
          for dir in sidecar/*/; do
            sidecar_count=$((sidecar_count + 1))
            check_named sidecar "$dir"
          done
          if [ "$sidecar_count" -eq 0 ]; then
            echo "::error::sidecar/*/ matched no directories — sidecar/ is missing, empty, or renamed, so this guard cannot verify anything under it"
            missing=1
          fi

          if [ "$missing" != "0" ]; then
            exit 1
          fi
          echo "every crates/* (${crates_count}) and sidecar/* (${sidecar_count}) directory is named in this workflow"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `getfattr` (package `attr`) is required by the server crate's native-metadata OS-interop test
      # (CPE-1049, tests/native_meta_os_interop.rs) to read an xattr back through the OS's own tool,
      # independent of native_meta::read. Without it the Linux leg would silently skip (ErrorKind::NotFound)
      # instead of genuinely asserting OS interop — install it so the assertion always runs on Linux.
      # CPE-1787: ForceIPv4/retry/timeout hardening — see the `backend` job's copy of this comment
      # (CPE-1772) for the IPv6-stall diagnosis this guards against.
      # CPE-1916: remove the preinstalled azure-cli/Microsoft-prod apt sources before updating — see the
      # `msrv` job's copy of this comment for why. This step has no `continue-on-error`, so a real
      # `attr` install failure still fails the job exactly as before.
      - name: Install attr (getfattr) for xattr interop test
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 5
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y attr

      # Native deps for the PDF (`pdf-thumb`, CPE-1256) + video (`video-thumb`, CPE-1257) thumbnail
      # extractors' real-render tests (ship-enablement CPE-1258, epic CPE-718). Both extractors already
      # SKIP (not fail) their real-render test when the native dep isn't resolvable
      # (crates/server/src/thumb_pdf.rs / thumb_video.rs), so a hiccup in either install degrades to a
      # skipped assertion rather than a red CI run — but installing them here on all three OSes means the
      # real assertions actually run instead of skipping. CI-only installs: ffmpeg's package-manager
      # build's exact license/feature-set doesn't matter here (never distributed) — the shipped binary is
      # a separately pinned LGPL build provisioned in release-sidecar.yml.
      # All native-dep installs below are BEST-EFFORT (continue-on-error) on purpose: the PDF/video
      # real-render tests SKIP (not fail) when their dep is unresolvable (crates/server/src/thumb_pdf.rs
      # / thumb_video.rs), so a flaky third-party download must never red the pipeline (CPE-1268). When
      # the install succeeds the real assertions run; when it hiccups they degrade to a skip.
      # CPE-1787: ForceIPv4/retry/timeout hardening, PLUS a `timeout-minutes` this step previously
      # lacked entirely — `continue-on-error: true` only helps once the step reaches a terminal state,
      # and with no timeout a genuine hang here never reached one: this exact step hung with zero
      # output for 1.5+ hours on PR #935's own `Server crates (ubuntu-latest)` job (see CPE-1772) and
      # had to be cancelled and rerun manually. The cap below lets `continue-on-error` do its job.
      # CPE-1916: remove the preinstalled azure-cli/Microsoft-prod apt sources before updating — see the
      # `msrv` job's copy of this comment for why. This step already tolerates a real ffmpeg-install
      # failure via `continue-on-error` (degrading to a skipped real-render assertion, CPE-1268); this
      # fix just stops an UNRELATED third-party repo's outage from being the thing that trips that
      # degradation instead of a genuine ffmpeg problem.
      - name: Install ffmpeg (video-thumb real-render test, Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        timeout-minutes: 8
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y ffmpeg

      # CPE-1824: `brew install` has no documented per-invocation retry/timeout flag of its own
      # (checked, not assumed -- unlike apt's `-o Acquire::*` options, there is nothing to pass
      # here), so the only bound available is GitHub Actions' own step-level `timeout-minutes`.
      # `continue-on-error: true` already means a hang here was ALWAYS going to be swallowed once
      # it reached a terminal state -- this cap is what lets it reach one instead of riding to the
      # job's 360-minute default.
      - name: Install ffmpeg (video-thumb real-render test, macOS)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        timeout-minutes: 10
        run: command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      # CPE-1824: Chocolatey DOES have a genuine timeout option -- `--execution-timeout` (alias
      # `--timeout`), documented as CommandExecutionTimeout in SECONDS, bounding the whole command
      # (download + install), not just a connect phase; it defaults to 2700s (45min) and choco's
      # own enforcement has had bugs around disabling it (GH chocolatey/choco#1224/#1747), so the
      # step-level `timeout-minutes` below stays as an independent backstop rather than relying on
      # choco's internal timer alone.
      - name: Install ffmpeg (video-thumb real-render test, Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        timeout-minutes: 10
        run: choco install ffmpeg -y --no-progress --execution-timeout=480

      # pdfium prebuilt (BSD-3-Clause, bblanchon/pdfium-binaries) staged where
      # `Pdfium::bind_to_system_library()` resolves it via the OS's normal dynamic-library search path
      # (LD_LIBRARY_PATH / DYLD_LIBRARY_PATH / PATH) — CI-only use, same pinned release the shipped
      # binary's pdfium is provisioned from in release-sidecar.yml.
      # curl uses --fail (a bad HTTP status is an error, not a silently-saved error page) + --retry so a
      # transient network blip retries instead of leaving a truncated/empty archive for tar to choke on.
      # CPE-1824: --retry alone doesn't bound a STALLED transfer (a connection that hangs open with
      # zero bytes moving never hits a retryable terminal state). Four different mechanisms are in
      # play below, and each bounds ONLY its own scope -- they are not interchangeable:
      #   --connect-timeout 15  the TCP/TLS handshake phase of ONE attempt, nothing after it.
      #   --max-time 180        ONE attempt end-to-end (connect + transfer). With --retry present
      #                         this is NOT a bound on the whole command: PLAIN --retry already
      #                         retries a timeout -- curl's retry.md lists "a timeout" FIRST among
      #                         the transient errors it covers -- and each retry then gets a FRESH
      #                         max-time clock. Measured against a server that accepts the
      #                         connection and then sends nothing: this exact flag set without
      #                         --retry-max-time ran 1101s (18.35 min) and printed SIX separate
      #                         "Operation timed out after 1800xx ms" -- one full 180s cycle for
      #                         the initial attempt plus each of the 5 retries. With
      #                         --retry-max-time 150 added, the same test ends at 182s, exit 28,
      #                         one timeout message.
      #                         NB: --retry-all-errors is NOT the cause and dropping it would fix
      #                         nothing -- measured, `--retry 2 --retry-delay 1 --max-time 8` with
      #                         NO --retry-all-errors still burned 3 full attempts / ~29s. The
      #                         hazard is --retry + --max-time, full stop; that is what the guard
      #                         keys on. (Absent --retry, --max-time DOES bound the whole
      #                         invocation -- see release-sidecar.yml.)
      #   --retry-max-time 150  the retry SERIES: before starting each new retry curl checks
      #                         elapsed time against this and stops retrying once it is reached.
      #                         An attempt already in flight is allowed to finish, and the check
      #                         happens BEFORE the --retry-delay sleep, so curl's real worst case
      #                         is 150 + 3 + 180 = 333s. (CPE-1849 corrected this: it read
      #                         "150 + 180 = 330s" here, omitting the --retry-delay term. Measured
      #                         -- with --max-time 2 --retry-max-time 4, a --retry-delay of 3 gave
      #                         7.9s against the 6s that "retry-max-time + max-time" predicts. The
      #                         omission survived because both earlier scaled experiments happened
      #                         to use --retry-delay 1, too small a term to expose it.)
      #   timeout-minutes: 6    the outer GitHub Actions backstop (360s wall-clock), which kills
      #                         the step regardless of what is stuck inside it.
      # 150 is chosen so that the 333s worst case lands strictly inside the 360s backstop: curl loses
      # on its own terms (real exit code + --fail diagnostics in the log) rather than being killed
      # opaquely by the runner, leaving 27s for the step's mkdir/tar/echo. It does not weaken what
      # the retries are actually for -- 5 retryable terminal errors fail in seconds each plus 3s
      # delays, ~20s in total, far inside 150.
      # NB (round 2 of CPE-1824): this comment previously claimed --max-time bounded the entire
      # invocation "including all --retry attempts". That was backwards; see the ticket's Work Log.
      # src/lib/releaseHangHardening.test.ts now fails if any curl here pairs --retry with
      # --max-time but no --retry-max-time, so the claim cannot silently rot back into being false.
      - name: Install pdfium prebuilt (pdf-thumb real-render test, Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        env:
          PDFIUM_TAG: "chromium/7961"
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --retry-max-time 150 --connect-timeout 15 --max-time 180 -sS -o "$RUNNER_TEMP/pdfium.tgz" "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz"
          tar xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium" lib/libpdfium.so
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/pdfium/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install pdfium prebuilt (pdf-thumb real-render test, macOS)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        env:
          PDFIUM_TAG: "chromium/7961"
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --retry-max-time 150 --connect-timeout 15 --max-time 180 -sS -o "$RUNNER_TEMP/pdfium.tgz" "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-mac-arm64.tgz"
          tar xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium" lib/libpdfium.dylib
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/pdfium/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # Windows: $RUNNER_TEMP is a drive-letter path (D:\a\_temp\…). GNU tar reads a path whose second
      # char is a colon as a `host:path` REMOTE archive and tries to "connect to D:" (the observed
      # `tar (child): Cannot connect to D: resolve failed` — CPE-1268). --force-local makes tar treat
      # the `-f` archive path as a plain local file. The extract dir is passed to `cd` first (POSIX
      # form) so its drive letter never reaches tar's remote-detection at all.
      - name: Install pdfium prebuilt (pdf-thumb real-render test, Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        timeout-minutes: 6
        shell: bash
        env:
          PDFIUM_TAG: "chromium/7961"
        run: |
          dest="$(cygpath -u "$RUNNER_TEMP")/pdfium"
          mkdir -p "$dest"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 --retry-max-time 150 --connect-timeout 15 --max-time 180 -sS -o "$dest/pdfium.tgz" "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-win-x64.tgz"
          tar --force-local -xzf "$dest/pdfium.tgz" -C "$dest" bin/pdfium.dll
          echo "$(cygpath -w "$dest/bin")" >> "$GITHUB_PATH"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./crates/contract -> target
            ./crates/security -> target
            ./crates/server -> target
            ./crates/net -> target
            ./crates/mdns -> target
            ./crates/sftp -> target
            ./crates/webdav -> target
            ./crates/ftp -> target
            ./crates/s3 -> target
            ./crates/vfs -> target
            ./crates/updater-verify -> target

      - name: contract — clippy + test
        working-directory: crates/contract
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: security — clippy + test
        working-directory: crates/security
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          # The opt-in JWT verifier (CPE-965) — lint + test it too; default build above stays crypto-free.
          cargo clippy --locked --all-targets --features jwt -- -D warnings
          cargo test --locked --features jwt

      - name: server — clippy + test
        working-directory: crates/server
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          # The opt-in instant-search index engine (CPE-832) — lint + test it too; the default build
          # above stays indexer-free (the "small when off" delete-test).
          cargo clippy --locked --all-targets --features index -- -D warnings
          cargo test --locked --features index
          # The opt-in PDF (pdfium-render, CPE-1256) + video (bundled-ffmpeg shell-out, CPE-1257)
          # thumbnail extractors, shipped for real by CPE-1258, the opt-in DICOM medical-image reader
          # (dicom-object/dicom-pixeldata, CPE-1345), and the opt-in audio-waveform peak extractor
          # (same bundled-ffmpeg shell-out, CPE-1478) — lint + test all four together; the default
          # build above stays extractor-free (the "small when off" delete-test). The native deps
          # installed above let the real-render tests actually assert instead of skipping.
          cargo clippy --locked --all-targets --features pdf-thumb,video-thumb,waveform,dicom-thumb -- -D warnings
          cargo test --locked --features pdf-thumb,video-thumb,waveform,dicom-thumb

      # ─── CPE-1717 ────────────────────────────────────────────────────────────────────────────────
      # The skip-visibility guard, and it is a *neutralisation* step, not another test run.
      #
      # A dozen legs across this repo stage a condition that cannot always be created — a denied stat,
      # a dangling link on an unprivileged Windows runner — and, when staging fails, they announce it
      # rather than passing silently (CPE-1678 → 1692 → 1696 → 1705 → 1710). CPE-1717's finding: the
      # announcement DOES reach this log (they write to the process's stderr handle directly, which
      # libtest's `print!`-macro capture does not intercept — measured, see `fsutil::require_staged`),
      # but a passing leg with a notice buried in a 2,100-test log is a green board over ZERO coverage,
      # and nobody reads a green log. So `fsutil::require_staged` makes such a leg RED under CI, on the
      # platforms where the staging mechanism is supposed to work.
      #
      # This step proves that enforcement still bites instead of asserting it. `CPE_STAGING_SABOTAGE=1`
      # makes every staging attempt report failure — exactly what a runner that lost symlink privilege
      # or stopped honouring deny ACEs looks like — and the step FAILS IF THE TESTS PASS. Delete the
      # `require_staged` call from any of those helpers and this step goes red on its own, which is what
      # `Ticketing/wiki.md` → "Evidence Rules" asks of a guard.
      #
      # **`CPE_STAGING_STRICT` is deliberately NOT set here** (PR #898 review). Pinning it to `1` made
      # this step route around `staging_is_strict`'s `None => CI` arm — the single line connecting the
      # whole feature to an ordinary CI run. Measured: breaking that arm alone turned a real run green
      # over zero coverage while this guard still reported OK. Leaving the override unset means the
      # runs below depend on `CI`, which GitHub Actions sets, so the arm is exercised rather than
      # stepped past. Do not "make it explicit" — explicit is what blinded it.
      #
      # Cheap: same crate, same features, same profile as the step above, so nothing recompiles — it
      # re-runs already-built test binaries with a filter.
      - name: server — skip-visibility guard (CPE-1717)
        working-directory: crates/server
        shell: bash
        env:
          CPE_STAGING_SABOTAGE: "1"
        run: |
          set -u
          log="${RUNNER_TEMP:-/tmp}/cpe1717-sabotage.log"   # outside the checkout: no stray file can dirty a later git-diff guard
          fail=0
          # One leg per staging mechanism: a denied stat (`fsutil::deny_stat_of`), a dangling link
          # (`fsutil::make_dangling_link`), and an unreadable-but-stattable file
          # (`dispatch::deny_read`). None is cfg-gated, so all three OS legs are proved.
          for filter in dir_size_reports_the_real_cause_for_a_permission_denied_path_not_missing \
                        cpe_1710_execute_never_renames_over_a_dangling_link_at_the_new_name \
                        text_stats_separates_a_read_failure_from_a_not_text_verdict; do
            echo "--- sabotaged run (strictness inherited from CI, NOT pinned): $filter"
            if cargo test --locked "$filter" > "$log" 2>&1; then
              echo "::error::CPE-1717 regression: '$filter' PASSED while staging was sabotaged. A leg that could not stage its condition is reporting green, which is the exact silent-coverage-loss this guard exists to stop. Check that fsutil::require_staged is still called on this path, and that staging_is_strict still follows CI when no override is set."
              fail=1
            elif grep -q 'CPE-1717' "$log"; then
              echo "OK: '$filter' went red, and for the right reason:"
              grep -m1 -A6 'CPE-1717' "$log" || true
            else
              echo "::error::CPE-1717: '$filter' failed, but NOT with the require_staged panic — so this step is no longer evidence about the skip-visibility mechanism. Full log:"
              cat "$log"
              fail=1
            fi
          done
          # ── The FOURTH mechanism, `fsutil::deny_dir_traversal`, and the only one whose correct
          # answer differs by OS. It is `supported_here = cfg!(unix)`, measured genuinely unusable on
          # Windows (PR #874). So under the same sabotage the SAME test must go red on Linux/macOS and
          # stay a quiet, passing skip on Windows. That opposite-expectation pair is the only direct
          # proof that strictness does not turn a legitimately-skipping leg into a false red — the
          # acceptance criterion this ticket could otherwise only assert.
          echo "--- sabotaged run of the platform-asymmetric mechanism: link_status (deny_dir_traversal)"
          if cargo test --locked link_status_does_not_report_broken_for_a_permission_denied_target_not_missing > "$log" 2>&1; then
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "OK: on Windows this mechanism cannot work, so it stayed a passing skip — no false red:"
              grep -m1 'SKIPPED' "$log" || true
            else
              echo "::error::CPE-1717: on $RUNNER_OS the traversal deny IS supposed to work, so a sabotaged run must be red. It passed, which means supported_here is wrong for this site or require_staged is no longer on the path."
              fail=1
            fi
          else
            if [ "$RUNNER_OS" = "Windows" ]; then
              echo "::error::CPE-1717: a FALSE RED on Windows — deny_dir_traversal cannot work there, so this leg must skip quietly, not fail. Check its supported_here is cfg!(unix). Full log:"
              cat "$log"
              fail=1
            elif grep -q 'CPE-1717' "$log"; then
              echo "OK: on $RUNNER_OS it went red, and for the right reason:"
              grep -m1 -A6 'CPE-1717' "$log"
            else
              echo "::error::CPE-1717: red, but not with the require_staged panic. Full log:"
              cat "$log"
              fail=1
            fi
          fi
          # …and the documented escape hatch has to work, or every red above could just be an
          # always-strict constant. Same sabotage, `CPE_STAGING_STRICT=0`, must PASS as a loud skip.
          echo "--- sabotaged run with the escape hatch (CPE_STAGING_STRICT=0): must PASS"
          if CPE_STAGING_STRICT=0 cargo test --locked dir_size_reports_the_real_cause_for_a_permission_denied_path_not_missing > "$log" 2>&1; then
            echo "OK: the escape hatch still degrades to a loud skip:"
            grep -m1 'SKIPPED' "$log" || true
          else
            echo "::error::CPE-1717: CPE_STAGING_STRICT=0 did not restore the loud-skip behaviour, so the advertised escape hatch does not work and a runner-image regression would block every PR with no way out. Full log:"
            cat "$log"
            fail=1
          fi
          exit $fail

      - name: net — clippy + test
        # The headless network transport loop (Client(Rust) proxy + reference Server,
        # CPE-825): composes contract + server + security into a loopback client/server.
        working-directory: crates/net
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: mdns — clippy + test
        # The mDNS/DNS-SD LAN discovery crate (CPE-1523, epic CPE-1517): the cross-platform
        # complement to the Windows-native WNet discovery in src-tauri. CPE-1690: this crate was a
        # `path` dep of src-tauri (so its LIBRARY compiled on all three OSes via the `backend` job)
        # but was the only directory under crates/ never named in THIS job, so its 17 unit tests never
        # ran and its `#[cfg(test)]` code was never linted — "built but not verified", not "never
        # compiled". No optional features (see crates/mdns/Cargo.toml), so — unlike security/server/
        # ftp/vfs above — there is only one build to lint + test here.
        #
        # Portability: `discover_never_panics_and_returns_promptly_with_a_short_timeout` is the one
        # test that touches the network (calls the real `mdns_sd::ServiceDaemon`, which opens a
        # multicast UDP socket). It is deliberately NOT gated/skipped — `discover()`'s own contract is
        # to degrade to an empty Vec on any daemon/socket error rather than fail, so the test asserts
        # exactly that "never panics, returns by the 200ms deadline" contract and makes no assumption
        # about a real network or multicast interface being present; a locked-down/offline CI sandbox
        # is precisely the case it exists to cover. Confirmed passing on Windows locally (CPE-1690);
        # this step is what puts it in front of Linux + macOS for the first time.
        working-directory: crates/mdns
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: sftp — clippy + test
        # The SFTP FileSystemProvider (CPE-616): russh + host-key verification via
        # cpe-server::known_hosts. Uses the `ring` crypto backend (self-contained — no NASM/cmake),
        # and an in-process russh-sftp test server, so it runs on all three OSes with no Docker.
        working-directory: crates/sftp
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: webdav — clippy + test
        # The WebDAV FileSystemProvider (CPE-616): a 2nd remote backend over HTTP/WebDAV. Sync (ureq +
        # rustls/ring — pure Rust, no C tooling), tested against an in-process tiny_http server, so it runs
        # on all three OSes with no Docker.
        working-directory: crates/webdav
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: ftp — clippy + test
        # The FTP/FTPS FileSystemProvider (CPE-1514, epic CPE-1502): the 3rd remote backend, and the
        # first net-new Network protocol since SFTP/WebDAV. Sync (suppaftp + rustls/ring — pure Rust, no
        # C tooling), tested against an in-process hand-rolled FTP server, so it runs on all three OSes
        # with no Docker/real FTP daemon.
        #
        # BOTH feature modes, like `security`'s `jwt` and `server`'s `index`/`pdf-thumb` below. CPE-1673
        # put `extra_test_root` (and its base64/PEM decoders) behind `e2e-extra-ca`, and the PR #860 review
        # caught that gating them removed three tests from EVERY CI job: `net-e2e` only ever runs
        # crates/vfs's `real_server_conformance` integration binary with that feature, which never touches
        # cpe-ftp's own lib tests. They ran unconditionally before the gate. Feature-gating a test is only
        # safe if some job turns the feature on.
        working-directory: crates/ftp
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo clippy --locked --all-targets --features e2e-extra-ca -- -D warnings
          cargo test --locked --features e2e-extra-ca

      - name: s3 — clippy + test
        # The S3-compatible object-store backend (CPE-1681, epic CPE-1503): the 4th remote backend, and
        # the 2nd net-new Network protocol after FTP. Deliberately NO AWS SDK — the five REST requests and
        # the SigV4 signer are hand-rolled over `hmac`/`sha2`, which are already in the tree, so this adds
        # no new dependency family (and no tokio/hyper/aws-lc tree).
        #
        # Needs no network, credentials, Docker or services, so it runs identically on all three OSes.
        # That used to be because the slice was pure computation (endpoint addressing + signing against
        # AWS's published SigV4 test vectors) with "nothing to run against and no fixture server" — no
        # longer true as of CPE-1683, which added `S3Provider::list` and, with it, an in-process `tiny_http`
        # fixture bound to `127.0.0.1:0` (plus, from CPE-1706, a bare `TcpListener` that accepts and stalls,
        # to prove the HTTP read timeout fires). The conclusion is unchanged and the reason is now: every
        # server these tests talk to is spawned inside the test process on loopback.
        working-directory: crates/s3
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: vfs — clippy + test
        # The scheme router (CPE-616/CPE-1502): open(connection, secret, …) -> boxed FileSystemProvider,
        # dispatching to cpe-sftp / cpe-webdav / cpe-ftp. Ties the connections model to the concrete
        # remote providers.
        # Both feature modes for the same reason as `ftp` above — `e2e-extra-ca` propagates here, so the
        # gated build must be compiled and linted somewhere outside the Docker rig.
        working-directory: crates/vfs
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          cargo clippy --locked --all-targets --features e2e-extra-ca -- -D warnings
          cargo test --locked --features e2e-extra-ca

      - name: updater-verify — clippy + test
        # The headless updater-manifest + minisign signature guard (CPE-1058): parses tauri-action's
        # latest.json, checks shape + version, and verifies each platform's minisign signature against the
        # configured pubkey — retiring the CI-automatable part of manual-test burndown #6 (auto-update flow).
        # Standalone + NOT a dependency of src-tauri (the shipped app keeps using tauri_plugin_updater); the
        # one crypto dep (minisign) is confined here. The 3-OS matrix is the slice-A pin for the hermetic
        # tests (valid / tampered / wrong-key / version-mismatch / malformed).
        working-directory: crates/updater-verify
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  net-e2e:
    # CPE-1659 (epic CPE-1498), retiring MANUAL-TEST-BURNDOWN rows #7 and #13: every remote provider
    # this app ships (crates/sftp, crates/webdav, crates/ftp) is otherwise tested ONLY against an
    # in-process fake server written by the same author as the client — the `sftp`/`webdav`/`ftp` steps
    # above say so explicitly. This job is the interop layer above them: real third-party server images
    # (OpenSSH `sftp-server` via atmoz/sftp, Apache mod_dav via bytemark/webdav, vsftpd via
    # fauria/vsftpd — vsftpd/OpenSSH are literally what QNAP QTS runs) on a Docker bridge network,
    # driven by `crates/vfs/tests/real_server_conformance.rs` through the real `cpe_vfs::open` routing
    # seam. Slice 2 (`crates/net/tests/real_server_e2e.rs`) containerises the existing
    # `cpe-server-ref` reference Server on the SAME bridge network and drives it from this job's own
    # (non-127.0.0.1) address, retiring the "real non-loopback client<->server run" gap.
    #
    # Linux + Docker only (ubuntu-latest is the only leg in this repo's matrix with Docker) — this
    # tests protocol INTEROP, not OS behaviour, so one OS is the right scope; deliberately a separate
    # job from `crates` above so Docker is never added to the 3-OS matrix.
    #
    # BLOCKING — never `continue-on-error`. Making this job non-blocking (or deleting it) later is a
    # burndown regression under the QA charter's rule 2; see .claude/qa-architecture/README.md.
    name: Network E2E (ubuntu-latest, real servers)
    needs: lockfile-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./crates/vfs -> target
            ./crates/net -> target

      - name: Create the Docker bridge network (static subnet, CPE-1659)
        # A fixed subnet lets every service get a STABLE, predictable IP via `--ip` — needed so the
        # SFTP host-key TOFU steps below can recreate the sftp-e2e container (with a fresh host key)
        # while its address stays the same, which is the whole point of that assertion. It also gives
        # slice 2 (`cpe-server-ref`) a genuinely non-127.0.0.1, different-network-namespace address for
        # free — the actual thing burndown row #7 asks for.
        run: docker network create --subnet=172.28.0.0/24 "net-e2e-${{ github.run_id }}"

      - name: Seed the hostile fixture tree (CPE-1659)
        # Deliberately hostile, not tidy: nested dirs, a 0-byte file, a 5 MiB binary of random bytes, a
        # name with a space, one with `#`/`%` (the classic WebDAV href-encoding bug), one with
        # non-ASCII/emoji, and a file whose bytes mix CRLF and lone LF (the classic FTP ASCII-mode
        # corruption trap). Each provider gets its OWN copy so mutating one scheme's copy during its
        # test run can never leak into another scheme's `list` assertions.
        shell: bash
        run: |
          set -euo pipefail
          seed() {
            local dir="$1"
            mkdir -p "$dir/sub/dir"
            : > "$dir/empty.bin"
            head -c 5242880 /dev/urandom > "$dir/big.bin"
            printf 'nested fixture file\n' > "$dir/sub/dir/nested.txt"
            printf 'space file body\n' > "$dir/name with space.txt"
            printf 'weird name body\n' > "$dir/weird#name%.txt"
            printf 'emoji name body\n' > "$dir/emoji-😀-name.txt"
            printf 'line1\r\nline2\nline3\r\n' > "$dir/mixed-eol.txt"
            chmod -R 0777 "$dir"
          }
          seed "$RUNNER_TEMP/fixture-sftp"
          seed "$RUNNER_TEMP/fixture-webdav"
          seed "$RUNNER_TEMP/fixture-ftp"
          mkdir -p "$RUNNER_TEMP/fixture-net"
          printf 'alpha\n' > "$RUNNER_TEMP/fixture-net/alpha.txt"
          printf 'beta\n' > "$RUNNER_TEMP/fixture-net/beta.txt"
          chmod -R 0777 "$RUNNER_TEMP/fixture-net"
          {
            echo "CPE_E2E_SFTP_FIXTURE_DIR=$RUNNER_TEMP/fixture-sftp"
            echo "CPE_E2E_WEBDAV_FIXTURE_DIR=$RUNNER_TEMP/fixture-webdav"
            echo "CPE_E2E_FTP_FIXTURE_DIR=$RUNNER_TEMP/fixture-ftp"
            echo "CPE_E2E_NET_FIXTURE_DIR=$RUNNER_TEMP/fixture-net"
            echo "CPE_E2E_SFTP_KNOWN_HOSTS_STORE=$RUNNER_TEMP/sftp-known-hosts"
          } >> "$GITHUB_ENV"

      # Images pinned by BOTH tag (human-readable) AND digest (immutable) — `name:tag@sha256:digest` —
      # so a silent upstream retag can never change what "real server" means underneath this job without
      # a deliberate, reviewed commit updating the digest here. Digests below are what a real
      # `docker pull` on this job resolved (confirmed on a live CI run before being hardened into a pin);
      # bumping the tag AND re-confirming the resolved digest is the deliberate way to move these
      # forward.
      - name: Pull every real server image by its pinned digest (CPE-1659)
        run: |
          docker pull atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
          docker pull bytemark/webdav:latest@sha256:21eed0df1238d17766080425f9ef46da2c1130e3e3aa9eaf36794d2a72e7c616
          docker pull fauria/vsftpd:latest@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177

      - name: Start real SFTP server (OpenSSH sftp-server, atmoz/sftp)
        run: |
          docker run -d --name sftp-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.11 \
            -v "$CPE_E2E_SFTP_FIXTURE_DIR:/home/tester/upload" \
            atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475 \
            "tester:testpass:1001:1001:upload"
          {
            echo "CPE_E2E_SFTP_HOST=172.28.0.11"
            echo "CPE_E2E_SFTP_USER=tester"
            echo "CPE_E2E_SFTP_PASS=testpass"
            echo "CPE_E2E_SFTP_ROOT=/upload"
          } >> "$GITHUB_ENV"

      - name: Start real WebDAV server (Apache mod_dav, bytemark/webdav)
        run: |
          docker run -d --name webdav-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.12 \
            -v "$CPE_E2E_WEBDAV_FIXTURE_DIR:/var/lib/dav/data" \
            -e AUTH_TYPE=Basic -e USERNAME=tester -e PASSWORD=testpass \
            bytemark/webdav:latest@sha256:21eed0df1238d17766080425f9ef46da2c1130e3e3aa9eaf36794d2a72e7c616
          {
            echo "CPE_E2E_WEBDAV_HOST=172.28.0.12"
            echo "CPE_E2E_WEBDAV_USER=tester"
            echo "CPE_E2E_WEBDAV_PASS=testpass"
            echo "CPE_E2E_WEBDAV_ROOT=/"
          } >> "$GITHUB_ENV"

      # fauria/vsftpd ships with NO `ssl_enable` directive at all (plain FTP only) — FTPS needs it
      # explicitly turned on, plus a real certificate. A public CA fundamentally cannot issue one for a
      # private, ephemeral Docker IP, so this generates a throwaway self-signed cert (with an IP SAN,
      # since certificate verifiers ignore the CN) and a full replacement vsftpd.conf (the image's
      # entrypoint only ever APPENDS its own PASV/logging directives to whatever's already at this path,
      # so pre-seeding it via bind mount is safe). `CPE_E2E_FTPS_EXTRA_CA_PEM_FILE` is the CI/test-only
      # trust-anchor env var `crates/ftp` reads (see `extra_test_root` in its source) — a no-op for every
      # real app run, only ever set here.
      - name: Generate a throwaway FTPS certificate + vsftpd.conf (CPE-1659)
        shell: bash
        run: |
          set -euo pipefail
          ssl_dir="$RUNNER_TEMP/vsftpd-ssl"
          mkdir -p "$ssl_dir"
          # CPE-1659: `openssl req -x509` without an explicit basicConstraints extension inherits the
          # default OpenSSL config's `v3_ca` section, which sets `CA:TRUE` — fine for a real root CA, but
          # this same certificate is ALSO the leaf vsftpd presents on the wire, and rustls/webpki's path
          # validation refuses to accept a CA:TRUE certificate as a TLS end-entity leaf
          # ("invalid peer certificate: CaUsedAsEndEntity", confirmed on this rig's first run to get past
          # the cipher-suite mismatch). Explicit `CA:FALSE` plus a serverAuth EKU marks it as what it
          # actually is here: a self-signed end-entity cert that happens to also be its own trust anchor
          # (added separately via CPE_E2E_FTPS_EXTRA_CA_PEM_FILE) — trust anchors are exempt from the
          # basicConstraints check, only the presented leaf is not.
          openssl req -x509 -newkey rsa:2048 -keyout "$ssl_dir/vsftpd.key" -out "$ssl_dir/vsftpd.pem" \
            -days 2 -nodes -subj "/CN=172.28.0.13" \
            -addext "subjectAltName=IP:172.28.0.13" \
            -addext "basicConstraints=critical,CA:FALSE" \
            -addext "keyUsage=critical,digitalSignature,keyEncipherment" \
            -addext "extendedKeyUsage=serverAuth"
          chmod 0755 "$ssl_dir"
          chmod 0644 "$ssl_dir/vsftpd.key" "$ssl_dir/vsftpd.pem"
          conf="$RUNNER_TEMP/vsftpd.conf"
          : > "$conf"
          echo 'background=NO' >> "$conf"
          echo 'anonymous_enable=NO' >> "$conf"
          echo 'local_enable=YES' >> "$conf"
          echo 'guest_enable=YES' >> "$conf"
          echo 'virtual_use_local_privs=YES' >> "$conf"
          echo 'write_enable=YES' >> "$conf"
          echo 'pam_service_name=vsftpd_virtual' >> "$conf"
          echo 'user_sub_token=$USER' >> "$conf"
          echo 'local_root=/home/vsftpd/$USER' >> "$conf"
          echo 'chroot_local_user=YES' >> "$conf"
          echo 'allow_writeable_chroot=YES' >> "$conf"
          echo 'hide_ids=YES' >> "$conf"
          echo 'xferlog_enable=YES' >> "$conf"
          echo 'xferlog_file=/var/log/vsftpd/vsftpd.log' >> "$conf"
          echo 'port_enable=YES' >> "$conf"
          echo 'connect_from_port_20=YES' >> "$conf"
          echo 'ftp_data_port=20' >> "$conf"
          echo 'seccomp_sandbox=NO' >> "$conf"
          echo 'ssl_enable=YES' >> "$conf"
          echo 'rsa_cert_file=/etc/vsftpd/ssl/vsftpd.pem' >> "$conf"
          echo 'rsa_private_key_file=/etc/vsftpd/ssl/vsftpd.key' >> "$conf"
          echo 'allow_anon_ssl=NO' >> "$conf"
          echo 'force_local_data_ssl=NO' >> "$conf"
          echo 'force_local_logins_ssl=NO' >> "$conf"
          echo 'require_ssl_reuse=NO' >> "$conf"
          # CPE-1659: vsftpd's OWN default `ssl_ciphers` is the legacy `DES-CBC3-SHA` (confirmed against
          # the vsftpd.conf(5) man page) — some distro builds extend it slightly, but never with a modern
          # AEAD suite. `cpe-ftp`'s rustls-ring client only ever offers ECDHE+AES-GCM/ChaCha20 (TLS 1.2)
          # and TLS 1.3 suites, so against the real vsftpd default the two sides share zero overlap and
          # the handshake fails with a bare "HandshakeFailure" alert (confirmed on this rig's first run
          # to get this far: FTP/SFTP/WebDAV all passed, only FTPS failed on this). `HIGH` is OpenSSL's
          # own cipher-string alias for its strong-cipher set, which includes the ECDHE-RSA-AES*-GCM
          # suites rustls needs.
          echo 'ssl_ciphers=HIGH' >> "$conf"
          # CPE-1659: deliberately NOT setting ssl_tlsv1/ssl_sslv2/ssl_sslv3 here — an earlier guess (never
          # confirmed against a real error) blamed legacy-TLS config rejection for vsftpd's fast exit.
          # Leaving these three directives out lets vsftpd negotiate its own modern default TLS range;
          # `ssl_enable=YES` above is what actually turns FTPS on.
          #
          # CPE-1659 CONFIRMED root cause (via the foreground diagnostic replay below): vsftpd refuses to
          # load a config file it doesn't own — "500 OOPS: config file not owned by correct user, or not a
          # file". vsftpd.conf is generated here by the unprivileged `runner` user, then bind-mounted into
          # the container where vsftpd runs as root (uid 0); bind mounts don't remap ownership, so the
          # file stayed owned by the runner's uid and the root-owned check failed on every single run —
          # this was the real, reproducible cause of the "never accepted a TCP connection" failures, not
          # the TLS version. `sudo chown root:root` here is what actually fixes it.
          sudo chown root:root "$conf"
          sudo chown -R root:root "$ssl_dir"
          {
            echo "CPE_E2E_FTP_SSL_DIR=$ssl_dir"
            echo "CPE_E2E_FTP_CONF=$conf"
            echo "CPE_E2E_FTPS_EXTRA_CA_PEM_FILE=$ssl_dir/vsftpd.pem"
          } >> "$GITHUB_ENV"

      - name: Start real FTP server (vsftpd, fauria/vsftpd)
        run: |
          docker run -d --name ftp-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.13 \
            -v "$CPE_E2E_FTP_FIXTURE_DIR:/home/vsftpd/tester" \
            -v "$CPE_E2E_FTP_CONF:/etc/vsftpd/vsftpd.conf" \
            -v "$CPE_E2E_FTP_SSL_DIR:/etc/vsftpd/ssl" \
            -e FTP_USER=tester -e FTP_PASS=testpass -e LOCAL_UMASK=022 -e LOG_STDOUT=YES \
            -e PASV_ADDRESS=172.28.0.13 -e PASV_MIN_PORT=21100 -e PASV_MAX_PORT=21110 \
            fauria/vsftpd:latest@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177
          {
            echo "CPE_E2E_FTP_HOST=172.28.0.13"
            echo "CPE_E2E_FTP_USER=tester"
            echo "CPE_E2E_FTP_PASS=testpass"
            echo "CPE_E2E_FTP_ROOT=/"
          } >> "$GITHUB_ENV"

      # CPE-1659: the first live run of this rig had ftp-e2e exit 147ms after `docker run -d` with
      # exitCode=2 and NOTHING in `docker logs`, even with LOG_STDOUT=YES — the image's own
      # `run-vsftpd.sh` hardcodes `&>/dev/null /usr/sbin/vsftpd …` on its final line (confirmed against
      # fauria/docker-vsftpd's run-vsftpd.sh), and LOG_STDOUT only controls the xferlog symlink, never
      # that redirect. So a real startup failure here is invisible by construction, and the "wait for
      # connections" step below would otherwise just time out with no reason why. This step notices an
      # immediate exit and replays the SAME script with that one redirect stripped, in the foreground, so
      # vsftpd's actual stderr reaches this job's log instead of another guess.
      - name: Verify the FTP container actually started; capture vsftpd's real startup error if not (CPE-1659)
        run: |
          sleep 1
          status="$(docker inspect -f '{{.State.Status}}' ftp-e2e)"
          if [ "$status" != "running" ]; then
            exitCode="$(docker inspect -f '{{.State.ExitCode}}' ftp-e2e)"
            echo "::error::ftp-e2e exited immediately (status=$status exitCode=$exitCode) — replaying its startup script with the '&>/dev/null vsftpd' redirect stripped to surface the real reason"
            docker run --rm \
              --network "net-e2e-${{ github.run_id }}" \
              -v "$CPE_E2E_FTP_FIXTURE_DIR:/home/vsftpd/tester" \
              -v "$CPE_E2E_FTP_CONF:/etc/vsftpd/vsftpd.conf" \
              -v "$CPE_E2E_FTP_SSL_DIR:/etc/vsftpd/ssl" \
              -e FTP_USER=tester -e FTP_PASS=testpass -e LOCAL_UMASK=022 -e LOG_STDOUT=YES \
              -e PASV_ADDRESS=172.28.0.13 -e PASV_MIN_PORT=21100 -e PASV_MAX_PORT=21110 \
              --entrypoint /bin/bash \
              fauria/vsftpd:latest@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177 \
              -c "sed -i 's#&>/dev/null##' /usr/sbin/run-vsftpd.sh; /usr/sbin/run-vsftpd.sh" || true
            exit 1
          fi
          echo "ftp-e2e is running"

      - name: Wait for the real servers to accept connections
        run: |
          set -euo pipefail
          for hp in 172.28.0.11:22 172.28.0.12:80 172.28.0.13:21; do
            host="${hp%%:*}"; port="${hp##*:}"
            up=""
            for _ in $(seq 1 30); do
              (echo > "/dev/tcp/$host/$port") >/dev/null 2>&1 && { up=1; echo "$hp is up"; break; }
              sleep 1
            done
            if [ -z "$up" ]; then
              echo "::error::$hp never accepted a TCP connection within 30s"
              exit 1
            fi
          done

      # CPE-1673 (job wall-clock, item 6): this release build was the single biggest step in the job
      # (measured ~4 minutes on its own, cold OR warm cache — the existing `swatinem/rust-cache` restore
      # above doesn't meaningfully speed it up, confirmed by comparing two real runs). It shares NO files
      # with `crates/vfs` (a separate, standalone crate with its own `target/`), so there's nothing
      # stopping it from running at the same time as the conformance suite's OWN compile-heavy step
      # (building `real_server_conformance` — normally hidden inside the "TOFU part 1" step below). Doing
      # both here, backgrounded, turns two serial compiles into one job bounded by the slower of the two.
      # `--features e2e-extra-ca` on the vfs pre-build matches every other crates/vfs invocation in this
      # job (TOFU steps + the full conformance suite below) so they all share one fingerprint and none of
      # them re-triggers a rebuild the others already paid for.
      - name: "Build the real cpe-server-ref binary (release) AND pre-build the vfs conformance test binary, in parallel (CPE-1673)"
        run: |
          set -euo pipefail
          (cd crates/net && cargo build --locked --release --bin cpe-server-ref) &
          net_pid=$!
          (cd crates/vfs && cargo test --locked --no-run --features e2e-extra-ca --test real_server_conformance) &
          vfs_pid=$!
          fail=0
          wait "$net_pid" || { echo "::error::cpe-server-ref release build failed"; fail=1; }
          wait "$vfs_pid" || { echo "::error::crates/vfs real_server_conformance pre-build failed"; fail=1; }
          if [ "$fail" != "0" ]; then
            exit 1
          fi

      - name: Containerise + start the real cpe-server-ref (Slice 2 CPE-1659)
        run: |
          docker build -t cpe-server-ref-e2e -f crates/net/Dockerfile.e2e crates/net
          docker run -d --name net-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.14 \
            -v "$CPE_E2E_NET_FIXTURE_DIR:/data" \
            cpe-server-ref-e2e
          {
            echo "CPE_E2E_NET_ADDR=172.28.0.14:9876"
            echo "CPE_E2E_NET_CONTAINER_DIR=/data"
          } >> "$GITHUB_ENV"

      - name: "crates/vfs — SFTP host-key TOFU, part 1: first contact then trusts (real OpenSSH)"
        working-directory: crates/vfs
        # `--features e2e-extra-ca` here too (CPE-1673), purely so every crates/vfs test invocation in
        # this job shares one fingerprint with the pre-build above — this test itself never touches FTPS.
        run: cargo test --locked --features e2e-extra-ca --test real_server_conformance sftp_host_key_tofu_first_contact_then_trusts_against_real_sshd -- --ignored --nocapture

      - name: Recreate the SFTP container with a FRESH host key (CPE-1659 TOFU negative case)
        # Same static IP, no host-key volume mounted — atmoz/sftp generates brand-new ephemeral host
        # keys on a fresh container, so the address the previous step trusted now presents a DIFFERENT
        # key, exactly the "changed key" scenario CPE-1512 must refuse.
        run: |
          set -euo pipefail
          docker rm -f sftp-e2e
          docker run -d --name sftp-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.11 \
            -v "$CPE_E2E_SFTP_FIXTURE_DIR:/home/tester/upload" \
            atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475 \
            "tester:testpass:1001:1001:upload"
          # CPE-1673 follow-up: this loop used to fall through silently on a timeout — the exact pattern
          # fixed in the WebDAV DELETE retry (items 1/2 above), and the pattern that hid a vsftpd startup
          # crash for two full CI runs before CPE-1659 tracked it down (see the FTP steps above). Harmless
          # *today* only because the TOFU test that follows asserts `err.contains("CHANGED")` rather than
          # merely "connect failed", so a dead container still fails loudly — but fix it here for symmetry
          # with the "Wait for the real servers" step above, before someone loosens that assertion and
          # silently re-opens the hole.
          up=""
          for _ in $(seq 1 30); do
            (echo > "/dev/tcp/172.28.0.11/22") >/dev/null 2>&1 && { up=1; echo "172.28.0.11:22 is up"; break; }
            sleep 1
          done
          if [ -z "$up" ]; then
            echo "::error::172.28.0.11:22 never accepted a TCP connection within 30s after recreating sftp-e2e"
            exit 1
          fi

      - name: "crates/vfs — SFTP host-key TOFU, part 2: a changed key is refused (real OpenSSH)"
        working-directory: crates/vfs
        # `--features e2e-extra-ca` here too (CPE-1673) — same fingerprint-consistency reason as part 1.
        run: cargo test --locked --features e2e-extra-ca --test real_server_conformance sftp_host_key_tofu_changed_key_is_refused_against_real_sshd -- --ignored --nocapture

      - name: crates/vfs — full conformance suite (sftp / webdav / ftp / ftps) against real servers, in parallel by scheme
        working-directory: crates/vfs
        # CPE-1673 (job wall-clock, item 6): the 4 conformance tests below used to run one after another
        # under `--test-threads=1` (~5 minutes). SFTP and WebDAV each have their OWN container and OWN
        # fixture directory (see the "Start real … server" steps above), so they can run fully
        # concurrently with each other and with the FTP pair — nothing shared, nothing to race. FTP and
        # FTPS, though, share the SAME `ftp-e2e` container AND the SAME host fixture directory (FTPS is
        # just the same vsftpd over TLS — see `assert_list_matches_seeded_set`'s comment in
        # `tests/real_server_conformance.rs`), so those two stay serialised (`--test-threads=1`) relative
        # to EACH OTHER, just as a group running alongside the other two. Net effect: wall-clock becomes
        # roughly the slowest of the three groups instead of the sum of all four tests.
        #
        # `--features e2e-extra-ca` on every group (not just the FTP one) for the same fingerprint reason
        # as the TOFU steps above and the pre-build step: all crates/vfs test invocations in this job must
        # agree on features, or cargo treats them as different builds and re-links between them.
        run: |
          # NOTE: multiple test-name filters are a libtest harness feature (args AFTER `--`), not a
          # `cargo test` feature — `cargo test <name1> <name2>` itself only accepts ONE positional
          # TESTNAME before `--` and rejects a second (confirmed locally: "unexpected argument"). The FTP
          # group below therefore passes both filters to the harness, after `--`, not to cargo.
          set -euo pipefail
          cargo test --locked --features e2e-extra-ca --test real_server_conformance \
            -- sftp_conformance_against_real_openssh --ignored --nocapture --test-threads=1 \
            > "$RUNNER_TEMP/e2e-sftp.log" 2>&1 &
          sftp_pid=$!
          cargo test --locked --features e2e-extra-ca --test real_server_conformance \
            -- webdav_conformance_against_real_apache_moddav --ignored --nocapture --test-threads=1 \
            > "$RUNNER_TEMP/e2e-webdav.log" 2>&1 &
          webdav_pid=$!
          cargo test --locked --features e2e-extra-ca --test real_server_conformance \
            -- ftp_conformance_against_real_vsftpd ftps_conformance_against_real_vsftpd_with_tls \
               --ignored --nocapture --test-threads=1 \
            > "$RUNNER_TEMP/e2e-ftp.log" 2>&1 &
          ftp_pid=$!

          fail=0
          wait "$sftp_pid" || fail=1
          wait "$webdav_pid" || fail=1
          wait "$ftp_pid" || fail=1

          echo "=== sftp group log ==="; cat "$RUNNER_TEMP/e2e-sftp.log"
          echo "=== webdav group log ==="; cat "$RUNNER_TEMP/e2e-webdav.log"
          echo "=== ftp/ftps group log ==="; cat "$RUNNER_TEMP/e2e-ftp.log"

          if [ "$fail" != "0" ]; then
            echo "::error::at least one parallel conformance group failed — see the group logs above"
            exit 1
          fi

      - name: "crates/net — Slice 2: real client<->server E2E over a non-loopback container IP"
        working-directory: crates/net
        run: cargo test --locked --test real_server_e2e -- --ignored --nocapture

      - name: Dump real-server container logs (debug aid on failure)
        if: failure()
        run: |
          for c in sftp-e2e webdav-e2e ftp-e2e net-e2e; do
            echo "=== $c state ==="
            docker inspect "$c" --format 'status={{.State.Status}} exitCode={{.State.ExitCode}} startedAt={{.State.StartedAt}} finishedAt={{.State.FinishedAt}} oomKilled={{.State.OOMKilled}} error={{.State.Error}}' || true
            echo "=== $c logs ==="
            docker logs "$c" 2>&1 | tail -n 200 || true
          done

      - name: Tear down containers + network (CPE-1659)
        if: always()
        run: |
          docker rm -f sftp-e2e webdav-e2e ftp-e2e net-e2e >/dev/null 2>&1 || true
          docker network rm "net-e2e-${{ github.run_id }}" >/dev/null 2>&1 || true

  sidecar:
    # The sidecar platform crates (sidecar/contract, sidecar/host) are standalone —
    # deliberately NOT part of the app's cargo workspace, so the `backend` job above
    # doesn't cover them. Build, lint, and test them on every OS we ship, so
    # `#[cfg(windows)]` code (the keychain backend) and the real-process E2E tests are
    # validated cross-platform (CPE-302; first half of the CPE-272 delete-test guard —
    # the app CI here never references the sidecar crates, proving the one-way boundary).
    name: Sidecar platform (${{ matrix.os }}) — clippy + test
    needs: lockfile-preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # One-way dependency guard (ADR 0001 / CPE-272): a sidecar crate must NEVER
      # depend on the explorer app. Fail if any sidecar Cargo.toml references it.
      - name: Enforce one-way dependency
        shell: bash
        run: |
          if grep -rE '^(app_lib|cross-platform-explorer)\b|path = "\.\./\.\./src-tauri' sidecar/*/Cargo.toml; then
            echo "::error::a sidecar crate depends on the explorer app — that breaks the one-way boundary"
            exit 1
          fi
          echo "one-way dependency holds"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The Linux Secret Service keyring backend (CPE-322) links libdbus.
      # CPE-1787: ForceIPv4/retry/timeout hardening — see the `backend` job's copy of this comment
      # (CPE-1772) for the IPv6-stall diagnosis this guards against. This `apt-get update`'s cached
      # lists are reused by the "host — real keychain round-trip" step's `gnome-keyring` install below.
      # CPE-1916: remove the preinstalled azure-cli/Microsoft-prod apt sources before updating — see the
      # `msrv` job's copy of this comment for why. This step has no `continue-on-error`, so a real
      # `libdbus-1-dev`/`pkg-config` install failure still fails the job exactly as before.
      - name: Install Linux system dependencies (libdbus for the keyring)
        if: matrix.os == 'ubuntu-latest'
        timeout-minutes: 8
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libdbus-1-dev pkg-config

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./sidecar/contract -> target
            ./sidecar/host -> target
            ./sidecar/ai-console -> target
            ./sidecar/repos -> target
            ./sidecar/agent-board -> target

      - name: contract — clippy + test
        working-directory: sidecar/contract
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: host — clippy + test
        working-directory: sidecar/host
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      # CPE-322: verify a REAL OS-keychain round-trip on each runner (Windows Credential Manager /
      # macOS Keychain / Linux Secret Service) — the hardware verification the ticket needs, run on
      # GitHub's macOS + Linux hosts. The test is `#[ignore]`d so the normal run never touches the
      # keychain; here we run it explicitly. Linux needs an unlocked gnome-keyring in a D-Bus session.
      # Best-effort (continue-on-error): a CI keychain quirk must never red the pipeline — a green run
      # is the signal.
      # CPE-1787: `timeout-minutes` is new — same reasoning as the `ffmpeg` install in the `crates` job:
      # `continue-on-error: true` only helps once the step reaches a terminal state, and this step's
      # `gnome-keyring` install (site 5, sharing the apt-get update cache from the step above) had no
      # cap at all. Sized generously above the ~45s apt normally costs here to leave room for the
      # real keychain round-trip test that follows it.
      - name: host — real keychain round-trip (CPE-322)
        working-directory: sidecar/host
        continue-on-error: true
        timeout-minutes: 10
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y gnome-keyring
            dbus-run-session -- bash -c '
              eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
              cargo test --locked --test keyring_roundtrip -- --ignored --nocapture
            '
          else
            cargo test --locked --test keyring_roundtrip -- --ignored --nocapture
          fi

      - name: ai-console — clippy + test
        working-directory: sidecar/ai-console
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: repos — clippy + test
        working-directory: sidecar/repos
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

      - name: agent-board — clippy + test
        # The Agent Board sidecar (CPE-851, epic CPE-850): out-of-process Kanban over Ticketing/.
        working-directory: sidecar/agent-board
        run: |
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked

  # CPE-1796: mechanical guard for the ffmpeg pin's SHAPE, not just its freshness.
  # ffmpeg-pin-freshness.yml (scheduled, weekly) only detects a pin that has ALREADY rotted — it has
  # no opinion on whether the pin it's checking is a rolling daily or a permanent month-end anchor,
  # so a PR that repins FFMPEG_BUILD_TAG back to a daily merged green and silently restarted the
  # ~14-day pruning clock CPE-1789 had just stopped. Before CPE-1796 the only defence was a comment
  # next to the pin in release-sidecar.yml — guidance, not a guard. This job runs on every push/PR
  # (same as every other job in this workflow — no path filter, matching the convention the other
  # repo-hygiene guards here already use, e.g. the CPE-1690 crates/sidecar directory guard and the
  # CPE-1717 skip-visibility guards above), so a daily pin is caught at PR time, before merge — the
  # scheduled freshness check alone could only catch it days later, after it had already shipped.
  # Standalone job (not a step bolted onto `backend`/`crates`) so it stays independent of any other
  # work touching those jobs' steps, and cheap: just a checkout + one bash step, no toolchain.
  ffmpeg-pin-guard:
    name: ffmpeg pin is a month-end anchor
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CPE-1802: actions:write lets the step below dispatch ffmpeg-pin-freshness.yml when this job
      # takes the override path. Declaring a permissions: block at all drops every unlisted scope to
      # "none", so contents: read (actions/checkout below needs it) is repeated here explicitly.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Assert FFMPEG_BUILD_TAG is a month-end anchor, not a rolling daily
        id: guard
        shell: bash
        env:
          RELEASE_SIDECAR_YML: .github/workflows/release-sidecar.yml
        run: |
          set -euo pipefail
          # Same date rule ffmpeg-pin-freshness.yml uses to pick a recommendation, sourced from one
          # file rather than retyped here — see that file's header comment for why a second hand-
          # typed copy of a rule like this is exactly how this repo got CPE-1795.
          source .github/workflows/scripts/ffmpeg-anchor-check.sh

          extract() {
            local key="$1"
            grep -oP "^\s*${key}:\s*\"\K[^\"]*" "$RELEASE_SIDECAR_YML" | head -1
          }
          tag="$(extract FFMPEG_BUILD_TAG)"
          override_reason="$(extract FFMPEG_BUILD_TAG_OVERRIDE_REASON)"

          if [ -z "$tag" ]; then
            echo "::error::could not find FFMPEG_BUILD_TAG in ${RELEASE_SIDECAR_YML} -- its \"Stage native deps\" env: block moved or was reformatted, so this guard can no longer see the real pin. Fix the extraction in ci.yml's \"ffmpeg pin is a month-end anchor\" job before trusting it again."
            exit 1
          fi

          if is_ffmpeg_anchor_tag "$tag"; then
            echo "OK: FFMPEG_BUILD_TAG=${tag} is a month-end anchor."
            exit 0
          fi

          # Review finding (blocker): `[ -n "$override_reason" ]` is "non-zero length", not
          # "non-blank" -- a three-space string or a lazy "x" both satisfied it and rubber-stamped
          # the override with no real reason recorded, defeating the whole point of asking for one
          # (a reviewer seeing WHY the safety net was bypassed). Trim whitespace and require a
          # minimum length before accepting it as a genuine reason.
          trimmed_reason="$(printf '%s' "$override_reason" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [ ${#trimmed_reason} -ge 10 ]; then
            echo "::warning::FFMPEG_BUILD_TAG=${tag} is a rolling daily, not a month-end anchor -- allowed only because release-sidecar.yml sets FFMPEG_BUILD_TAG_OVERRIDE_REASON: \"${override_reason}\". That reason is now recorded in this run's log and in the PR diff. Confirm it's still current, and repin to the newest month-end anchor (clear the override once you do) as soon as it no longer applies -- BtbN still prunes this daily on its usual ~14-day window regardless of the override."
            # CPE-1802: mark the override as taken so the step below can decide whether to fire
            # ffmpeg-pin-freshness.yml. Only set on THIS branch -- never on the anchor-is-fine
            # branch above -- so a normal push with a real anchor pin never triggers an extra
            # dispatch.
            echo "override_active=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$trimmed_reason" ]; then
            echo "::error::FFMPEG_BUILD_TAG_OVERRIDE_REASON is set but too short to be a real reason (\"${override_reason}\") -- explain WHY this is a deliberate daily pin (e.g. what it fixes and when it'll be reverted to an anchor), not just restate that it is one."
            exit 1
          fi

          echo "::error::FFMPEG_BUILD_TAG=${tag} looks like a rolling BtbN/FFmpeg-Builds DAILY autobuild, not a month-end anchor."
          echo "::error::BtbN prunes dailies on a ~14-day window. Pinning one here restarts that clock, and the release build WILL start 404ing on its download in a couple of weeks -- exactly what CPE-1789 fixed once already after a daily pin rotted mid-cycle."
          echo "::error::Pick the newest month-end anchor tag instead (a date whose following day is the 1st of the next month -- see ffmpeg-pin-freshness.yml's cadence note for how BtbN's two retention classes work; that workflow's \"Determine current live tags to recommend\" step, or a manual workflow_dispatch of it, finds a currently-live one)."
          echo "::error::If you genuinely need a daily for a short window, don't loosen this check to let it through silently -- set FFMPEG_BUILD_TAG_OVERRIDE_REASON in release-sidecar.yml's \"Stage native deps\" env: block to a real, one-line reason (at least 10 characters). That keeps the override visible in the PR diff and in every run of this guard, instead of quietly disabling it for everyone."
          exit 1

      # CPE-1802: while the override above is live, FFMPEG_BUILD_TAG genuinely IS a rolling daily
      # again -- the same ~14-day pruning clock ffmpeg-pin-freshness.yml exists to watch, weekly,
      # only because this guard normally keeps the daily path unreachable. Before this, the only
      # mitigation on offer was "someone remembers to workflow_dispatch the freshness check by
      # hand" -- the exact discipline-based net CPE-1796 replaced, reintroduced at the one moment
      # someone is already doing something unusual and under time pressure. So fire it automatically
      # instead: every push to `main` that reaches this job, for as long as the override stays set.
      # Push only, not PR -- the override isn't live until it merges, and a fork PR's GITHUB_TOKEN
      # couldn't dispatch anyway. NOT literally every push to the branch: this workflow's own
      # `paths-ignore` (CPE-1781) skips a ticket-bookkeeping-only push under `Ticketing/Tickets/**` /
      # `Ticketing/Sprints/**` entirely, so this job (and this step) doesn't run for one of those --
      # harmless here, since a bookkeeping-only commit can't be the one that sets or clears
      # FFMPEG_BUILD_TAG_OVERRIDE_REASON in release-sidecar.yml anyway. During a short override
      # window this is still a small number of extra runs, which is the trade the ticket calls out
      # explicitly over trying to express a conditional schedule in GitHub Actions (awkward to do at
      # all).
      - name: Fire the freshness check now that the override is live
        if: steps.guard.outputs.override_active == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          # Not interpolated directly into the run: script below (the canonical Actions
          # script-injection shape) even though the push trigger's `branches: [main]` makes this
          # provably always "main" today -- routing it through env: means widening that trigger list
          # later can't reopen an injection path here even if nobody remembers this comment.
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "::notice::FFMPEG_BUILD_TAG_OVERRIDE_REASON is active on main -- dispatching ffmpeg-pin-freshness.yml now instead of waiting for its weekly schedule (CPE-1802), so the daily pin's ~14-day runway is actually watched."
          gh workflow run ffmpeg-pin-freshness.yml --ref "$REF_NAME"

  # CPE-1855: a declared `rust-version` means nothing unless something actually tries to compile
  # every manifest with EXACTLY that floor. `dtolnay/rust-toolchain@stable` everywhere else in this
  # file always builds on whatever is current, so `rust-version` could say anything and nothing would
  # notice it drifting from what the code actually needs -- which is exactly how it went stale: every
  # manifest claimed 1.77.2 while `crates/server/src/fsutil.rs`'s `confined_to` (production code, not
  # a test) already used `std::io::ErrorKind::NotADirectory`, stable since 1.83.0 (`io_error_a_bit_more`,
  # confirmed against the installed toolchain's own `#[stable(since = "1.83.0")]` attribute, not
  # guessed) -- and `crates/server/src/transfer.rs` used the same kind test-only. No other post-1.77.2
  # API was found in a full-tree audit (`std::iter::repeat_n`, stable 1.82.0, is the next-newest hit,
  # test-only in `fsutil.rs`, still under the 1.83.0 ceiling); `ErrorKind::FilesystemLoop` is
  # deliberately NOT used anywhere in this tree (see the doc comments in `links.rs`/`split_join.rs`)
  # because it is *still* unstable even in the newest available stable rustc, so it does not enter
  # into this floor at all.
  #
  # But 1.83.0 turned out to be fiction too, on the FIRST real run of this job: it isn't our code that
  # raises the floor past that point, it's the dependency graph. `cargo check` at 1.83.0 failed on
  # EVERY manifest with `feature edition2024 is required ... not stabilized in this version of Cargo` --
  # transitive deps (`block-buffer`, `getrandom`) ship an `edition = "2024"` manifest, and Cargo can't
  # even PARSE that manifest below the Rust release that stabilised edition 2024. Bisected empirically
  # (installed `1.85.0`, `1.88.0` via `rustup toolchain install` and ran this exact `cargo check --locked
  # --all-targets` loop locally against all 17 manifests at each): 1.85.0 gets past the edition2024 parse
  # error but still fails on `crates/ftp` (and others sharing its dependency graph) with `rustc 1.85.0 is
  # not supported by ... calamine@0.36.1 requires rustc 1.88 / image@0.25.10 requires rustc 1.88.0 /
  # plist@1.10.0 requires rustc 1.88.0 / rcgen@0.14.8 requires rustc 1.88 / suppaftp@10.0.1 requires
  # rustc 1.88.0 / time@0.3.55, time-core@0.1.9, time-macros@0.2.32 require rustc 1.88.0 / zip@8.6.0
  # requires rustc 1.88` -- all read directly from each dependency's own committed `Cargo.toml`
  # (`rust-version = "1.88"`/`"1.88.0"`), not guessed. **1.88.0 compiled every one of the 17 manifests
  # clean** (`cargo +1.88.0 check --locked --all-targets`, one probe run, exit 0 across the board,
  # `src-tauri` included). 1.88.0 is the true floor: it is the highest number any dependency in this
  # tree actually declares, and the empirical probe confirms nothing needs higher.
  #
  # Deliberately NOT a `rust-toolchain.toml`: that would make `rustup` auto-install/switch to this
  # pinned version the moment ANY `cargo` command runs inside a checkout of this repo, including on a
  # shared local dev machine -- exactly the machine-global toolchain change this repo's sprint workers
  # are told never to make locally. Confining the pin to this ephemeral GitHub Actions runner gets the
  # same enforcement with none of that blast radius.
  #
  # ubuntu-latest only (one OS is enough for an API-availability floor -- same reasoning the
  # Typed-bindings drift guard above already uses) and default features only: checking every feature
  # combination's OWN MSRV is out of scope for this ticket (Low priority, Small estimate) and is
  # recorded as a known gap rather than silently treated as covered. Every one of the 17 real Cargo
  # manifests in the tree (`crates/*`, `sidecar/*`, `src-tauri`) gets its own `cargo check`, not just
  # the one that surfaced the problem -- a partial sweep here is this repo's most-repeated defect, one
  # level up.
  msrv:
    name: MSRV (1.88.0) compiles on every manifest
    needs: lockfile-preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.88.0 (the declared floor, not "stable")
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./crates/contract -> target
            ./crates/ftp -> target
            ./crates/mdns -> target
            ./crates/net -> target
            ./crates/s3 -> target
            ./crates/security -> target
            ./crates/server -> target
            ./crates/sftp -> target
            ./crates/updater-verify -> target
            ./crates/vfs -> target
            ./crates/webdav -> target
            ./sidecar/agent-board -> target
            ./sidecar/ai-console -> target
            ./sidecar/contract -> target
            ./sidecar/host -> target
            ./sidecar/repos -> target
            ./src-tauri -> target

      # This job's first real run (PR #1027) reported `sidecar/host` and `src-tauri` as MSRV failures
      # when they were nothing of the sort -- `libdbus-sys`/`glib-sys` build scripts failed on a
      # missing SYSTEM library (`dbus-1`, `glib-2.0` via pkg-config), not a Rust API/toolchain gap. The
      # `Backend (ubuntu-latest)` and `Sidecar platform (ubuntu-latest)` jobs already install exactly
      # these packages before their own `cargo check`/`clippy` — this job runs the same `cargo check`
      # against the same manifests on the same OS, so it needs the same system deps, or it reports a
      # false MSRV red for an unrelated environment gap. Union of both jobs' package lists, same
      # ForceIPv4/retry/timeout hardening (CPE-1772/1787) for the same GitHub-hosted-runner IPv6-stall
      # risk on `apt-get update`.
      # CPE-1916: this job's SECOND false red, same root shape as the first (above) -- an unrelated
      # environment gap read as a real failure. PR #1035's `apt-get update` here failed after 20s with
      # `403 Forbidden` on `packages.microsoft.com/repos/azure-cli/...` and
      # `packages.microsoft.com/ubuntu/24.04/prod/...` -- the azure-cli and .NET/Microsoft-prod apt
      # sources `ubuntu-latest` preinstalls. This project installs NOTHING from either (confirmed: no
      # `az`/`azure-cli`/`dotnet`/`microsoft` package anywhere in this workflow or any other), so a
      # transient outage on a feed we never touch failed a job whose purpose is "does Rust compile" --
      # not a regression of CPE-1787's hardening, that hardening is *why* this failed loudly and fast
      # (20s) instead of hanging, exactly as intended; the remaining gap this ticket closes is that it
      # should not have failed AT ALL for a source we don't need.
      #   `apt-get update` treats every configured source as required and hard-fails if ANY one 403s/
      #   times out/etc, even though `install` below only ever asks for packages from Ubuntu's own
      #   archives (already covered by the ForceIPv4/retry/timeout hardening above -- unaffected by
      #   this). Removing the two unused lists before `update` (a common, well-understood one-liner on
      #   GitHub-hosted runners) is preferred here over either alternative AC listed: scoping `update`
      #   to specific sources has no stable `apt-get` flag for it, and "tolerate any per-source
      #   failure" would also swallow a REAL failure on a source we do care about, which is the thing
      #   CPE-1787 explicitly traded silence away from. `rm -f` is a no-op if a future runner image
      #   ever renames/drops one or both files, rather than a new failure mode of its own.
      # Sources this runner ships preinstalled that matter here: Ubuntu's own `archive.ubuntu.com`/
      # `security.ubuntu.com` (needed, left alone) and the two removed below (not needed, ever).
      - name: Install Linux system dependencies (src-tauri's WebKitGTK + sidecar/host's D-Bus keyring)
        timeout-minutes: 8
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      # src-tauri's `build.rs` (tauri_build) needs the frontend `dist/` to exist at compile time --
      # same reason the `backend` job builds it first, above.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Build frontend (needed by src-tauri's build script)
        run: |
          npm ci
          npm run build

      # Every manifest that declares `rust-version` in this tree, checked with the exact toolchain
      # that number promises. `cargo check --all-targets` (not `build`) is enough to catch an
      # MSRV-violating API in library OR test code, and a dependency whose OWN floor is newer than
      # 1.88.0 surfaces here the same way -- both are a compile error at this exact toolchain.
      - name: cargo check every manifest at the declared floor
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for dir in \
            crates/contract crates/ftp crates/mdns crates/net crates/s3 crates/security \
            crates/server crates/sftp crates/updater-verify crates/vfs crates/webdav \
            sidecar/agent-board sidecar/ai-console sidecar/contract sidecar/host sidecar/repos \
            src-tauri \
          ; do
            echo "::group::cargo check --locked --all-targets -- $dir"
            if ! (cd "$dir" && cargo check --locked --all-targets); then
              echo "::error::$dir does not compile at the declared MSRV (rustc 1.88.0) -- either the code needs an API newer than that, or a dependency's own MSRV is newer than 1.88.0. Fix the code/dependency, or raise rust-version in $dir/Cargo.toml (and every other manifest in the tree, to keep one honest floor) and record why."
              fail=1
            fi
            echo "::endgroup::"
          done
          exit $fail
