name: CI

# Fast checks on every push and PR to main: type-check + test the frontend, and
# compile + lint + test the Rust backend. The full cross-platform bundle runs
# separately in release.yml on version tags.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CPE-1266: a newer push/PR to a ref cancels that ref's superseded in-flight CI run, so rapid
# back-to-back pushes don't pile up dozens of full matrix runs and clog the account's concurrency.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — type-check and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (svelte-check + tsc)
        run: npm run check

      - name: Unit tests
        run: npm test

  backend:
    # Compile on every OS we actually SHIP. Linux alone never compiles
    # `#[cfg(windows)]` code or Windows-only deps (the registry crate), and
    # neither Linux nor Windows catches macOS-only breakage — yet release.yml
    # builds a macOS bundle. Anything not compiled here only fails after a tag
    # is pushed. See CPE-028 (Windows) and CPE-042 (macOS).
    name: Backend (${{ matrix.os }}) — cargo check, clippy, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # tauri_build needs the frontend dist/ to exist at compile time.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Build frontend (needed by tauri build script)
        run: |
          npm ci
          npm run build

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      # The default build above is the delete-test: the explorer compiles with ZERO
      # sidecar code. This proves the opt-in integration also compiles (CPE-272).
      - name: cargo check (sidecar-platform feature)
        working-directory: src-tauri
        run: cargo clippy --all-targets --features sidecar-platform -- -D warnings

      # Typed-bindings drift guard (CPE-813, epic CPE-810): regenerate the superset typed client and fail
      # if the committed `src/lib/bindings.gen.ts` differs — so the Rust contract and the TS bindings can
      # never silently drift. Linux only (one OS is enough; webkit deps are installed above so the plain
      # export bin links + runs). Regenerate locally with the same command if this fails.
      - name: Typed-bindings drift guard
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: |
          cargo run --bin export_bindings --features "specta-bindings sidecar-platform"
          git diff --exit-code ../src/lib/bindings.gen.ts \
            || (echo "::error::bindings.gen.ts is stale — run: cargo run --bin export_bindings --features \"specta-bindings sidecar-platform\"" && exit 1)

  crates:
    # The GUI↔Server "server-side" crates under crates/ (the Decoupled Server epic CPE-810):
    # cpe-contract (the wire contract, CPE-811), cpe-security (the pluggable security core,
    # CPE-816), cpe-server (the Tauri-free domain logic + dispatcher, CPE-815/824), and cpe-net
    # (the headless network transport loop — Client(Rust) proxy + reference Server, CPE-825).
    # Standalone and Tauri-free — deliberately NOT in the app's cargo workspace, so the
    # `backend` job above doesn't cover them (`src-tauri` path-depends on cpe-server, mirroring
    # `sidecar/contract`). Pure Rust, but we lint+test on every shipped OS to match the rest of
    # the Rust matrix.
    name: Server crates (${{ matrix.os }}) — clippy + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # `getfattr` (package `attr`) is required by the server crate's native-metadata OS-interop test
      # (CPE-1049, tests/native_meta_os_interop.rs) to read an xattr back through the OS's own tool,
      # independent of native_meta::read. Without it the Linux leg would silently skip (ErrorKind::NotFound)
      # instead of genuinely asserting OS interop — install it so the assertion always runs on Linux.
      - name: Install attr (getfattr) for xattr interop test
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y attr

      # Native deps for the PDF (`pdf-thumb`, CPE-1256) + video (`video-thumb`, CPE-1257) thumbnail
      # extractors' real-render tests (ship-enablement CPE-1258, epic CPE-718). Both extractors already
      # SKIP (not fail) their real-render test when the native dep isn't resolvable
      # (crates/server/src/thumb_pdf.rs / thumb_video.rs), so a hiccup in either install degrades to a
      # skipped assertion rather than a red CI run — but installing them here on all three OSes means the
      # real assertions actually run instead of skipping. CI-only installs: ffmpeg's package-manager
      # build's exact license/feature-set doesn't matter here (never distributed) — the shipped binary is
      # a separately pinned LGPL build provisioned in release-sidecar.yml.
      # All native-dep installs below are BEST-EFFORT (continue-on-error) on purpose: the PDF/video
      # real-render tests SKIP (not fail) when their dep is unresolvable (crates/server/src/thumb_pdf.rs
      # / thumb_video.rs), so a flaky third-party download must never red the pipeline (CPE-1268). When
      # the install succeeds the real assertions run; when it hiccups they degrade to a skip.
      - name: Install ffmpeg (video-thumb real-render test, Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install ffmpeg (video-thumb real-render test, macOS)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        run: command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Install ffmpeg (video-thumb real-render test, Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress

      # pdfium prebuilt (BSD-3-Clause, bblanchon/pdfium-binaries) staged where
      # `Pdfium::bind_to_system_library()` resolves it via the OS's normal dynamic-library search path
      # (LD_LIBRARY_PATH / DYLD_LIBRARY_PATH / PATH) — CI-only use, same pinned release the shipped
      # binary's pdfium is provisioned from in release-sidecar.yml.
      # curl uses --fail (a bad HTTP status is an error, not a silently-saved error page) + --retry so a
      # transient network blip retries instead of leaving a truncated/empty archive for tar to choke on.
      - name: Install pdfium prebuilt (pdf-thumb real-render test, Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        shell: bash
        env:
          PDFIUM_TAG: "chromium/7961"
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 -sS -o "$RUNNER_TEMP/pdfium.tgz" "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz"
          tar xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium" lib/libpdfium.so
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/pdfium/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install pdfium prebuilt (pdf-thumb real-render test, macOS)
        if: matrix.os == 'macos-latest'
        continue-on-error: true
        shell: bash
        env:
          PDFIUM_TAG: "chromium/7961"
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 -sS -o "$RUNNER_TEMP/pdfium.tgz" "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-mac-arm64.tgz"
          tar xzf "$RUNNER_TEMP/pdfium.tgz" -C "$RUNNER_TEMP/pdfium" lib/libpdfium.dylib
          echo "DYLD_LIBRARY_PATH=$RUNNER_TEMP/pdfium/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      # Windows: $RUNNER_TEMP is a drive-letter path (D:\a\_temp\…). GNU tar reads a path whose second
      # char is a colon as a `host:path` REMOTE archive and tries to "connect to D:" (the observed
      # `tar (child): Cannot connect to D: resolve failed` — CPE-1268). --force-local makes tar treat
      # the `-f` archive path as a plain local file. The extract dir is passed to `cd` first (POSIX
      # form) so its drive letter never reaches tar's remote-detection at all.
      - name: Install pdfium prebuilt (pdf-thumb real-render test, Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        shell: bash
        env:
          PDFIUM_TAG: "chromium/7961"
        run: |
          dest="$(cygpath -u "$RUNNER_TEMP")/pdfium"
          mkdir -p "$dest"
          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 -sS -o "$dest/pdfium.tgz" "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-win-x64.tgz"
          tar --force-local -xzf "$dest/pdfium.tgz" -C "$dest" bin/pdfium.dll
          echo "$(cygpath -w "$dest/bin")" >> "$GITHUB_PATH"

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./crates/contract -> target
            ./crates/security -> target
            ./crates/server -> target
            ./crates/net -> target
            ./crates/sftp -> target
            ./crates/webdav -> target
            ./crates/ftp -> target
            ./crates/vfs -> target
            ./crates/updater-verify -> target

      - name: contract — clippy + test
        working-directory: crates/contract
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: security — clippy + test
        working-directory: crates/security
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
          # The opt-in JWT verifier (CPE-965) — lint + test it too; default build above stays crypto-free.
          cargo clippy --all-targets --features jwt -- -D warnings
          cargo test --features jwt

      - name: server — clippy + test
        working-directory: crates/server
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
          # The opt-in instant-search index engine (CPE-832) — lint + test it too; the default build
          # above stays indexer-free (the "small when off" delete-test).
          cargo clippy --all-targets --features index -- -D warnings
          cargo test --features index
          # The opt-in PDF (pdfium-render, CPE-1256) + video (bundled-ffmpeg shell-out, CPE-1257)
          # thumbnail extractors, shipped for real by CPE-1258, the opt-in DICOM medical-image reader
          # (dicom-object/dicom-pixeldata, CPE-1345), and the opt-in audio-waveform peak extractor
          # (same bundled-ffmpeg shell-out, CPE-1478) — lint + test all four together; the default
          # build above stays extractor-free (the "small when off" delete-test). The native deps
          # installed above let the real-render tests actually assert instead of skipping.
          cargo clippy --all-targets --features pdf-thumb,video-thumb,waveform,dicom-thumb -- -D warnings
          cargo test --features pdf-thumb,video-thumb,waveform,dicom-thumb

      - name: net — clippy + test
        # The headless network transport loop (Client(Rust) proxy + reference Server,
        # CPE-825): composes contract + server + security into a loopback client/server.
        working-directory: crates/net
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: sftp — clippy + test
        # The SFTP FileSystemProvider (CPE-616): russh + host-key verification via
        # cpe-server::known_hosts. Uses the `ring` crypto backend (self-contained — no NASM/cmake),
        # and an in-process russh-sftp test server, so it runs on all three OSes with no Docker.
        working-directory: crates/sftp
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: webdav — clippy + test
        # The WebDAV FileSystemProvider (CPE-616): a 2nd remote backend over HTTP/WebDAV. Sync (ureq +
        # rustls/ring — pure Rust, no C tooling), tested against an in-process tiny_http server, so it runs
        # on all three OSes with no Docker.
        working-directory: crates/webdav
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: ftp — clippy + test
        # The FTP/FTPS FileSystemProvider (CPE-1514, epic CPE-1502): the 3rd remote backend, and the
        # first net-new Network protocol since SFTP/WebDAV. Sync (suppaftp + rustls/ring — pure Rust, no
        # C tooling), tested against an in-process hand-rolled FTP server, so it runs on all three OSes
        # with no Docker/real FTP daemon.
        working-directory: crates/ftp
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: vfs — clippy + test
        # The scheme router (CPE-616/CPE-1502): open(connection, secret, …) -> boxed FileSystemProvider,
        # dispatching to cpe-sftp / cpe-webdav / cpe-ftp. Ties the connections model to the concrete
        # remote providers.
        working-directory: crates/vfs
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: updater-verify — clippy + test
        # The headless updater-manifest + minisign signature guard (CPE-1058): parses tauri-action's
        # latest.json, checks shape + version, and verifies each platform's minisign signature against the
        # configured pubkey — retiring the CI-automatable part of manual-test burndown #6 (auto-update flow).
        # Standalone + NOT a dependency of src-tauri (the shipped app keeps using tauri_plugin_updater); the
        # one crypto dep (minisign) is confined here. The 3-OS matrix is the slice-A pin for the hermetic
        # tests (valid / tampered / wrong-key / version-mismatch / malformed).
        working-directory: crates/updater-verify
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

  net-e2e:
    # CPE-1659 (epic CPE-1498), retiring MANUAL-TEST-BURNDOWN rows #7 and #13: every remote provider
    # this app ships (crates/sftp, crates/webdav, crates/ftp) is otherwise tested ONLY against an
    # in-process fake server written by the same author as the client — the `sftp`/`webdav`/`ftp` steps
    # above say so explicitly. This job is the interop layer above them: real third-party server images
    # (OpenSSH `sftp-server` via atmoz/sftp, Apache mod_dav via bytemark/webdav, vsftpd via
    # fauria/vsftpd — vsftpd/OpenSSH are literally what QNAP QTS runs) on a Docker bridge network,
    # driven by `crates/vfs/tests/real_server_conformance.rs` through the real `cpe_vfs::open` routing
    # seam. Slice 2 (`crates/net/tests/real_server_e2e.rs`) containerises the existing
    # `cpe-server-ref` reference Server on the SAME bridge network and drives it from this job's own
    # (non-127.0.0.1) address, retiring the "real non-loopback client<->server run" gap.
    #
    # Linux + Docker only (ubuntu-latest is the only leg in this repo's matrix with Docker) — this
    # tests protocol INTEROP, not OS behaviour, so one OS is the right scope; deliberately a separate
    # job from `crates` above so Docker is never added to the 3-OS matrix.
    #
    # BLOCKING — never `continue-on-error`. Making this job non-blocking (or deleting it) later is a
    # burndown regression under the QA charter's rule 2; see .claude/qa-architecture/README.md.
    name: Network E2E (ubuntu-latest, real servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./crates/vfs -> target
            ./crates/net -> target

      - name: Create the Docker bridge network (static subnet, CPE-1659)
        # A fixed subnet lets every service get a STABLE, predictable IP via `--ip` — needed so the
        # SFTP host-key TOFU steps below can recreate the sftp-e2e container (with a fresh host key)
        # while its address stays the same, which is the whole point of that assertion. It also gives
        # slice 2 (`cpe-server-ref`) a genuinely non-127.0.0.1, different-network-namespace address for
        # free — the actual thing burndown row #7 asks for.
        run: docker network create --subnet=172.28.0.0/24 "net-e2e-${{ github.run_id }}"

      - name: Seed the hostile fixture tree (CPE-1659)
        # Deliberately hostile, not tidy: nested dirs, a 0-byte file, a 5 MiB binary of random bytes, a
        # name with a space, one with `#`/`%` (the classic WebDAV href-encoding bug), one with
        # non-ASCII/emoji, and a file whose bytes mix CRLF and lone LF (the classic FTP ASCII-mode
        # corruption trap). Each provider gets its OWN copy so mutating one scheme's copy during its
        # test run can never leak into another scheme's `list` assertions.
        shell: bash
        run: |
          set -euo pipefail
          seed() {
            local dir="$1"
            mkdir -p "$dir/sub/dir"
            : > "$dir/empty.bin"
            head -c 5242880 /dev/urandom > "$dir/big.bin"
            printf 'nested fixture file\n' > "$dir/sub/dir/nested.txt"
            printf 'space file body\n' > "$dir/name with space.txt"
            printf 'weird name body\n' > "$dir/weird#name%.txt"
            printf 'emoji name body\n' > "$dir/emoji-😀-name.txt"
            printf 'line1\r\nline2\nline3\r\n' > "$dir/mixed-eol.txt"
            chmod -R 0777 "$dir"
          }
          seed "$RUNNER_TEMP/fixture-sftp"
          seed "$RUNNER_TEMP/fixture-webdav"
          seed "$RUNNER_TEMP/fixture-ftp"
          mkdir -p "$RUNNER_TEMP/fixture-net"
          printf 'alpha\n' > "$RUNNER_TEMP/fixture-net/alpha.txt"
          printf 'beta\n' > "$RUNNER_TEMP/fixture-net/beta.txt"
          chmod -R 0777 "$RUNNER_TEMP/fixture-net"
          {
            echo "CPE_E2E_SFTP_FIXTURE_DIR=$RUNNER_TEMP/fixture-sftp"
            echo "CPE_E2E_WEBDAV_FIXTURE_DIR=$RUNNER_TEMP/fixture-webdav"
            echo "CPE_E2E_FTP_FIXTURE_DIR=$RUNNER_TEMP/fixture-ftp"
            echo "CPE_E2E_NET_FIXTURE_DIR=$RUNNER_TEMP/fixture-net"
            echo "CPE_E2E_SFTP_KNOWN_HOSTS_STORE=$RUNNER_TEMP/sftp-known-hosts"
          } >> "$GITHUB_ENV"

      # Images pinned by BOTH tag (human-readable) AND digest (immutable) — `name:tag@sha256:digest` —
      # so a silent upstream retag can never change what "real server" means underneath this job without
      # a deliberate, reviewed commit updating the digest here. Digests below are what a real
      # `docker pull` on this job resolved (confirmed on a live CI run before being hardened into a pin);
      # bumping the tag AND re-confirming the resolved digest is the deliberate way to move these
      # forward.
      - name: Pull every real server image by its pinned digest (CPE-1659)
        run: |
          docker pull atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475
          docker pull bytemark/webdav:latest@sha256:21eed0df1238d17766080425f9ef46da2c1130e3e3aa9eaf36794d2a72e7c616
          docker pull fauria/vsftpd:latest@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177

      - name: Start real SFTP server (OpenSSH sftp-server, atmoz/sftp)
        run: |
          docker run -d --name sftp-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.11 \
            -v "$CPE_E2E_SFTP_FIXTURE_DIR:/home/tester/upload" \
            atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475 \
            "tester:testpass:1001:1001:upload"
          {
            echo "CPE_E2E_SFTP_HOST=172.28.0.11"
            echo "CPE_E2E_SFTP_USER=tester"
            echo "CPE_E2E_SFTP_PASS=testpass"
            echo "CPE_E2E_SFTP_ROOT=/upload"
          } >> "$GITHUB_ENV"

      - name: Start real WebDAV server (Apache mod_dav, bytemark/webdav)
        run: |
          docker run -d --name webdav-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.12 \
            -v "$CPE_E2E_WEBDAV_FIXTURE_DIR:/var/lib/dav/data" \
            -e AUTH_TYPE=Basic -e USERNAME=tester -e PASSWORD=testpass \
            bytemark/webdav:latest@sha256:21eed0df1238d17766080425f9ef46da2c1130e3e3aa9eaf36794d2a72e7c616
          {
            echo "CPE_E2E_WEBDAV_HOST=172.28.0.12"
            echo "CPE_E2E_WEBDAV_USER=tester"
            echo "CPE_E2E_WEBDAV_PASS=testpass"
            echo "CPE_E2E_WEBDAV_ROOT=/"
          } >> "$GITHUB_ENV"

      # fauria/vsftpd ships with NO `ssl_enable` directive at all (plain FTP only) — FTPS needs it
      # explicitly turned on, plus a real certificate. A public CA fundamentally cannot issue one for a
      # private, ephemeral Docker IP, so this generates a throwaway self-signed cert (with an IP SAN,
      # since certificate verifiers ignore the CN) and a full replacement vsftpd.conf (the image's
      # entrypoint only ever APPENDS its own PASV/logging directives to whatever's already at this path,
      # so pre-seeding it via bind mount is safe). `CPE_E2E_FTPS_EXTRA_CA_PEM_FILE` is the CI/test-only
      # trust-anchor env var `crates/ftp` reads (see `extra_test_root` in its source) — a no-op for every
      # real app run, only ever set here.
      - name: Generate a throwaway FTPS certificate + vsftpd.conf (CPE-1659)
        shell: bash
        run: |
          set -euo pipefail
          ssl_dir="$RUNNER_TEMP/vsftpd-ssl"
          mkdir -p "$ssl_dir"
          openssl req -x509 -newkey rsa:2048 -keyout "$ssl_dir/vsftpd.key" -out "$ssl_dir/vsftpd.pem" \
            -days 2 -nodes -subj "/CN=172.28.0.13" -addext "subjectAltName=IP:172.28.0.13"
          chmod 0755 "$ssl_dir"
          chmod 0644 "$ssl_dir/vsftpd.key" "$ssl_dir/vsftpd.pem"
          conf="$RUNNER_TEMP/vsftpd.conf"
          : > "$conf"
          echo 'background=NO' >> "$conf"
          echo 'anonymous_enable=NO' >> "$conf"
          echo 'local_enable=YES' >> "$conf"
          echo 'guest_enable=YES' >> "$conf"
          echo 'virtual_use_local_privs=YES' >> "$conf"
          echo 'write_enable=YES' >> "$conf"
          echo 'pam_service_name=vsftpd_virtual' >> "$conf"
          echo 'user_sub_token=$USER' >> "$conf"
          echo 'local_root=/home/vsftpd/$USER' >> "$conf"
          echo 'chroot_local_user=YES' >> "$conf"
          echo 'allow_writeable_chroot=YES' >> "$conf"
          echo 'hide_ids=YES' >> "$conf"
          echo 'xferlog_enable=YES' >> "$conf"
          echo 'xferlog_file=/var/log/vsftpd/vsftpd.log' >> "$conf"
          echo 'port_enable=YES' >> "$conf"
          echo 'connect_from_port_20=YES' >> "$conf"
          echo 'ftp_data_port=20' >> "$conf"
          echo 'seccomp_sandbox=NO' >> "$conf"
          echo 'ssl_enable=YES' >> "$conf"
          echo 'rsa_cert_file=/etc/vsftpd/ssl/vsftpd.pem' >> "$conf"
          echo 'rsa_private_key_file=/etc/vsftpd/ssl/vsftpd.key' >> "$conf"
          echo 'allow_anon_ssl=NO' >> "$conf"
          echo 'force_local_data_ssl=NO' >> "$conf"
          echo 'force_local_logins_ssl=NO' >> "$conf"
          echo 'require_ssl_reuse=NO' >> "$conf"
          # CPE-1659: vsftpd's OWN default `ssl_ciphers` is the legacy `DES-CBC3-SHA` (confirmed against
          # the vsftpd.conf(5) man page) — some distro builds extend it slightly, but never with a modern
          # AEAD suite. `cpe-ftp`'s rustls-ring client only ever offers ECDHE+AES-GCM/ChaCha20 (TLS 1.2)
          # and TLS 1.3 suites, so against the real vsftpd default the two sides share zero overlap and
          # the handshake fails with a bare "HandshakeFailure" alert (confirmed on this rig's first run
          # to get this far: FTP/SFTP/WebDAV all passed, only FTPS failed on this). `HIGH` is OpenSSL's
          # own cipher-string alias for its strong-cipher set, which includes the ECDHE-RSA-AES*-GCM
          # suites rustls needs.
          echo 'ssl_ciphers=HIGH' >> "$conf"
          # CPE-1659: deliberately NOT setting ssl_tlsv1/ssl_sslv2/ssl_sslv3 here — an earlier guess (never
          # confirmed against a real error) blamed legacy-TLS config rejection for vsftpd's fast exit.
          # Leaving these three directives out lets vsftpd negotiate its own modern default TLS range;
          # `ssl_enable=YES` above is what actually turns FTPS on.
          #
          # CPE-1659 CONFIRMED root cause (via the foreground diagnostic replay below): vsftpd refuses to
          # load a config file it doesn't own — "500 OOPS: config file not owned by correct user, or not a
          # file". vsftpd.conf is generated here by the unprivileged `runner` user, then bind-mounted into
          # the container where vsftpd runs as root (uid 0); bind mounts don't remap ownership, so the
          # file stayed owned by the runner's uid and the root-owned check failed on every single run —
          # this was the real, reproducible cause of the "never accepted a TCP connection" failures, not
          # the TLS version. `sudo chown root:root` here is what actually fixes it.
          sudo chown root:root "$conf"
          sudo chown -R root:root "$ssl_dir"
          {
            echo "CPE_E2E_FTP_SSL_DIR=$ssl_dir"
            echo "CPE_E2E_FTP_CONF=$conf"
            echo "CPE_E2E_FTPS_EXTRA_CA_PEM_FILE=$ssl_dir/vsftpd.pem"
          } >> "$GITHUB_ENV"

      - name: Start real FTP server (vsftpd, fauria/vsftpd)
        run: |
          docker run -d --name ftp-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.13 \
            -v "$CPE_E2E_FTP_FIXTURE_DIR:/home/vsftpd/tester" \
            -v "$CPE_E2E_FTP_CONF:/etc/vsftpd/vsftpd.conf" \
            -v "$CPE_E2E_FTP_SSL_DIR:/etc/vsftpd/ssl" \
            -e FTP_USER=tester -e FTP_PASS=testpass -e LOCAL_UMASK=022 -e LOG_STDOUT=YES \
            -e PASV_ADDRESS=172.28.0.13 -e PASV_MIN_PORT=21100 -e PASV_MAX_PORT=21110 \
            fauria/vsftpd:latest@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177
          {
            echo "CPE_E2E_FTP_HOST=172.28.0.13"
            echo "CPE_E2E_FTP_USER=tester"
            echo "CPE_E2E_FTP_PASS=testpass"
            echo "CPE_E2E_FTP_ROOT=/"
          } >> "$GITHUB_ENV"

      # CPE-1659: the first live run of this rig had ftp-e2e exit 147ms after `docker run -d` with
      # exitCode=2 and NOTHING in `docker logs`, even with LOG_STDOUT=YES — the image's own
      # `run-vsftpd.sh` hardcodes `&>/dev/null /usr/sbin/vsftpd …` on its final line (confirmed against
      # fauria/docker-vsftpd's run-vsftpd.sh), and LOG_STDOUT only controls the xferlog symlink, never
      # that redirect. So a real startup failure here is invisible by construction, and the "wait for
      # connections" step below would otherwise just time out with no reason why. This step notices an
      # immediate exit and replays the SAME script with that one redirect stripped, in the foreground, so
      # vsftpd's actual stderr reaches this job's log instead of another guess.
      - name: Verify the FTP container actually started; capture vsftpd's real startup error if not (CPE-1659)
        run: |
          sleep 1
          status="$(docker inspect -f '{{.State.Status}}' ftp-e2e)"
          if [ "$status" != "running" ]; then
            exitCode="$(docker inspect -f '{{.State.ExitCode}}' ftp-e2e)"
            echo "::error::ftp-e2e exited immediately (status=$status exitCode=$exitCode) — replaying its startup script with the '&>/dev/null vsftpd' redirect stripped to surface the real reason"
            docker run --rm \
              --network "net-e2e-${{ github.run_id }}" \
              -v "$CPE_E2E_FTP_FIXTURE_DIR:/home/vsftpd/tester" \
              -v "$CPE_E2E_FTP_CONF:/etc/vsftpd/vsftpd.conf" \
              -v "$CPE_E2E_FTP_SSL_DIR:/etc/vsftpd/ssl" \
              -e FTP_USER=tester -e FTP_PASS=testpass -e LOCAL_UMASK=022 -e LOG_STDOUT=YES \
              -e PASV_ADDRESS=172.28.0.13 -e PASV_MIN_PORT=21100 -e PASV_MAX_PORT=21110 \
              --entrypoint /bin/bash \
              fauria/vsftpd:latest@sha256:6d71d7c7f1b0ab2844ec7dc7999a30aef6d758b6d8179cf5967513f87c79c177 \
              -c "sed -i 's#&>/dev/null##' /usr/sbin/run-vsftpd.sh; /usr/sbin/run-vsftpd.sh" || true
            exit 1
          fi
          echo "ftp-e2e is running"

      - name: Wait for the real servers to accept connections
        run: |
          set -euo pipefail
          for hp in 172.28.0.11:22 172.28.0.12:80 172.28.0.13:21; do
            host="${hp%%:*}"; port="${hp##*:}"
            up=""
            for _ in $(seq 1 30); do
              (echo > "/dev/tcp/$host/$port") >/dev/null 2>&1 && { up=1; echo "$hp is up"; break; }
              sleep 1
            done
            if [ -z "$up" ]; then
              echo "::error::$hp never accepted a TCP connection within 30s"
              exit 1
            fi
          done

      - name: Build the real cpe-server-ref binary (release, Slice 2 CPE-1659)
        working-directory: crates/net
        run: cargo build --release --bin cpe-server-ref

      - name: Containerise + start the real cpe-server-ref (Slice 2 CPE-1659)
        run: |
          docker build -t cpe-server-ref-e2e -f crates/net/Dockerfile.e2e crates/net
          docker run -d --name net-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.14 \
            -v "$CPE_E2E_NET_FIXTURE_DIR:/data" \
            cpe-server-ref-e2e
          {
            echo "CPE_E2E_NET_ADDR=172.28.0.14:9876"
            echo "CPE_E2E_NET_CONTAINER_DIR=/data"
          } >> "$GITHUB_ENV"

      - name: "crates/vfs — SFTP host-key TOFU, part 1: first contact then trusts (real OpenSSH)"
        working-directory: crates/vfs
        run: cargo test --test real_server_conformance sftp_host_key_tofu_first_contact_then_trusts_against_real_sshd -- --ignored --nocapture

      - name: Recreate the SFTP container with a FRESH host key (CPE-1659 TOFU negative case)
        # Same static IP, no host-key volume mounted — atmoz/sftp generates brand-new ephemeral host
        # keys on a fresh container, so the address the previous step trusted now presents a DIFFERENT
        # key, exactly the "changed key" scenario CPE-1512 must refuse.
        run: |
          docker rm -f sftp-e2e
          docker run -d --name sftp-e2e \
            --network "net-e2e-${{ github.run_id }}" --ip 172.28.0.11 \
            -v "$CPE_E2E_SFTP_FIXTURE_DIR:/home/tester/upload" \
            atmoz/sftp:latest@sha256:0960390462a4441dbb63698d7c185b76a41ffcee7b78ff4adf275f3e66f9c475 \
            "tester:testpass:1001:1001:upload"
          for _ in $(seq 1 30); do
            (echo > "/dev/tcp/172.28.0.11/22") >/dev/null 2>&1 && break
            sleep 1
          done

      - name: "crates/vfs — SFTP host-key TOFU, part 2: a changed key is refused (real OpenSSH)"
        working-directory: crates/vfs
        run: cargo test --test real_server_conformance sftp_host_key_tofu_changed_key_is_refused_against_real_sshd -- --ignored --nocapture

      - name: crates/vfs — full conformance suite (sftp / webdav / ftp / ftps) against real servers
        working-directory: crates/vfs
        run: cargo test --test real_server_conformance -- --ignored --nocapture --test-threads=1 --skip sftp_host_key_tofu

      - name: "crates/net — Slice 2: real client<->server E2E over a non-loopback container IP"
        working-directory: crates/net
        run: cargo test --test real_server_e2e -- --ignored --nocapture

      - name: Dump real-server container logs (debug aid on failure)
        if: failure()
        run: |
          for c in sftp-e2e webdav-e2e ftp-e2e net-e2e; do
            echo "=== $c state ==="
            docker inspect "$c" --format 'status={{.State.Status}} exitCode={{.State.ExitCode}} startedAt={{.State.StartedAt}} finishedAt={{.State.FinishedAt}} oomKilled={{.State.OOMKilled}} error={{.State.Error}}' || true
            echo "=== $c logs ==="
            docker logs "$c" 2>&1 | tail -n 200 || true
          done

      - name: Tear down containers + network (CPE-1659)
        if: always()
        run: |
          docker rm -f sftp-e2e webdav-e2e ftp-e2e net-e2e >/dev/null 2>&1 || true
          docker network rm "net-e2e-${{ github.run_id }}" >/dev/null 2>&1 || true

  sidecar:
    # The sidecar platform crates (sidecar/contract, sidecar/host) are standalone —
    # deliberately NOT part of the app's cargo workspace, so the `backend` job above
    # doesn't cover them. Build, lint, and test them on every OS we ship, so
    # `#[cfg(windows)]` code (the keychain backend) and the real-process E2E tests are
    # validated cross-platform (CPE-302; first half of the CPE-272 delete-test guard —
    # the app CI here never references the sidecar crates, proving the one-way boundary).
    name: Sidecar platform (${{ matrix.os }}) — clippy + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # One-way dependency guard (ADR 0001 / CPE-272): a sidecar crate must NEVER
      # depend on the explorer app. Fail if any sidecar Cargo.toml references it.
      - name: Enforce one-way dependency
        shell: bash
        run: |
          if grep -rE '^(app_lib|cross-platform-explorer)\b|path = "\.\./\.\./src-tauri' sidecar/*/Cargo.toml; then
            echo "::error::a sidecar crate depends on the explorer app — that breaks the one-way boundary"
            exit 1
          fi
          echo "one-way dependency holds"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The Linux Secret Service keyring backend (CPE-322) links libdbus.
      - name: Install Linux system dependencies (libdbus for the keyring)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./sidecar/contract -> target
            ./sidecar/host -> target
            ./sidecar/ai-console -> target
            ./sidecar/repos -> target
            ./sidecar/agent-board -> target

      - name: contract — clippy + test
        working-directory: sidecar/contract
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: host — clippy + test
        working-directory: sidecar/host
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      # CPE-322: verify a REAL OS-keychain round-trip on each runner (Windows Credential Manager /
      # macOS Keychain / Linux Secret Service) — the hardware verification the ticket needs, run on
      # GitHub's macOS + Linux hosts. The test is `#[ignore]`d so the normal run never touches the
      # keychain; here we run it explicitly. Linux needs an unlocked gnome-keyring in a D-Bus session.
      # Best-effort (continue-on-error): a CI keychain quirk must never red the pipeline — a green run
      # is the signal.
      - name: host — real keychain round-trip (CPE-322)
        working-directory: sidecar/host
        continue-on-error: true
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y gnome-keyring
            dbus-run-session -- bash -c '
              eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
              cargo test --test keyring_roundtrip -- --ignored --nocapture
            '
          else
            cargo test --test keyring_roundtrip -- --ignored --nocapture
          fi

      - name: ai-console — clippy + test
        working-directory: sidecar/ai-console
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: repos — clippy + test
        working-directory: sidecar/repos
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: agent-board — clippy + test
        # The Agent Board sidecar (CPE-851, epic CPE-850): out-of-process Kanban over Ticketing/.
        working-directory: sidecar/agent-board
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test
