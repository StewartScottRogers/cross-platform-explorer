name: Release

# Build signed installers for every OS and publish a GitHub Release
# (plus the updater's latest.json) whenever you push a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# CPE-1894: the tag filter below used to be a bare `"v*"`, which matches `v0.57.69-sidecar` exactly
# as happily as `v0.57.69` -- so pushing (or, as here, `gh release create`/tauri-action creating) a
# `-sidecar` tag ALSO fired this, the plain-build workflow, which then merged its plain installers
# into the SAME draft release `release-sidecar.yml` was populating: one manifest naming assets from
# two different products (identifiers `com.example.crossplatformexplorer` vs
# `....crossplatformexplorer.sidecar`). Confirmed live: v0.57.69's published latest.json had
# `linux-x86_64`/`darwin-aarch64` pointing at `...Sidecar...` assets and
# `windows-x86_64`/`darwin-x86_64` pointing at plain `Cross-Platform.Explorer_...` assets.
#
# Fix: exclude any tag ending `-sidecar` from THIS workflow's trigger, using GitHub Actions'
# documented include+negate-within-one-list form (`tags: [pattern, "!pattern"]`) -- NOT the separate
# `tags`/`tags-ignore` keys, which GitHub explicitly forbids combining for the same event. This is
# deliberately an EXCLUDE on the plain side rather than a narrower positive pattern on either side
# (e.g. requiring plain tags to look like `v[0-9]*.[0-9]*.[0-9]*` with no suffix at all): a narrower
# positive pattern would silently stop firing on ANY future suffixed plain tag (e.g. a `-rc1` or
# `-beta` convention nobody has invented yet), whereas `!v*-sidecar` names exactly the one suffix
# that must never reach this workflow and leaves every other `v*` tag working as before.
#
# `release-sidecar.yml` needs no matching change: it is `workflow_dispatch`-only and has never
# listened on `push` at all (see the header comment over there) -- the only overreach was ever this
# workflow reaching into the sidecar channel's tags, never the other way around. So this one change
# makes the two channels' tag triggers disjoint: a `-sidecar` tag now runs no `push`-triggered
# workflow at all (only the manual sidecar dispatch that creates it in the first place), and a plain
# `vX.Y.Z` tag runs only this one.
on:
  push:
    tags:
      - "v*"
      - "!v*-sidecar"

# Needed so the workflow can create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    # CPE-1967 — every job in this file now carries a cap; none did before, so a wedged release build
    # rode to the 360-minute Actions default. That is worse here than in `ci.yml`: nobody watches a
    # release build the way someone waits on a PR, so the first symptom is a draft release with no
    # installer assets, hours later. Same sizing rule as `ci.yml` (see that file's `jobs:` header):
    # cap = max(10, ceil_to_5(1.5 x measured max)), measured max = slowest successful run, slowest
    # matrix leg. Sample: the 100 most recent completed `release.yml` runs as of 2026-08-28.
    #   macos-latest (universal)  n=73, min 8.4 / p50 12.2 / p90 14.5 / max 16.3 min
    #   windows-latest            n=75, min 8.9 / p50 12.2 / p90 13.1 / max 13.6 min
    #   ubuntu-22.04              n=73, min 7.5 / p50  9.2 / p90 10.0 / max 12.0 min
    # 1.5 x 16.3 = 24.5 -> 25.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon + Intel via universal target)
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both arches for the universal build.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # CPE-1824: same ForceIPv4/retry/timeout hardening CPE-1787 applied to ci.yml's identical
      # site -- a GitHub-hosted-runner IPv6-connectivity stall can hang `apt-get update` with zero
      # output before it ever falls back to IPv4, and this step has no `continue-on-error`, so an
      # unbounded hang here previously rode all the way to the job's 360-minute default before
      # anyone noticed the release wasn't shipping.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      # --- Windows code signing (CPE-1131 — self-signed) ---
      # Conditional on the WINDOWS_CERT_PFX_BASE64 secret so fork/PR/unconfigured builds still succeed
      # UNSIGNED (mirrors the updater/catalog "skip when the secret is absent" pattern below). When the
      # secret is present on a windows-latest runner, import the .pfx and patch bundle.windows in
      # tauri.conf.json so tauri-action signs the installer. NOTE: a self-signed cert makes the installer
      # Authenticode-signed but does NOT clear SmartScreen for the public — see docs/signing/ + CPE-002.
      - name: Detect Windows signing cert (CPE-1131)
        id: wincert
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ -n "$PFX" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Windows code signing (CPE-1131 — self-signed)
        if: steps.wincert.outputs.has == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cpe-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $sec = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          Remove-Item $pfx -Force
          # Patch bundle.windows in tauri.conf.json (runner-only; never committed) so tauri-action signs.
          # Read AND write through an explicit BOM-less UTF-8 encoder (CPE-1842; same fix and same
          # reasoning as CPE-1834 in scripts/release.ps1). tauri.conf.json is BOM-less UTF-8 and
          # carries non-ASCII (an em dash in plugins.cli.description), so a codec that depends on the
          # host's defaults is a live hazard: bare `Get-Content -Raw` misdecodes it as the system ANSI
          # code page and `Set-Content -Encoding utf8` prepends a BOM on Windows PowerShell 5.1 — the
          # exact shape the repo's mojibake guard exists to catch. pwsh 7 happens to default to
          # BOM-less UTF-8 on both ends, which is why this has survived so far; that is a default, not
          # a guarantee, and it flips the moment this step runs under `shell: powershell`, an older
          # image, or a different locale. Being explicit costs nothing and holds on every host.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $conf = 'src-tauri/tauri.conf.json'
          $confPath = (Resolve-Path $conf).Path
          $j = [System.IO.File]::ReadAllText($confPath, $utf8NoBom) | ConvertFrom-Json
          if ($null -eq $j.bundle.windows) {
            $j.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{}) -Force
          }
          $j.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $j.bundle.windows | Add-Member -NotePropertyName digestAlgorithm      -NotePropertyValue 'sha256' -Force
          $j.bundle.windows | Add-Member -NotePropertyName timestampUrl         -NotePropertyValue 'http://timestamp.digicert.com' -Force
          [System.IO.File]::WriteAllText($confPath, ($j | ConvertTo-Json -Depth 40), $utf8NoBom)
          Write-Host "Windows self-signed signing enabled (thumbprint $($cert.Thumbprint))."

      # CPE-1872 round-2 security-audit finding 3: latest.json has no .gitignore rule and nothing
      # forbids committing one at the repo root. tauri-action writes latest.json to its own cwd
      # (resolve(process.cwd(), 'latest.json') — see the comment on the verify job below) and SKIPS
      # writing one at all when it finds no updater .sig artifacts ("Signature not found for the
      # updater JSON. Skipping upload..."), which today is fail-closed — no manifest, nothing to
      # (falsely) trust. A stray committed latest.json at the repo root would survive actions/checkout
      # and turn that fail-closed behavior into a silent pass over a file nobody just built. Removing
      # any pre-existing copy immediately before tauri-action runs guarantees whatever tauri-action
      # itself writes (or doesn't) is the only thing anything downstream can ever see.
      - name: Remove any stray latest.json before the build writes its own (CPE-1872)
        run: rm -f latest.json

      # CPE-1865: tauri-action drives `tauri build`, which has no flag to pass `--locked` through to
      # the `cargo build` it runs internally -- so this is a real, separate `cargo check --locked`
      # against the SAME `src-tauri/Cargo.lock` the step below is about to build the shipped binary
      # from, run immediately before it. `npm run build` first because `src-tauri`'s `build.rs` needs
      # `dist/` to exist at compile time (same reason CI's `backend` job builds the frontend before its
      # own `cargo check`); tauri-action's own `beforeBuildCommand` will run it again below, which is
      # harmless and idempotent.
      - name: Build frontend (needed for the Cargo.lock preflight check below)
        run: npm run build

      - name: Verify src-tauri/Cargo.lock is current before the real release build (CPE-1865)
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — generate with `npm run tauri signer generate`
          # and store the outputs as repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- OS code signing — see CPE-002 (currently Blocked on certificates) ---
          #
          # Leave these commented until the certificates actually exist. Setting them
          # to empty secrets makes the signing step fail rather than skip, which would
          # break a currently-working release build.
          #
          # macOS (requires Apple Developer Program membership):
          #   APPLE_CERTIFICATE           — base64 of the .p12 Developer ID cert
          #   APPLE_CERTIFICATE_PASSWORD  — password for that .p12
          #   APPLE_SIGNING_IDENTITY      — e.g. "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID / APPLE_PASSWORD   — Apple ID + app-specific password (notarization)
          #   APPLE_TEAM_ID               — 10-char team ID
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows (requires an OV or EV Authenticode certificate):
          #   Windows signing is configured in src-tauri/tauri.conf.json under
          #   bundle.windows (certificateThumbprint + digestAlgorithm + timestampUrl),
          #   with the cert installed on the runner — NOT via env vars here.
          #   EV certs are typically hardware/HSM-bound, which usually means a
          #   cloud-signing service or a self-hosted runner.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cross-Platform Explorer ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Emit the updater manifest consumed by tauri.conf.json endpoints.
          includeUpdaterJson: true

  # CPE-1058, redesigned by CPE-1872's round-2 security audit — verify the PUBLISHED updater manifest,
  # once, after the whole release matrix finishes, instead of each matrix leg checking its own local
  # build output.
  #
  # Why a per-leg check couldn't be trusted (finding 1, HIGH): tauri-action's own upload-version-json.ts
  # downloads the EXISTING latest.json release asset and seeds versionContent.platforms from it before
  # merging in what THIS runner built — so the manifest that actually ships is the UNION of all three
  # matrix legs' platforms, and no single leg's local src-tauri/target ever contains every platform the
  # manifest names. The old per-leg step's "skip verification for any platform I don't have locally, then
  # declare success once at least one signature checked" is exactly the hole a smuggled platform entry
  # (an honest platform plus a bogus one pointing at an attacker-controlled URL, signed by a different
  # key) walked straight through — independently reproduced at EXIT=0 by the security auditor and, again,
  # locally against this repo's own fixtures (see crates/updater-verify/tests/release_guard.rs,
  # smuggled_extra_platform_is_rejected). lib.rs's verify_update_manifest now hard-fails any platform it
  # can't fetch rather than skipping it, which makes a partial, per-leg view of the manifest USELESS for
  # anything but a false negative — so this job checks the real thing instead of a fragment of it.
  #
  # This is option (a) of the two the ticket allowed ("a post-matrix job that downloads the draft's
  # latest.json plus every asset it references and verifies all platforms" vs. "--expect-platforms driven
  # from the matrix leg"). Chosen over (b) because it verifies the actual bytes a real updater will fetch
  # — the manifest AS PUBLISHED, from the release itself — rather than trusting each leg's belief about
  # which platforms the eventual union will contain, which is exactly the belief that was wrong before.
  # It also closes finding 2 (basename collisions in a dirty --search dir) as a side effect: every asset
  # is downloaded fresh into an empty directory, so there is nothing stale for a basename to collide with.
  #
  # CPE-1872 round 3, Finding A (HIGH) — `needs: release` with no job-level `if:` used to mean this job
  # is SKIPPED, not failed, the moment any one matrix leg fails. `release` is `fail-fast: false`, so the
  # surviving legs run to completion and tauri-action has ALREADY uploaded their installers + a merged
  # latest.json to the draft before the failure registers — net effect, on a partial matrix failure the
  # draft was fully populated and nothing in the pipeline verified a single signature: worse than round 1,
  # where each surviving leg at least checked its own artifacts. `if: ${{ !cancelled() }}` makes this job
  # run regardless of `release`'s outcome (only an actual workflow cancellation skips it), so an
  # incomplete matrix now produces a RED gate — this job will legitimately fail to fetch/verify whatever
  # a broken matrix left behind — instead of no gate at all. See also `.claude/commands/run.md` step 1b,
  # updated in the same commit to require this job's success before publishing a draft.
  #
  # Note: this job deliberately does NOT declare its own `permissions:` block, so it inherits the
  # workflow-level `contents: write` above. That is load-bearing, not an oversight — `gh release
  # download`/`gh release view` against a DRAFT release 404s on the plain `GET /releases/tags/{tag}`
  # lookup unauthenticated readers get, and `gh` falls back to a listing call that requires push access.
  # A future "tighten this job to `contents: read`" edit would silently break draft access here.
  verify-published-manifest:
    needs: release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # CPE-1967 — UNMEASURED, and the number below is therefore an ANALOGUE, not a measurement. Say so
    # rather than let the sample sizes on the other jobs in this file imply one exists: this job was
    # added by CPE-1872 on 2026-08-23 (f97aef8a) and the most recent `release.yml` run is
    # 2026-08-23T14:35Z, so it has never executed. Across the 100 most recent completed runs it
    # appears zero times, in any conclusion — not even as a skip.
    # The analogue is `ci.yml`'s `msrv` job, which is the same shape (ubuntu-latest, checkout,
    # dtolnay/rust-toolchain, swatinem/rust-cache, then a cargo build off a cache nothing else warms)
    # and measured max 17.1 min over n=75. This job compiles strictly less (one crate,
    # `crates/updater-verify`) but additionally downloads every published asset, so the same 1.5x of
    # 17.1 = 25.7 -> 30 is used. REPLACE THIS WITH A REAL MEASUREMENT after the next release cuts.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./crates/updater-verify -> target"

      # Guarded by the signing-key secret, mirroring the OS-code-signing/catalog pattern elsewhere in
      # this file, so a run where updater signing isn't configured stays green instead of failing on
      # a manifest that was never signed in the first place.
      #
      # CPE-1923 finding 4 — that gate used to be unconditional, and it made this whole job a
      # VACUOUS SUCCESS the moment the secret went missing: both real steps below are `if:
      # steps.sig.outputs.has == 'true'`, so with `TAURI_SIGNING_PRIVATE_KEY` unset the job ran,
      # skipped both, and concluded `success` — and RELEASING.md's publish gate reads that
      # conclusion as proof the manifest was verified. Deleting one repo secret silently converted
      # the release-integrity gate into a green no-op, which is indistinguishable in the run summary
      # from a gate that actually checked something.
      #
      # This workflow is triggered ONLY by a version tag push (see `on:` at the top), so on the tag
      # path there is no legitimate "nothing to verify" state: a tag means a release is being cut,
      # and a release being cut without a signing key is a broken release, not an exempt one. The
      # step therefore FAILS on a tag with no key rather than emitting `has=false`.
      #
      # The `has=false` arm is kept, not dead code: it is what a non-tag trigger (should one ever be
      # added — a `pull_request` smoke run, a manual dispatch) would take, and it keeps the two
      # downstream `if:` conditions unchanged. That matters because they are pinned from two
      # directions: `src/lib/releaseVerifyWiringGuard.test.ts` asserts the download and verify steps
      # share one gate, and CPE-1908's coverage ratchet pins the literal condition. Failing HERE
      # closes finding 4 without touching either — the gate a guard depends on stays exactly as it
      # was, and what changed is that reaching it with no key is now fatal.
      - name: Detect updater signing key
        id: sig
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # "Is this run cutting a release?" This workflow is triggered only by a version-tag push,
          # so a tag ref IS a release being cut. release-sidecar.yml answers the same question from
          # its own trigger (see there) and then runs a BYTE-IDENTICAL script.
          RELEASE_BUILD: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          if [ -n "${KEY:-}" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${RELEASE_BUILD:-}" = "true" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set, but this run is CUTTING A RELEASE. Without it the manifest verification below would SKIP and this job would still report success, which RELEASING.md's publish gate reads as proof the release was verified (CPE-1923 finding 4). Set the secret, or do not publish this release. This step will not report a green no-op."
            exit 1
          fi
          echo "has=false" >> "$GITHUB_OUTPUT"

      # Download the manifest that is ACTUALLY on the draft release, plus every asset any platform
      # entry's `url` names — not `--pattern '*'` (which would silently succeed on a manifest naming an
      # asset that was somehow never uploaded); downloading each referenced name individually makes a
      # missing asset a loud `gh` failure here rather than a quietly-smaller verified set downstream.
      - name: Download the published manifest + every asset it references
        if: steps.sig.outputs.has == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --pattern 'latest.json' --dir release-assets --clobber
          names=$(jq -r '.platforms[].url' release-assets/latest.json | sed 's#.*/##' | sort -u)
          if [ -z "$names" ]; then
            echo "::error::latest.json on the draft release names no platform urls -- nothing to verify"
            exit 1
          fi
          echo "assets referenced by the published manifest:"
          echo "$names"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            gh release download "$TAG" --pattern "$name" --dir release-assets --clobber
          done <<< "$names"

      # Requires EVERY platform the published manifest names to fetch and verify, per lib.rs's stricter
      # (CPE-1872) semantics — `verify-release-artifacts` cannot report success on a partial check
      # anymore, so there is no separate "--require-all-platforms" flag to remember to pass.
      #
      # CPE-1872 round 3, Finding B (MEDIUM) — the crypto check above only ever proves the ARTIFACT
      # BYTES behind a `url` are genuine; it never looks at the url's host or path, because both this
      # step and the download step above match purely by basename. A manifest can carry a perfectly
      # real, correctly-signed artifact under a `url` pointing at a foreign host, or at the right repo
      # but the wrong release tag, and pass clean while shipping every real updater client
      # infrastructure this release never checked — demonstrated (`n1_foreign_host_same_basename`,
      # `n2_wrong_tag_same_basename` in crates/updater-verify/tests/release_guard.rs) at EXIT=0 without
      # this flag. `--expect-url-prefix` requires every platform's `url` to start with this repo's real
      # `.../releases/download/<tag>/` prefix, enforced at the same site as the crypto check (in the
      # Rust binary, covered by its own test suite) rather than as a separate shell-level grep here that
      # a future refactor of the download step above could silently drop.
      - name: Verify the published manifest + signatures (CPE-1058)
        if: steps.sig.outputs.has == 'true'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cargo run --locked --manifest-path crates/updater-verify/Cargo.toml --release --bin verify-release-artifacts -- \
            --conf src-tauri/tauri.conf.json \
            --manifest release-assets/latest.json \
            --search release-assets \
            --expect-url-prefix "https://github.com/${REPO}/releases/download/${TAG}/" \
            --expect-channel plain

  # Sign + publish the agent-catalog bundle next to the installer (CPE-377/308), so the AI Console
  # can refresh its agent roster without an app release. Runs once, after the installers. Guarded by
  # the signing-key secret so its OWN steps skip (never fail) on repos that haven't set up catalog
  # signing — exactly like the OS-code-signing pattern above. That per-step secret gate is a
  # DIFFERENT, deliberate kind of "nothing to do" than the job-level `if:` below — see CPE-1893.
  #
  # CPE-1893 — `needs: release` used to carry no `if:` at all, which means this job was SKIPPED
  # (not failed, not run-and-succeeded — silently absent from the run) the moment `release` reported
  # anything other than success. `release` is `fail-fast: false`, so on a partial matrix failure the
  # surviving legs still finish and tauri-action still creates/populates the draft release — the
  # exact same situation CPE-1872 round 3 already fixed for `verify-published-manifest` below, for
  # the identical reason (see that job's own comment). Concretely: `release` failed on every tagged
  # run from 2026-07-26 to 2026-08-23 (a step now moved into `verify-published-manifest`, unrelated
  # to this job's own work), so `catalog` silently skipped on all ~15 of those runs and the signed
  # agent-catalog bundle went unpublished for 31 days with nothing anywhere saying so — `skipped`
  # reads in the run summary exactly like a job that correctly had nothing to do.
  #
  # `if: ${{ !cancelled() }}` (same expression, same reasoning, as `verify-published-manifest`) makes
  # this job run regardless of `release`'s pass/fail outcome — only an actual workflow cancellation
  # skips it now. On a genuine total-matrix failure (no release/draft object created at all) this job
  # now runs and FAILS LOUDLY at `gh release upload` (there's nothing to upload to), rather than
  # skipping quietly — turning a genuine dependency into a loud failure instead of a silent no-op,
  # per this ticket's own requirement. A DEDICATED, schedule-driven freshness check
  # (catalog-freshness.yml) is the independent backstop for every other way this bundle could stop
  # shipping without a `release`-job failure at all (e.g. this job "succeeding" at zero work because
  # the signing-key secret got unset) — see that workflow's header comment.
  #
  # ── CPE-1953: the coupling decision, recorded ───────────────────────────────────────────────────
  # This ticket asked whether `needs: release` is the right coupling at all, given that a broken
  # INSTALLER build silently stopped AGENT-CATALOG updates for every user — two failures with very
  # different blast radii chained to one condition. The answer, deliberately, is **keep `needs:
  # release` and make every remaining silent path loud instead**, because the dependency is not mere
  # ordering that could be dropped: this job's only publishing action is `gh release upload "$TAG"`,
  # which needs the release object that `release`/tauri-action CREATES. A fully decoupled `catalog`
  # job would start at t=0 and race that creation — turning today's deterministic, diagnosable
  # coupling into a nondeterministic upload failure that is strictly WORSE to read. So the coupling
  # stays; what changes is that no path through this job may finish green without having published.
  #
  # Three ways this job could still end green having shipped nothing, all closed below:
  #   1. NO SIGNING KEY (the big one). Every real step here is `if: steps.k.outputs.has == 'true'`,
  #      so with `CPE_CATALOG_SIGNING_KEY` unset the job RAN, skipped all of them, and concluded
  #      `success` — a vacuous success indistinguishable in the run summary from a real publish.
  #      This is the identical hole CPE-1923 finding 4 found and fixed for
  #      `verify-published-manifest`'s `Detect updater signing key` above, and this job was not
  #      given the same treatment at the time. It is now the SAME shape, using the SAME
  #      `RELEASE_BUILD: github.ref_type == 'tag'` test and the same preserved `has=false`
  #      non-tag arm — not a second, differently-reasoned mechanism.
  #   2. ZERO-WORK SIGN. `catalog-sign` exiting 0 having written no (or an empty, or an
  #      entry-less) `catalog-index.json` — `Verify the signed bundle` below reads the actual file
  #      the client actually fetches and fails on it, BEFORE the upload.
  #   3. UPLOAD THAT ATTACHED NOTHING USEFUL. `Confirm the catalog is actually on the release` below
  #      re-reads the release's asset list from GitHub afterwards and requires
  #      `catalog-index.json` (+ its `.sig`) to be there by name — so an upload that "succeeded"
  #      while attaching the wrong files, or that landed on an object that then lost them, is red
  #      here rather than discovered ~14 days later by catalog-freshness.yml.
  # The `!cancelled()` job-level `if:` (CPE-1893) is what makes a failed `release` job leave this one
  # RUNNING; these three make what it does while running impossible to mistake for a publish.
  catalog:
    needs: release
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # CPE-1967 — n=66, min 0.5 / p50 0.8 / p90 1.1 / max 2.5 min over the 100 most recent completed
    # `release.yml` runs as of 2026-08-28. 1.5 x 2.5 = 3.8, under the 10-minute floor -> 10.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # CPE-1953: byte-for-byte the same vacuous-success argument (and very nearly the same script)
      # as `Detect updater signing key` in `verify-published-manifest` above — see CPE-1923 finding
      # 4 there for the full reasoning, which transfers without modification. In short: this workflow
      # is triggered ONLY by a version-tag push, so on the tag path there is no legitimate "nothing
      # to publish" state. A tag means a release is being cut; a release cut with no catalog signing
      # key is a release that silently stops updating every user's agent roster, not an exempt one.
      #
      # The `has=false` arm is deliberately kept rather than deleted: it is the arm a non-tag trigger
      # would take if one is ever added, and keeping it means the three downstream
      # `if: steps.k.outputs.has == 'true'` gates are untouched — which matters because
      # `src/lib/catalogPublishFreshnessGuard.test.ts` pins that those gates still exist. Failing
      # HERE closes the hole without moving the gate any guard depends on.
      - name: Detect catalog signing key
        id: k
        shell: bash
        env:
          KEY: ${{ secrets.CPE_CATALOG_SIGNING_KEY }}
          RELEASE_BUILD: ${{ github.ref_type == 'tag' }}
        run: |
          set -euo pipefail
          if [ -n "${KEY:-}" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${RELEASE_BUILD:-}" = "true" ]; then
            echo "::error::CPE_CATALOG_SIGNING_KEY is not set, but this run is CUTTING A RELEASE. Without it every step below SKIPS and this job still reports success — a green run that published no agent catalog at all, which is exactly how the catalog went unpublished for 33 days (CPE-1953/CPE-1893). Set the secret, or do not cut this release. This step will not report a green no-op."
            exit 1
          fi
          echo "has=false" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        if: steps.k.outputs.has == 'true'
        uses: dtolnay/rust-toolchain@stable

      # The host crate's Linux keyring backend (CPE-322) links libdbus, so building any host
      # binary on Linux — including catalog-sign — needs it.
      # CPE-1824: same hardening as the release job's apt-get site above -- no `continue-on-error`
      # here either, so an unbounded hang previously rode to the job's 360-minute default instead
      # of failing fast.
      - name: Install libdbus (host crate's Linux keyring dep)
        if: steps.k.outputs.has == 'true'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libdbus-1-dev pkg-config

      # CPE-1941 — this used to be `VERSION=$(date +%s)` inline in the signing step below: a
      # wall-clock timestamp read AT PUBLISH TIME, so the number recorded when the workflow ran, not
      # what it published. Re-running this workflow on an OLD TAG therefore republished that tag's
      # old manifests under a version newer than anything installed, and the trust engine's
      # anti-rollback rule (sidecar/host/src/catalog.rs, `VersionStanding::refusal`) accepted them:
      # a content downgrade with every signature and content hash intact, reachable with no
      # signing-key compromise by anyone who can press "Re-run jobs" on an old tag.
      #
      # The version now comes from the TAGGED COMMIT's committer timestamp, read out of the checkout
      # this job already has — no network and no new trust dependency (the correction PR #1051's
      # Security Auditor made to CPE-1924's "we'd have to fetch and trust the published index"
      # framing). Re-running an old tag now reproduces that tag's own, older number, which
      # anti-rollback refuses. The whole rule, including the installed-base floor that keeps the
      # scheme change from emitting numbers below what clients already hold, lives in one place:
      # .github/workflows/scripts/catalog-version.sh (structurally pinned by
      # src/lib/catalogPublishVersion.test.ts, demonstrated end to end by
      # sidecar/host/tests/catalog_republish_downgrade.rs).
      #
      # A separate, FATAL step on purpose: if the version cannot be derived or fails the floor /
      # future-date checks, this job fails instead of falling back to a number that would either be
      # rejected by every installed client or poison anti-rollback for every later release.
      - name: Derive the catalog version from the tagged commit (CPE-1941)
        if: steps.k.outputs.has == 'true'
        id: cv
        shell: bash
        env:
          TAG_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # "the checkout's HEAD *is* the tagged commit" was the one link in this chain that was
          # inferred rather than executed (CPE-1941 SEC review). Inferred no longer: this workflow
          # triggers on `push: tags:` ONLY, so `github.sha` is by definition the commit the tag
          # points at, and `actions/checkout@v4` with no `ref:` checks out `github.ref`. Assert the
          # two agree rather than trusting they do -- if a future checkout change (an added `ref:`,
          # or a trigger that produces a merge commit) ever made HEAD something other than the
          # tagged commit, this job would otherwise version the WRONG commit in silence, which is
          # the exact class of bug this ticket exists to close.
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "::error::checkout HEAD ${HEAD_SHA} is not the tagged commit ${TAG_SHA} -- refusing to version a commit other than the one being released"
            exit 1
          fi
          VERSION=$(bash .github/workflows/scripts/catalog-version.sh "$TAG_SHA" .)
          STAMPED=$(date -u -d "@${VERSION}" +%Y-%m-%dT%H:%M:%SZ)
          echo "catalog version ${VERSION} (${STAMPED}) — committer timestamp of ${TAG_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # CPE-1951 — the MONOTONIC half of anti-rollback, and the reason it is a separate step from
      # the derive above.
      #
      # CPE-1941 made the version the tagged commit's committer timestamp, which is right, and made
      # the version track COMMIT order rather than RELEASE order, which is the hole. Cut a release
      # from a commit older than the last released one — a hotfix off a maintenance branch, a revert
      # branch, `git tag` on a non-tip commit — and the number goes DOWN while everything here stays
      # green: CATALOG_VERSION_FLOOR is a static constant that such a version clears by a mile, the
      # future-date check passes, the signatures verify, the sha256s bind, the upload succeeds. Every
      # client then answers `ApplyOutcome::Rollback`, writes nothing, and logs nothing.
      #
      # `CATALOG_VERSION_FLOOR` STAYS and is not what this replaces. The floor asks "is this above
      # what the installed base already holds" — a fact about clients that no fetch can observe,
      # since a client can sit on an old catalog for months. This asks "is this strictly above what
      # is published RIGHT NOW". Neither implies the other, and both are wanted.
      #
      # It resolves exactly what a default client resolves — `releases/latest/download/
      # catalog-index.json` (`catalog_url()`, src-tauri/src/lib.rs) — which during a release run is
      # still the PREVIOUS release, because tauri-action creates this tag's release as a DRAFT and
      # `latest` never resolves to a draft. So the run cannot race itself, and `v0.57.32`'s
      # higher-but-never-served draft number stays out of the bound.
      #
      # FATAL, and fails CLOSED on every fetch error, with a distinct message per cause (timeout /
      # unreachable / truncated / 404 / 5xx / unparseable / missing tool). The one non-fatal route is
      # "the latest published release exists and its enumerated asset list contains no
      # catalog-index.json" — established POSITIVELY via the releases API before it is believed,
      # never inferred from a failed fetch. That distinction is the whole of the 404 decision and it
      # is argued at length in the script's header; read it before touching that branch.
      - name: Refuse a catalog version that is not newer than the published one (CPE-1951)
        if: steps.k.outputs.has == 'true'
        id: lb
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.cv.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test -n "$VERSION" # the derive step above is the only source
          bash .github/workflows/scripts/catalog-lower-bound.sh "$VERSION" "$REPO"

      - name: Build + sign the catalog bundle
        id: sign
        if: steps.k.outputs.has == 'true'
        shell: bash
        env:
          # A 32-byte ed25519 seed (hex). Generate once; its public key goes in CATALOG_TRUSTED_KEYS.
          CPE_CATALOG_SIGNING_KEY: ${{ secrets.CPE_CATALOG_SIGNING_KEY }}
          # Monotonic across releases → anti-rollback (CPE-372), and derived from the tag's own
          # commit rather than from publish time (CPE-1941) so re-running an old tag cannot advance it.
          VERSION: ${{ steps.cv.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$VERSION" # the derive step above is the only source; never sign an empty version
          cargo run --locked --release --quiet --manifest-path sidecar/host/Cargo.toml --bin catalog-sign -- \
            sidecar/ai-console/agents catalog-out "$VERSION"

      # CPE-1953, hole 2 (zero-work sign). `catalog-sign` exiting 0 is not evidence it produced
      # anything a client can use. This reads the EXACT file a real client fetches
      # (`catalog-index.json`, per catalog_sign.rs's own doc header and catalog-freshness.yml's fetch
      # URL) and requires it to exist, be non-empty, parse, and carry at least one entry with the
      # anti-rollback `version` stamp the freshness check reads. Deliberately BEFORE the upload, so a
      # useless bundle never reaches the release at all rather than being detected afterwards.
      - name: Verify the signed bundle before uploading it
        id: bundle
        if: steps.k.outputs.has == 'true'
        shell: bash
        run: |
          set -euo pipefail
          index=catalog-out/catalog-index.json
          if [ ! -s "$index" ]; then
            echo "::error::catalog-sign exited 0 but produced no non-empty ${index} — there is nothing to publish. Uploading anyway would leave the release looking like it carries a catalog while every client's fetch 404s or reads an empty index (CPE-1953)."
            ls -la catalog-out 2>/dev/null || echo "(catalog-out does not exist)"
            exit 1
          fi
          # SCOPE, named deliberately: this checks the signature is PRESENT and non-empty, never
          # that it VERIFIES. A garbage `.sig` passes HERE. That was a documented residual until
          # CPE-1954 landed the verify path (PR #1088); the real check is now the
          # `Verify the signed bundle's signatures under the trusted key (CPE-1978)` step below,
          # which runs `catalog-sign verify` before anything is uploaded. This step's claim stays
          # exactly "a signature file was produced" — it is the cheap, jq-free arm that names the
          # missing-file case precisely; the step below is the one that decides validity.
          if [ ! -s "${index}.sig" ]; then
            echo "::error::${index} exists but its detached signature ${index}.sig is missing or empty. Every client verifies the signature before applying (CPE-372), so an unsigned index publishes a catalog nobody can use."
            exit 1
          fi
          # `if ! var=$(...)` rather than a bare assignment: under `set -e` a bare failing command
          # substitution aborts the step BEFORE the diagnostic can be printed (the CPE-1893 UAT
          # round-1 finding, red-proofed in catalogPublishFreshnessGuard.test.ts).
          if ! entries=$(jq -r '.entries | length' "$index"); then
            echo "::error::${index} is not parseable JSON — catalog-sign wrote a corrupt or truncated index."
            exit 1
          fi
          # CPE-1953 review, blocker 1: `[ "$x" -lt 1 ]` exits **2** (not 1) when $x is not a single
          # integer, and inside an `if` an exit of 2 is indistinguishable from a plain "false" — so
          # the zero-entry check below was SKIPPED and this step exited 0, going on to upload, while
          # bash printed only `[: integer expected` to stderr. That is this ticket's own defect class
          # (a guard failing OPEN and reporting success) inside the guard added to prevent it.
          # It is reachable with REAL jq, not just a stub: a concatenated JSON stream
          # (`{"entries":[]}{"entries":[{…}]}`) makes jq print one length per document and exit 0,
          # yielding a multi-line `entries`. Validate the SHAPE first, then compare. `case` rather
          # than a `grep -Eq` pipeline deliberately — no subshell, and so no repeat of the pipefail
          # /SIGPIPE trap noted on the confirm step below. Red-proofed by execution in
          # src/lib/catalogPublishLoudFailure.test.ts.
          case "$entries" in
            "" | *[!0-9]*)
              echo "::error::could not read a single entry count from ${index}: jq returned [${entries}], which is not one non-negative integer. Refusing to treat an unreadable count as a passing one — that is how a guard fails open."
              exit 1
              ;;
          esac
          if [ "$entries" -lt 1 ]; then
            echo "::error::${index} parses but has zero entries[] — this is the 'succeeding at zero work' shape catalog-freshness.yml's header warns about, caught here at publish time instead of up to 14 days later."
            exit 1
          fi
          echo "entries=${entries}" >> "$GITHUB_OUTPUT"
          echo "signed catalog bundle carries ${entries} entr(y|ies); files to upload:"
          ls -la catalog-out

      # CPE-1978 — the step above proves a `.sig` FILE EXISTS; this one proves the BYTES VERIFY.
      #
      # MEASURED GAP (do not re-derive it from the names): with a bundle whose `catalog-index.json.sig`
      # was the ASCII text `not a signature`, the step above exited **0** and the job went on to
      # upload. That is an exit status, not a log reading, and it is red-proofed permanently in
      # `src/lib/catalogPublishLoudFailure.test.ts` §8 ("REGRESSION DEMO"), which executes that
      # step's own `run:` body against exactly that bundle. Its own comment named CPE-1954 as the
      # enabler; CPE-1954 landed (PR #1088), so the real check runs here now.
      #
      # WHY THE KEY IS A LITERAL IN THIS FILE AND NOT A REPO SECRET. `CATALOG_PUBKEY` is the PUBLIC
      # half of `CPE_CATALOG_SIGNING_KEY`. Publishing it costs nothing — the identical value is
      # already committed as `CATALOG_TRUSTED_KEYS` in `src-tauri/src/lib.rs` and ships inside every
      # installed binary, so a secret would buy no confidentiality at all. It would cost two things
      # that matter. (1) It would be a SECOND copy of a value that must equal `CATALOG_TRUSTED_KEYS`,
      # held somewhere no diff and no guard in this tree can see — so a key rotation could silently
      # disagree with what every installed client trusts, which is the one failure this step exists
      # to catch. (2) An unset secret expands to the empty string, i.e. it fails OPEN, which is the
      # shape this job has now been bitten by twice (CPE-1893/CPE-1953). A literal is reviewable in
      # the diff, and `src/lib/catalogPublishLoudFailure.test.ts` §8 reads it out of THIS file and
      # out of `CATALOG_TRUSTED_KEYS` and reds if they ever differ.
      #
      # WHY THE CLIENTS' KEY AND NOT THE SIGNING KEY. Verifying under the key that just signed would
      # only prove the bundle is self-consistent. Verifying under `CATALOG_TRUSTED_KEYS` also proves
      # that a rotated `CPE_CATALOG_SIGNING_KEY` nobody mirrored into the app cannot publish a
      # bundle every installed client will reject — the availability failure the threat model calls
      # out as unfixable after the fact (`CATALOG_TRUSTED_KEYS` is compile-time).
      #
      # FAIL CLOSED — "ran and found nothing" vs "did not run" (CLAUDE.md). `set -euo pipefail`
      # covers cargo being absent (127), the build failing (101), and the bundle being unreadable.
      # The case an exit code alone CANNOT cover is a verifier that runs and says yes to everything,
      # so the check runs TWICE: once under the trusted key, which must PASS, and once under a key
      # that provably did not sign this bundle, which must FAIL. A stub, a no-op, a short-circuited
      # `verify`, or a future edit that drops the subcommand passes both runs and is caught by the
      # second. That negative run is not vacuous — the positive run immediately before it read the
      # same directory and exited 0, so a refusal here cannot be "could not read the bundle".
      # `sidecar/host/tests/catalog_sign_verify_gate.rs` pins the binary's side of both halves
      # (`a_bundle_from_the_real_signer_still_verifies`, and the "signed by a key the operator did
      # not name" arm of `every_unusable_index_is_refused_rather_than_waved_through`).
      #
      # THE CONTROL'S STRENGTH IS KEY-DEPENDENT, recorded here because it is invisible from the code
      # (PR #1095 review F4). For TODAY's key the decoy `0b18…` is a valid ed25519 curve point, so
      # `VerifyingKey::from_bytes` SUCCEEDS and the refusal comes from `verify_strict` — i.e. the
      # control genuinely exercises the signature path and cannot be satisfied by the same trivial
      # success the positive run would get. That is a property of this key, not of the construction:
      # measured on a throwaway key `d21f…`, the decoy `021f…` is NOT a valid point, and there the
      # refusal would come from key parsing instead, proving only that a malformed key is rejected.
      # It still fails closed either way (`sidecar/host/src/trust.rs` returns false rather than
      # panicking on an unparsable key), so the step is correct in both cases — but on a future
      # ROTATION, re-check this: if the rotated key's decoy is off-curve, strengthen the control by
      # flipping a byte of `catalog-out/catalog-index.json.sig` in a scratch copy instead, which is
      # key-independent.
      - name: Verify the signed bundle's signatures under the trusted key (CPE-1978)
        id: sigverify
        if: steps.k.outputs.has == 'true'
        shell: bash
        env:
          # The PUBLIC key (hex). Must equal an entry of `CATALOG_TRUSTED_KEYS` in
          # `src-tauri/src/lib.rs`; that equality is asserted, not assumed — see above.
          CATALOG_PUBKEY: 5b18ad467b37b7c06556000f15359a845bd85790ece91de110a337890d017130
        run: |
          set -euo pipefail
          key="${CATALOG_PUBKEY:-}"
          # Shape first, so an unusable key is refused as "did not run" instead of being handed to
          # the verifier and coming back as an ordinary "no" nobody can tell from a real refusal.
          case "$key" in
            "" | *[!0-9a-f]*)
              echo "::error::CATALOG_PUBKEY is empty or is not lowercase hex ([${key}]). Refusing to run the signature check under a value that cannot be an ed25519 public key — an unusable key means the check DID NOT RUN, which must never read as a pass."
              exit 1
              ;;
          esac
          if [ "${#key}" -ne 64 ]; then
            echo "::error::CATALOG_PUBKEY is ${#key} hex characters, not the 64 of an ed25519 public key. Refusing to publish on a check that could not have verified anything."
            exit 1
          fi
          run_verify() {
            cargo run --locked --release --quiet --manifest-path sidecar/host/Cargo.toml --bin catalog-sign -- \
              verify catalog-out "$1"
          }
          echo "verifying catalog-out under the trusted key ${key}"
          if ! run_verify "$key"; then
            echo "::error::catalog-sign verify did not succeed under CATALOG_TRUSTED_KEYS (${key}). The line(s) directly above say which of the three it was, and they are three different problems: (a) the verifier COULD NOT RUN AT ALL (no cargo, a build failure, a missing bundle) — that is 'did not run', never a pass; (b) CPE_CATALOG_SIGNING_KEY is not the private half of the key this app trusts, so every installed client would reject this catalog outright; (c) the bundle's index/manifest signatures, content hashes, schema or entry ids are bad. Refusing to upload on any of them."
            exit 1
          fi
          # The "did it actually run?" control. Same key with its first hex digit changed, so it is
          # the right shape and is certainly not the key that signed this bundle.
          decoy="0${key#?}"
          if [ "$decoy" = "$key" ]; then decoy="1${key#?}"; fi
          echo "control: the same bundle must be REFUSED under ${decoy}"
          if run_verify "$decoy"; then
            echo "::error::catalog-sign reported success under ${decoy}, a key that did not sign this bundle. The verifier is not verifying — it is missing, stubbed, or short-circuited — so the passing run above proves nothing. Refusing to publish on a check that cannot fail."
            exit 1
          fi
          echo "catalog-out verifies under the trusted key, and is refused under a key that did not sign it"

      # CPE-1893's own claim lives here: with `if: ${{ !cancelled() }}` above, a total-matrix
      # `release` failure leaves NO release object for this tag, and `gh release upload` then exits
      # non-zero ("release not found") — the job FAILS LOUDLY instead of skipping grey. That claim
      # had never once been exercised against a real release (every skip in the history predates
      # CPE-1893), so it is now red-proofed by execution in
      # src/lib/catalogPublishLoudFailure.test.ts, which runs THIS step's own `run:` body with a stub
      # `gh` that reproduces GitHub's real not-found response.
      - name: Upload catalog assets to the release
        id: up
        if: steps.k.outputs.has == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" catalog-out/* --clobber

      # CPE-1953, hole 3 (an upload that attached nothing useful). `gh release upload` succeeding
      # proves a transfer happened, not that the release now carries the file a client asks for by
      # name. Re-reading the asset list from GitHub afterwards is the only check that survives a
      # future edit to the upload glob, a partially-applied `--clobber`, or an object that lost its
      # assets — and it is the same "verify the PUBLISHED state, not the local intent" principle
      # `verify-published-manifest` above already applies to latest.json.
      #
      # Like that job, this step declares no `permissions:` and inherits the workflow-level
      # `contents: write`. That is load-bearing for the same documented reason: `gh release view`
      # against a DRAFT release 404s on the unauthenticated `GET /releases/tags/{tag}` lookup and
      # falls back to a listing call needing push access. tauri-action creates the release as a
      # draft, so this read is always a draft read on a normal run.
      - name: Confirm the catalog is actually on the release
        id: confirm
        if: steps.k.outputs.has == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # RESIDUAL, named deliberately (CPE-1953 review): this asserts the assets are PRESENT BY
          # NAME, never that they have bytes — `--json assets` also carries `.size`, and a zero-byte
          # `catalog-index.json` would pass this check. Left as-is rather than half-fixed: a size>0
          # test would still not prove the uploaded bytes match what was signed locally, and the
          # honest version of that check is a re-download-and-verify, which is `verify-published-
          # manifest`'s shape and wants its own ticket rather than an inline approximation here.
          if ! names=$(gh release view "$TAG" --json assets --jq '.assets[].name'); then
            echo "::error::could not read back the asset list for ${TAG} after uploading. A lookup failure is NOT evidence the upload worked — refusing to report success on it (CPE-1794's lesson, applied here)."
            exit 1
          fi
          # A HERESTRING, not `printf ... | grep -q`: under `pipefail` a `grep -q` that matches early
          # closes the pipe, printf takes SIGPIPE, and the PIPELINE reports 141 — so the piped form
          # can set `missing` on the very case where the asset was FOUND. Stated precisely, because
          # the first version of this comment overstated it (CPE-1953 review): the inversion is
          # SIZE-GATED, needing roughly 28,912–88,912 bytes of asset names (~2,000–6,000 assets) for
          # printf to still be writing when grep exits. A real release carries ~20, so the piped form
          # would have worked in practice — this is a latent inverted-verdict shape that never
          # shipped, avoided rather than a bug that bit. Both shapes are executed in
          # catalogPublishLoudFailure.test.ts.
          missing=""
          for want in catalog-index.json catalog-index.json.sig; do
            grep -Fxq "$want" <<< "$names" || missing="${missing} ${want}"
          done
          if [ -n "$missing" ]; then
            echo "::error::the upload reported success but ${TAG} does not carry:${missing}. Assets actually present:"
            printf '%s\n' "$names"
            exit 1
          fi
          echo "confirmed on ${TAG}: catalog-index.json + catalog-index.json.sig"

      # CPE-1953 — the single place this job's honesty is decided. `if: always()` so it reports even
      # when an earlier step failed or skipped: its whole job is to make sure the words "catalog:
      # success" in a run summary can only ever mean a catalog was published. Any step above that is
      # neither `success` nor a legitimately-configured skip lands here as a RED status with the
      # reason spelled out, rather than as a grey job nobody reads.
      - name: Catalog publish outcome
        if: always()
        shell: bash
        env:
          HAS_KEY: ${{ steps.k.outputs.has }}
          LOWERBOUND: ${{ steps.lb.outcome }}
          SIGN: ${{ steps.sign.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
          SIGVERIFY: ${{ steps.sigverify.outcome }}
          UPLOAD: ${{ steps.up.outcome }}
          CONFIRM: ${{ steps.confirm.outcome }}
          ENTRIES: ${{ steps.bundle.outputs.entries }}
          TAG: ${{ github.ref_name }}
          RELEASE_BUILD: ${{ github.ref_type == 'tag' }}
        run: |
          set -uo pipefail
          if [ "${HAS_KEY:-}" != "true" ]; then
            # CPE-1953 review, blocker 2. `HAS_KEY` is empty in TWO different situations, and an
            # earlier version of this branch collapsed them into one sentence that was false in the
            # more important of the two: a tag build where the detect step FAILED (so `has` was never
            # written) got told "this is not a tag build — nothing was expected to be [published]",
            # both clauses wrong, in the exact scenario this ticket was filed for. The job was still
            # red via step `k`, so the outcome was right and the SUMMARY LINE lied — which for a step
            # whose whole job is to say what happened is the same defect in a smaller place. Read the
            # trigger directly rather than inferring it from a missing output.
            if [ "${RELEASE_BUILD:-}" = "true" ]; then
              echo "::error::no catalog signing key was available on a TAG build (${TAG}), so nothing was published and a publish WAS expected. See the 'Detect catalog signing key' step above for why — it fails deliberately rather than letting this job go green having shipped no agent catalog."
              exit 1
            fi
            echo "::notice::no catalog signing key configured and this is not a tag build — nothing was published, and nothing was expected to be."
            exit 0
          fi
          failed=""
          # CPE-1951: the monotonic lower-bound gate is accounted for here like every other step. It
          # runs BEFORE the sign, so a refusal leaves SIGN/UPLOAD/CONFIRM as `skipped` — which this
          # loop already reports as non-success, but naming the gate explicitly is what makes the
          # summary say *why* nothing was published rather than listing three consequences of it.
          [ "${LOWERBOUND:-}" = "success" ] || failed="${failed} lower-bound(${LOWERBOUND:-<none>})"
          [ "${SIGN:-}" = "success" ] || failed="${failed} build+sign(${SIGN:-<none>})"
          [ "${BUNDLE:-}" = "success" ] || failed="${failed} verify-bundle(${BUNDLE:-<none>})"
          [ "${SIGVERIFY:-}" = "success" ] || failed="${failed} verify-signatures(${SIGVERIFY:-<none>})"
          [ "${UPLOAD:-}" = "success" ] || failed="${failed} upload(${UPLOAD:-<none>})"
          [ "${CONFIRM:-}" = "success" ] || failed="${failed} confirm-on-release(${CONFIRM:-<none>})"
          if [ -n "$failed" ]; then
            echo "::error::the agent catalog was NOT published for ${TAG}. Non-success steps:${failed}. Every user's agent roster stays on whatever was last published until this is fixed — see CPE-1953, and .github/workflows/catalog-freshness.yml for how stale that is allowed to get before the independent backstop fires."
            exit 1
          fi
          echo "agent catalog published for ${TAG}: ${ENTRIES:-?} entr(y|ies), confirmed present on the release."
