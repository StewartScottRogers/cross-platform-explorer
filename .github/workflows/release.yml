name: Release

# Build signed installers for every OS and publish a GitHub Release
# (plus the updater's latest.json) whenever you push a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
on:
  push:
    tags:
      - "v*"

# Needed so the workflow can create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon + Intel via universal target)
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both arches for the universal build.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      # --- Windows code signing (CPE-1131 — self-signed) ---
      # Conditional on the WINDOWS_CERT_PFX_BASE64 secret so fork/PR/unconfigured builds still succeed
      # UNSIGNED (mirrors the updater/catalog "skip when the secret is absent" pattern below). When the
      # secret is present on a windows-latest runner, import the .pfx and patch bundle.windows in
      # tauri.conf.json so tauri-action signs the installer. NOTE: a self-signed cert makes the installer
      # Authenticode-signed but does NOT clear SmartScreen for the public — see docs/signing/ + CPE-002.
      - name: Detect Windows signing cert (CPE-1131)
        id: wincert
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ -n "$PFX" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Windows code signing (CPE-1131 — self-signed)
        if: steps.wincert.outputs.has == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cpe-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $sec = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          Remove-Item $pfx -Force
          # Patch bundle.windows in tauri.conf.json (runner-only; never committed) so tauri-action signs.
          # Read AND write through an explicit BOM-less UTF-8 encoder (CPE-1842; same fix and same
          # reasoning as CPE-1834 in scripts/release.ps1). tauri.conf.json is BOM-less UTF-8 and
          # carries non-ASCII (an em dash in plugins.cli.description), so a codec that depends on the
          # host's defaults is a live hazard: bare `Get-Content -Raw` misdecodes it as the system ANSI
          # code page and `Set-Content -Encoding utf8` prepends a BOM on Windows PowerShell 5.1 — the
          # exact shape the repo's mojibake guard exists to catch. pwsh 7 happens to default to
          # BOM-less UTF-8 on both ends, which is why this has survived so far; that is a default, not
          # a guarantee, and it flips the moment this step runs under `shell: powershell`, an older
          # image, or a different locale. Being explicit costs nothing and holds on every host.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $conf = 'src-tauri/tauri.conf.json'
          $confPath = (Resolve-Path $conf).Path
          $j = [System.IO.File]::ReadAllText($confPath, $utf8NoBom) | ConvertFrom-Json
          if ($null -eq $j.bundle.windows) {
            $j.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{}) -Force
          }
          $j.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $j.bundle.windows | Add-Member -NotePropertyName digestAlgorithm      -NotePropertyValue 'sha256' -Force
          $j.bundle.windows | Add-Member -NotePropertyName timestampUrl         -NotePropertyValue 'http://timestamp.digicert.com' -Force
          [System.IO.File]::WriteAllText($confPath, ($j | ConvertTo-Json -Depth 40), $utf8NoBom)
          Write-Host "Windows self-signed signing enabled (thumbprint $($cert.Thumbprint))."

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — generate with `npm run tauri signer generate`
          # and store the outputs as repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- OS code signing — see CPE-002 (currently Blocked on certificates) ---
          #
          # Leave these commented until the certificates actually exist. Setting them
          # to empty secrets makes the signing step fail rather than skip, which would
          # break a currently-working release build.
          #
          # macOS (requires Apple Developer Program membership):
          #   APPLE_CERTIFICATE           — base64 of the .p12 Developer ID cert
          #   APPLE_CERTIFICATE_PASSWORD  — password for that .p12
          #   APPLE_SIGNING_IDENTITY      — e.g. "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID / APPLE_PASSWORD   — Apple ID + app-specific password (notarization)
          #   APPLE_TEAM_ID               — 10-char team ID
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows (requires an OV or EV Authenticode certificate):
          #   Windows signing is configured in src-tauri/tauri.conf.json under
          #   bundle.windows (certificateThumbprint + digestAlgorithm + timestampUrl),
          #   with the cert installed on the runner — NOT via env vars here.
          #   EV certs are typically hardware/HSM-bound, which usually means a
          #   cloud-signing service or a self-hosted runner.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cross-Platform Explorer ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Emit the updater manifest consumed by tauri.conf.json endpoints.
          includeUpdaterJson: true

      # CPE-1058 — verify the updater manifest we just built, before it ships. Reads pubkey + version from
      # tauri.conf.json, locates this runner's freshly-built latest.json + updater artifacts under
      # src-tauri/target, and re-checks each platform's minisign signature against the configured pubkey
      # over the real artifact bytes — the same check the runtime plugin performs. Fails the release on a
      # bad manifest (wrong signature / version mismatch / malformed). Guarded by the signing-key secret so
      # it SKIPS (never fails) when updater signing isn't configured, mirroring the catalog job below and
      # the OS-code-signing pattern above, keeping fork/PR builds green. The verify crate is standalone and
      # NOT linked into the app (its minisign dep never enters the shipped binary).
      - name: Detect updater signing key
        id: sig
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Verify updater manifest + signatures (CPE-1058)
        if: steps.sig.outputs.has == 'true'
        working-directory: crates/updater-verify
        shell: bash
        run: |
          cargo run --release --bin verify-release-artifacts -- \
            --conf ../../src-tauri/tauri.conf.json \
            --search ../../src-tauri/target

  # Sign + publish the agent-catalog bundle next to the installer (CPE-377/308), so the AI Console
  # can refresh its agent roster without an app release. Runs once, after the installers. Guarded by
  # the signing-key secret so it SKIPS (never fails) on repos that haven't set up catalog signing —
  # exactly like the OS-code-signing pattern above.
  catalog:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect catalog signing key
        id: k
        env:
          KEY: ${{ secrets.CPE_CATALOG_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install Rust toolchain
        if: steps.k.outputs.has == 'true'
        uses: dtolnay/rust-toolchain@stable

      # The host crate's Linux keyring backend (CPE-322) links libdbus, so building any host
      # binary on Linux — including catalog-sign — needs it.
      - name: Install libdbus (host crate's Linux keyring dep)
        if: steps.k.outputs.has == 'true'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build + sign the catalog bundle
        if: steps.k.outputs.has == 'true'
        env:
          # A 32-byte ed25519 seed (hex). Generate once; its public key goes in CATALOG_TRUSTED_KEYS.
          CPE_CATALOG_SIGNING_KEY: ${{ secrets.CPE_CATALOG_SIGNING_KEY }}
        run: |
          VERSION=$(date +%s)   # monotonic across releases → anti-rollback (CPE-372)
          cargo run --release --quiet --manifest-path sidecar/host/Cargo.toml --bin catalog-sign -- \
            sidecar/ai-console/agents catalog-out "$VERSION"

      - name: Upload catalog assets to the release
        if: steps.k.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" catalog-out/* --clobber
