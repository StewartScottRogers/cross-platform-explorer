name: Release

# Build signed installers for every OS and publish a GitHub Release
# (plus the updater's latest.json) whenever you push a version tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
on:
  push:
    tags:
      - "v*"

# Needed so the workflow can create the GitHub Release.
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS (Apple Silicon + Intel via universal target)
          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS needs both arches for the universal build.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # CPE-1824: same ForceIPv4/retry/timeout hardening CPE-1787 applied to ci.yml's identical
      # site -- a GitHub-hosted-runner IPv6-connectivity stall can hang `apt-get update` with zero
      # output before it ever falls back to IPv4, and this step has no `continue-on-error`, so an
      # unbounded hang here previously rode all the way to the job's 360-minute default before
      # anyone noticed the release wasn't shipping.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      # --- Windows code signing (CPE-1131 — self-signed) ---
      # Conditional on the WINDOWS_CERT_PFX_BASE64 secret so fork/PR/unconfigured builds still succeed
      # UNSIGNED (mirrors the updater/catalog "skip when the secret is absent" pattern below). When the
      # secret is present on a windows-latest runner, import the .pfx and patch bundle.windows in
      # tauri.conf.json so tauri-action signs the installer. NOTE: a self-signed cert makes the installer
      # Authenticode-signed but does NOT clear SmartScreen for the public — see docs/signing/ + CPE-002.
      - name: Detect Windows signing cert (CPE-1131)
        id: wincert
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ -n "$PFX" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Windows code signing (CPE-1131 — self-signed)
        if: steps.wincert.outputs.has == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cpe-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $sec = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          Remove-Item $pfx -Force
          # Patch bundle.windows in tauri.conf.json (runner-only; never committed) so tauri-action signs.
          # Read AND write through an explicit BOM-less UTF-8 encoder (CPE-1842; same fix and same
          # reasoning as CPE-1834 in scripts/release.ps1). tauri.conf.json is BOM-less UTF-8 and
          # carries non-ASCII (an em dash in plugins.cli.description), so a codec that depends on the
          # host's defaults is a live hazard: bare `Get-Content -Raw` misdecodes it as the system ANSI
          # code page and `Set-Content -Encoding utf8` prepends a BOM on Windows PowerShell 5.1 — the
          # exact shape the repo's mojibake guard exists to catch. pwsh 7 happens to default to
          # BOM-less UTF-8 on both ends, which is why this has survived so far; that is a default, not
          # a guarantee, and it flips the moment this step runs under `shell: powershell`, an older
          # image, or a different locale. Being explicit costs nothing and holds on every host.
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $conf = 'src-tauri/tauri.conf.json'
          $confPath = (Resolve-Path $conf).Path
          $j = [System.IO.File]::ReadAllText($confPath, $utf8NoBom) | ConvertFrom-Json
          if ($null -eq $j.bundle.windows) {
            $j.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{}) -Force
          }
          $j.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $j.bundle.windows | Add-Member -NotePropertyName digestAlgorithm      -NotePropertyValue 'sha256' -Force
          $j.bundle.windows | Add-Member -NotePropertyName timestampUrl         -NotePropertyValue 'http://timestamp.digicert.com' -Force
          [System.IO.File]::WriteAllText($confPath, ($j | ConvertTo-Json -Depth 40), $utf8NoBom)
          Write-Host "Windows self-signed signing enabled (thumbprint $($cert.Thumbprint))."

      # CPE-1872 round-2 security-audit finding 3: latest.json has no .gitignore rule and nothing
      # forbids committing one at the repo root. tauri-action writes latest.json to its own cwd
      # (resolve(process.cwd(), 'latest.json') — see the comment on the verify job below) and SKIPS
      # writing one at all when it finds no updater .sig artifacts ("Signature not found for the
      # updater JSON. Skipping upload..."), which today is fail-closed — no manifest, nothing to
      # (falsely) trust. A stray committed latest.json at the repo root would survive actions/checkout
      # and turn that fail-closed behavior into a silent pass over a file nobody just built. Removing
      # any pre-existing copy immediately before tauri-action runs guarantees whatever tauri-action
      # itself writes (or doesn't) is the only thing anything downstream can ever see.
      - name: Remove any stray latest.json before the build writes its own (CPE-1872)
        run: rm -f latest.json

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing — generate with `npm run tauri signer generate`
          # and store the outputs as repository secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- OS code signing — see CPE-002 (currently Blocked on certificates) ---
          #
          # Leave these commented until the certificates actually exist. Setting them
          # to empty secrets makes the signing step fail rather than skip, which would
          # break a currently-working release build.
          #
          # macOS (requires Apple Developer Program membership):
          #   APPLE_CERTIFICATE           — base64 of the .p12 Developer ID cert
          #   APPLE_CERTIFICATE_PASSWORD  — password for that .p12
          #   APPLE_SIGNING_IDENTITY      — e.g. "Developer ID Application: Name (TEAMID)"
          #   APPLE_ID / APPLE_PASSWORD   — Apple ID + app-specific password (notarization)
          #   APPLE_TEAM_ID               — 10-char team ID
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          #
          # Windows (requires an OV or EV Authenticode certificate):
          #   Windows signing is configured in src-tauri/tauri.conf.json under
          #   bundle.windows (certificateThumbprint + digestAlgorithm + timestampUrl),
          #   with the cert installed on the runner — NOT via env vars here.
          #   EV certs are typically hardware/HSM-bound, which usually means a
          #   cloud-signing service or a self-hosted runner.
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cross-Platform Explorer ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # Emit the updater manifest consumed by tauri.conf.json endpoints.
          includeUpdaterJson: true

  # CPE-1058, redesigned by CPE-1872's round-2 security audit — verify the PUBLISHED updater manifest,
  # once, after the whole release matrix finishes, instead of each matrix leg checking its own local
  # build output.
  #
  # Why a per-leg check couldn't be trusted (finding 1, HIGH): tauri-action's own upload-version-json.ts
  # downloads the EXISTING latest.json release asset and seeds versionContent.platforms from it before
  # merging in what THIS runner built — so the manifest that actually ships is the UNION of all three
  # matrix legs' platforms, and no single leg's local src-tauri/target ever contains every platform the
  # manifest names. The old per-leg step's "skip verification for any platform I don't have locally, then
  # declare success once at least one signature checked" is exactly the hole a smuggled platform entry
  # (an honest platform plus a bogus one pointing at an attacker-controlled URL, signed by a different
  # key) walked straight through — independently reproduced at EXIT=0 by the security auditor and, again,
  # locally against this repo's own fixtures (see crates/updater-verify/tests/release_guard.rs,
  # smuggled_extra_platform_is_rejected). lib.rs's verify_update_manifest now hard-fails any platform it
  # can't fetch rather than skipping it, which makes a partial, per-leg view of the manifest USELESS for
  # anything but a false negative — so this job checks the real thing instead of a fragment of it.
  #
  # This is option (a) of the two the ticket allowed ("a post-matrix job that downloads the draft's
  # latest.json plus every asset it references and verifies all platforms" vs. "--expect-platforms driven
  # from the matrix leg"). Chosen over (b) because it verifies the actual bytes a real updater will fetch
  # — the manifest AS PUBLISHED, from the release itself — rather than trusting each leg's belief about
  # which platforms the eventual union will contain, which is exactly the belief that was wrong before.
  # It also closes finding 2 (basename collisions in a dirty --search dir) as a side effect: every asset
  # is downloaded fresh into an empty directory, so there is nothing stale for a basename to collide with.
  verify-published-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./crates/updater-verify -> target"

      # Guarded by the signing-key secret, mirroring the OS-code-signing/catalog pattern elsewhere in
      # this file, so fork/PR runs (and any run where updater signing isn't configured) stay green
      # instead of failing on a manifest that was never signed in the first place.
      - name: Detect updater signing key
        id: sig
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      # Download the manifest that is ACTUALLY on the draft release, plus every asset any platform
      # entry's `url` names — not `--pattern '*'` (which would silently succeed on a manifest naming an
      # asset that was somehow never uploaded); downloading each referenced name individually makes a
      # missing asset a loud `gh` failure here rather than a quietly-smaller verified set downstream.
      - name: Download the published manifest + every asset it references
        if: steps.sig.outputs.has == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          gh release download "$TAG" --pattern 'latest.json' --dir release-assets --clobber
          names=$(jq -r '.platforms[].url' release-assets/latest.json | sed 's#.*/##' | sort -u)
          if [ -z "$names" ]; then
            echo "::error::latest.json on the draft release names no platform urls -- nothing to verify"
            exit 1
          fi
          echo "assets referenced by the published manifest:"
          echo "$names"
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            gh release download "$TAG" --pattern "$name" --dir release-assets --clobber
          done <<< "$names"

      # Requires EVERY platform the published manifest names to fetch and verify, per lib.rs's stricter
      # (CPE-1872) semantics — `verify-release-artifacts` cannot report success on a partial check
      # anymore, so there is no separate "--require-all-platforms" flag to remember to pass.
      - name: Verify the published manifest + signatures (CPE-1058)
        if: steps.sig.outputs.has == 'true'
        shell: bash
        run: |
          cargo run --manifest-path crates/updater-verify/Cargo.toml --release --bin verify-release-artifacts -- \
            --conf src-tauri/tauri.conf.json \
            --manifest release-assets/latest.json \
            --search release-assets

  # Sign + publish the agent-catalog bundle next to the installer (CPE-377/308), so the AI Console
  # can refresh its agent roster without an app release. Runs once, after the installers. Guarded by
  # the signing-key secret so it SKIPS (never fails) on repos that haven't set up catalog signing —
  # exactly like the OS-code-signing pattern above.
  catalog:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect catalog signing key
        id: k
        env:
          KEY: ${{ secrets.CPE_CATALOG_SIGNING_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Install Rust toolchain
        if: steps.k.outputs.has == 'true'
        uses: dtolnay/rust-toolchain@stable

      # The host crate's Linux keyring backend (CPE-322) links libdbus, so building any host
      # binary on Linux — including catalog-sign — needs it.
      # CPE-1824: same hardening as the release job's apt-get site above -- no `continue-on-error`
      # here either, so an unbounded hang previously rode to the job's 360-minute default instead
      # of failing fast.
      - name: Install libdbus (host crate's Linux keyring dep)
        if: steps.k.outputs.has == 'true'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y libdbus-1-dev pkg-config

      - name: Build + sign the catalog bundle
        if: steps.k.outputs.has == 'true'
        env:
          # A 32-byte ed25519 seed (hex). Generate once; its public key goes in CATALOG_TRUSTED_KEYS.
          CPE_CATALOG_SIGNING_KEY: ${{ secrets.CPE_CATALOG_SIGNING_KEY }}
        run: |
          VERSION=$(date +%s)   # monotonic across releases → anti-rollback (CPE-372)
          cargo run --release --quiet --manifest-path sidecar/host/Cargo.toml --bin catalog-sign -- \
            sidecar/ai-console/agents catalog-out "$VERSION"

      - name: Upload catalog assets to the release
        if: steps.k.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" catalog-out/* --clobber
