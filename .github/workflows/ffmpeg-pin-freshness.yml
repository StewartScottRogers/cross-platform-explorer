name: ffmpeg/pdfium pin freshness check

# Scheduled canary for CPE-1762 (split out as CPE-1763). BtbN/FFmpeg-Builds publishes a fresh
# autobuild-<date> release daily and PRUNES old ones, so FFMPEG_BUILD_TAG/FFMPEG_BUILD_VER in
# release-sidecar.yml rot -- silently, until the next release-sidecar run 404s on the download
# (exactly what happened on 2026-08-15: the pinned asset was gone and all three OS release legs
# failed, blocking release 0.57.66). This job HEAD-checks the EXACT asset URLs release-sidecar.yml
# downloads, on a schedule, so a rotted pin turns into a ticket with days of runway instead of a
# release-day surprise. Scheduled GitHub Actions workflows auto-disable after 60 days without any
# repo activity -- not a concern here (this repo pushes daily), but worth knowing if it ever goes
# quiet on a dormant fork.
#
# ── Cadence: weekly, Mondays 07:00 UTC ───────────────────────────────────────────────────────────
# Was twice weekly (Mondays + Thursdays) while release-sidecar.yml's pin was a rolling DAILY
# autobuild. Measured 2026-08-19 (`gh api repos/BtbN/FFmpeg-Builds/releases --paginate`): BtbN keeps
# TWO retention classes, not one -- ~14 rolling DAILY autobuilds it prunes on a ~14-day window, then
# one MONTH-END anchor per month retained indefinitely (~23 of them, back to 2024-09). A freshly-set
# DAILY pin has ~14 days of runway, not weeks, and a once-weekly check would give only two chances
# to catch that -- worst case ~6 days' notice. That was this check's situation until CPE-1789
# repinned to a month-end anchor, which does not rot on any known schedule (verified: an anchor ~23
# months old still returns 200). CPE-1796 went further and added a mechanical CI guard (ci.yml,
# "ffmpeg pin is a month-end anchor") that rejects a PR that repins to a daily in the first place --
# so by default there is no rotting clock running against the pin this check watches at all anymore.
# Weekly now is a general safety net (upstream unexpectedly deleting an anchor, or some other
# surprise) rather than a race against a known pruning date, so once-weekly's worse-case ~6-day
# notice is no longer the risk it used to be. The one case that still carries the old ~14-day
# runway -- a deliberate `FFMPEG_BUILD_TAG_OVERRIDE_REASON` daily override (see release-sidecar.yml
# and the CI guard) -- is rare and self-documenting; run this workflow manually (workflow_dispatch)
# during that window rather than tightening the schedule for everyone to cover it.
#
# ── Staleness check: exact-URL reachability, not an age heuristic -- with a THIRD verdict ───────
# Each check is a HEAD request against the SAME URL release-sidecar.yml's "Stage native deps" step
# downloads. A 200 means that step would succeed today. A 404 means the asset is genuinely gone --
# that's "stale", the only verdict that ever files an issue. Anything else (a transport failure,
# 403, 429, 5xx -- lumped together as "000" by curl on a connect-level failure) is "inconclusive":
# it does NOT mean the pin rotted, so it must never file a stale-pin issue against a healthy pin,
# but it also must not be swallowed as a quiet pass -- the job fails loudly instead (see "HEAD-check
# pinned assets" below). `curl --retry` only retries connection-level failures, never an HTTP status
# already received, so a real 404 is never retried away and a real 200 is never manufactured.
# bblanchon/pdfium-binaries was confirmed NOT to prune (418 releases live back to chromium/3218,
# years old) before adding its checks -- a safety net, not expected to legitimately fire.
#
# ── No second copy of the pin, INCLUDING the filename suffix ────────────────────────────────────
# FFMPEG_BUILD_TAG/FFMPEG_BUILD_VER/PDFIUM_TAG are extracted FROM release-sidecar.yml's "Stage
# native deps" env: block at run time (grep), not retyped here -- rename/reformat that block and
# "Extract pins" fails loudly instead of silently checking stale values forever. The asset URLs
# themselves are ALSO not reassembled from parts: the "-lgpl-8.1" filename suffix rotates with
# ffmpeg's release line (traced live: -lgpl-8.0 in Jan 2026 tags, -lgpl-8.1 by Jul 2026), so a
# hand-typed URL template would keep asking for the OLD suffix forever after the next bump and file
# a PERMANENT false "stale" alarm against a perfectly healthy pin -- the exact failure this ticket
# exists to prevent. Instead, "Derive real asset URLs" pulls the actual `fetch "https://…"` lines
# out of release-sidecar.yml and expands them with the extracted pins via `envsubst`, so there is
# structurally nothing left here to retype or drift.
#
# ── Recommending the right release line, and proving the recommendation resolves (CPE-1795) ─────
# A single BtbN autobuild tag ships THREE parallel ffmpeg release lines as separate asset sets (e.g.
# a bare -lgpl master snapshot, -lgpl-7.1, -lgpl-8.1), each with its own filename suffix. Grepping
# for "the first -linux64-lgpl-*.tar.xz asset" picks whichever line happens to sort first -- not
# necessarily the line release-sidecar.yml is pinned to -- and composing that version with
# release-sidecar.yml's real suffix (extracted, never hand-typed) produces a URL for an asset that
# does not exist. "Determine current live tags to recommend" now filters the live release's assets to
# the SAME suffix "Extract pins" pulled from release-sidecar.yml, so the recommended version and the
# suffix it will be combined with are two views of the one release line already in use, not
# independently chosen. On top of that, "Validate the recommendation before publishing it" HEAD-checks
# the exact URL that recommendation builds -- the same way the pin above is checked -- and withholds
# a tag/version from the filed issue rather than publish one that itself 404s. Both bugs (wrong line,
# unvalidated advice) were found the same way: constructing the recommended URL and a HEAD request
# against it, by hand, after trusting a human-written ticket over this workflow's own output.
#
# ── Notification: a GitHub issue AND a red run, not a red badge alone ────────────────────────────
# Nobody watches the Actions tab for a job that only exists to check dates -- a red scheduled run
# would sit unseen the same way the rotted pin itself did before CPE-1762. On a confirmed 404 this
# files a GitHub issue (gh issue create, default GITHUB_TOKEN, issues:write -- no extra secrets)
# naming the URL, the HTTP status, and the current live tag to bump to, which shows up in the
# repo's Issues tab/notifications. `Ticketing/wiki.md` ("External findings") now documents the
# intake: the Foreman checks open issues at the start of each sprint and files a CPE-NNN ticket
# for each one, then closes the issue. Deduped against any already-open `dep-pin-stale`-labeled
# issue -- a repeat run comments on the existing issue with the current findings instead of filing
# a duplicate, so it doesn't refile every run while it's unfixed. The step still exits 1 either way
# (new issue or comment-on-existing), so the run ALSO goes red as a backstop for as long as the pin
# stays broken -- the issue is the primary signal, the red run is the fallback if nobody is watching
# Issues either.

on:
  workflow_dispatch:
    inputs:
      override_ffmpeg_build_tag:
        description: >-
          Test hook (CPE-1763): override FFMPEG_BUILD_TAG instead of reading it from
          release-sidecar.yml, to dry-run the stale-pin path without touching the real pin.
          Leave empty for a normal run.
        required: false
        type: string
  schedule:
    - cron: "0 7 * * 1" # weekly, Mondays 07:00 UTC -- see cadence note above

permissions:
  contents: read
  issues: write

env:
  RELEASE_SIDECAR_YML: .github/workflows/release-sidecar.yml

jobs:
  check-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # sum of every step's own timeout (5x5=25, incl. CPE-1795's validate step) plus slack for local steps
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5

      - name: Extract pins from release-sidecar.yml (no second copy)
        id: pins
        env:
          OVERRIDE_FFMPEG_BUILD_TAG: ${{ inputs.override_ffmpeg_build_tag }}
        run: |
          set -euo pipefail
          extract() {
            local key="$1"
            local val
            val=$(grep -oP "^\s*${key}:\s*\"\K[^\"]+" "$RELEASE_SIDECAR_YML" | head -1)
            if [ -z "$val" ]; then
              # >&2 is load-bearing: this is called as `x="$(extract KEY)"`, and a command
              # substitution captures ONLY stdout. Anything written to stdout here (an unredirected
              # echo included) is swallowed into the variable instead of reaching the log, which
              # would make this failure print nothing at all -- the opposite of "fails loudly".
              echo "::error::could not extract ${key} from ${RELEASE_SIDECAR_YML} -- its env: block" \
                   "moved or was reformatted, so this check can no longer see the real pin. Fix the" \
                   "extraction in ffmpeg-pin-freshness.yml before trusting this workflow again." >&2
              exit 1
            fi
            printf '%s' "$val"
          }
          ffmpeg_build_tag="$(extract FFMPEG_BUILD_TAG)"
          ffmpeg_build_ver="$(extract FFMPEG_BUILD_VER)"
          pdfium_tag="$(extract PDFIUM_TAG)"

          # CPE-1795: the ffmpeg filename suffix (e.g. "8.1") ties an asset to its release line, and
          # like FFMPEG_BUILD_TAG/VER above it is NOT retyped here -- it's pulled straight from
          # release-sidecar.yml's own linux64 fetch line. A single BtbN autobuild tag ships several
          # parallel ffmpeg release lines (a bare -lgpl master snapshot, -lgpl-7.1, -lgpl-8.1, ...) as
          # separate asset sets; "Determine current live tags to recommend" below uses this suffix to
          # pick the SAME release line release-sidecar.yml already pins, instead of grabbing whichever
          # asset sorts first -- the bug this ticket exists to fix.
          # Uniqueness-checked the same way match_for() below checks fetch-URL matches: `| head -1`
          # alone would silently pick whichever line sorts first if this pattern ever matched twice
          # (even a stray comment) -- the exact "first match wins" failure shape this ticket exists
          # to close, one step earlier than where the recommendation itself is built.
          ffmpeg_suffix_matches=$(grep -oP 'linux64-lgpl-\K[0-9.]+(?=\.tar\.xz)' "$RELEASE_SIDECAR_YML" || true)
          ffmpeg_suffix_count=$(printf '%s\n' "$ffmpeg_suffix_matches" | grep -c . || true)
          if [ "$ffmpeg_suffix_count" != "1" ]; then
            echo "::error::expected exactly one ffmpeg linux64 lgpl suffix (e.g. '8.1') in" \
                 "${RELEASE_SIDECAR_YML}, found ${ffmpeg_suffix_count} -- its fetch line moved," \
                 "was reformatted, or gained a second reference. Fix the extraction in" \
                 "ffmpeg-pin-freshness.yml before trusting this workflow again." >&2
            exit 1
          fi
          ffmpeg_suffix="$ffmpeg_suffix_matches"

          # Test hook (CPE-1763): a manual dispatch can override the extracted ffmpeg tag to dry-run
          # the stale-pin path (e.g. against the known-pruned autobuild-2026-08-01-13-21) without
          # ever touching the real pin in release-sidecar.yml. Empty on every scheduled run.
          override="${OVERRIDE_FFMPEG_BUILD_TAG:-}"
          if [ -n "$override" ]; then
            echo "::notice::override_ffmpeg_build_tag set -- using '${override}' instead of the real pin '${ffmpeg_build_tag}' (test run only)"
            ffmpeg_build_tag="$override"
          fi
          echo "ffmpeg_build_tag=${ffmpeg_build_tag}" >> "$GITHUB_OUTPUT"
          echo "ffmpeg_build_ver=${ffmpeg_build_ver}" >> "$GITHUB_OUTPUT"
          echo "pdfium_tag=${pdfium_tag}" >> "$GITHUB_OUTPUT"
          echo "ffmpeg_suffix=${ffmpeg_suffix}" >> "$GITHUB_OUTPUT"
          echo "extracted from ${RELEASE_SIDECAR_YML}:"
          echo "  FFMPEG_BUILD_TAG=${ffmpeg_build_tag}"
          echo "  FFMPEG_BUILD_VER=${ffmpeg_build_ver}"
          echo "  PDFIUM_TAG=${pdfium_tag}"
          echo "  ffmpeg suffix (release line)=${ffmpeg_suffix}"

      # CPE-1763 review finding (blocker #2): do not reassemble asset URLs from parts with a
      # hand-typed filename suffix. Pull release-sidecar.yml's own `fetch "https://…"` lines and
      # expand them with the extracted pins via envsubst, so the suffix can never drift out of sync.
      - name: Derive real asset URLs from release-sidecar.yml (no second copy)
        id: urls
        env:
          FFMPEG_BUILD_TAG: ${{ steps.pins.outputs.ffmpeg_build_tag }}
          FFMPEG_BUILD_VER: ${{ steps.pins.outputs.ffmpeg_build_ver }}
          PDFIUM_TAG: ${{ steps.pins.outputs.pdfium_tag }}
        run: |
          set -euo pipefail
          export FFMPEG_BUILD_TAG FFMPEG_BUILD_VER PDFIUM_TAG
          if ! command -v envsubst >/dev/null 2>&1; then
            echo "::error::envsubst not found on this runner -- cannot safely expand the fetch URL templates from ${RELEASE_SIDECAR_YML}" >&2
            exit 1
          fi

          match_for() {
            local needle="$1"
            local matches count
            matches=$(grep -oP 'fetch "\Khttps://[^"]+' "$RELEASE_SIDECAR_YML" | grep -F "$needle" || true)
            count=$(printf '%s\n' "$matches" | grep -c . || true)
            if [ "$count" != "1" ]; then
              echo "::error::expected exactly one fetch URL containing '${needle}' in ${RELEASE_SIDECAR_YML}, found ${count} -- its download step was restructured; update the extraction in ffmpeg-pin-freshness.yml to match" >&2
              exit 1
            fi
            printf '%s' "$matches"
          }
          url_for() {
            match_for "$1" | envsubst
          }

          {
            echo "ffmpeg_win64_url=$(url_for 'win64-lgpl')"
            echo "ffmpeg_linux64_url=$(url_for 'linux64-lgpl')"
            echo "pdfium_win64_url=$(url_for 'pdfium-win-x64.tgz')"
            echo "pdfium_linux64_url=$(url_for 'pdfium-linux-x64.tgz')"
            echo "pdfium_macos_url=$(url_for 'pdfium-mac-arm64.tgz')"
            # CPE-1795: raw (unexpanded, still containing literal ${FFMPEG_BUILD_TAG}/${FFMPEG_BUILD_VER})
            # templates, reused by "Validate the recommendation before publishing it" below to build
            # the SAME URLs against a CANDIDATE tag/version before ever recommending it -- one
            # template, two expansions (the current pin above, the recommended pin later), never a
            # second hand-typed copy of the suffix.
            echo "ffmpeg_win64_url_tmpl=$(match_for 'win64-lgpl')"
            echo "ffmpeg_linux64_url_tmpl=$(match_for 'linux64-lgpl')"
          } >> "$GITHUB_OUTPUT"

      - name: HEAD-check pinned assets
        id: check
        timeout-minutes: 5
        env:
          FFMPEG_WIN64_URL: ${{ steps.urls.outputs.ffmpeg_win64_url }}
          FFMPEG_LINUX64_URL: ${{ steps.urls.outputs.ffmpeg_linux64_url }}
          PDFIUM_WIN64_URL: ${{ steps.urls.outputs.pdfium_win64_url }}
          PDFIUM_LINUX64_URL: ${{ steps.urls.outputs.pdfium_linux64_url }}
          PDFIUM_MACOS_URL: ${{ steps.urls.outputs.pdfium_macos_url }}
        run: |
          set -uo pipefail # not -e: every asset must be checked even if an earlier one is bad
          not_found=""
          inconclusive=""

          head_check() {
            local label="$1" url="$2"
            local code
            # --retry (connection-level failures only -- refused/reset/timeout -- NEVER an HTTP
            # status already received, so a real 404 is never retried into a false pass, and a
            # transient 000/403/5xx is given a few chances to resolve itself before we count it).
            # --max-time bounds each attempt so a single hung attempt can't chain into the step's
            # 5-minute timeout on its own.
            code=$(curl -sSL --max-time 30 --retry 3 --retry-delay 2 --retry-connrefused \
              -o /dev/null -w '%{http_code}' --head "$url")
            echo "  ${label}: HTTP ${code} (${url})"
            case "$code" in
              200) ;;
              404) not_found="${not_found}- **${label}**: HTTP 404 (asset not found) - ${url}\n" ;;
              *) inconclusive="${inconclusive}- **${label}**: HTTP ${code} - ${url}\n" ;;
            esac
          }

          echo "--- ffmpeg (BtbN/FFmpeg-Builds) ---"
          head_check "ffmpeg win64" "$FFMPEG_WIN64_URL"
          head_check "ffmpeg linux64" "$FFMPEG_LINUX64_URL"

          echo "--- pdfium (bblanchon/pdfium-binaries) ---"
          # Checking all three platform archives now that deriving each URL is free (blocker #2
          # fix) -- they still share one tag/release, so this is belt-and-suspenders, not a second
          # independent signal.
          head_check "pdfium win64" "$PDFIUM_WIN64_URL"
          head_check "pdfium linux64" "$PDFIUM_LINUX64_URL"
          head_check "pdfium macos" "$PDFIUM_MACOS_URL"

          # Inconclusive beats stale: a 403/429/5xx/000 is not evidence the pin rotted, and must
          # never file a stale-pin issue -- but it also must not read as a silent "all fresh" pass,
          # so the job fails loudly here instead.
          if [ -n "$inconclusive" ]; then
            echo "::error::could not conclusively verify one or more pinned assets (non-200, non-404 status -- looks like a transient network/CDN/rate-limit issue, NOT necessarily a rotted pin):"
            echo -e "$inconclusive"
            echo "::error::not filing a stale-pin issue on an ambiguous status. Re-run this workflow (workflow_dispatch) to confirm before trusting a future green run's silence."
            exit 1
          fi

          if [ -n "$not_found" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
            {
              echo "failures<<PINFAIL_EOF"
              echo -e "$not_found"
              echo "PINFAIL_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "::warning::one or more pinned native-dep assets returned 404 (not found) -- see the failures list"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "all pinned assets reachable -- nothing to report"
          fi

      # Only spend extra API calls figuring out what to recommend when there's actually something
      # to report -- the quiet (fresh-pin) path above never reaches this step.
      - name: Determine current live tags to recommend
        id: live
        if: steps.check.outputs.stale == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          FFMPEG_SUFFIX: ${{ steps.pins.outputs.ffmpeg_suffix }}
        run: |
          set -uo pipefail
          # Recommend the newest MONTH-END anchor, not the newest daily: BtbN retains anchors
          # indefinitely but prunes dailies on a ~14-day rolling window, so a daily recommended
          # today could itself be gone by the time someone reads the issue and acts on it days
          # later -- "restarting the exact cycle this ticket exists to stop" (review finding).
          # Walk the tag list (already newest-first) and take the first tag `is_ffmpeg_anchor_tag`
          # (CPE-1796) calls an anchor -- the SAME rule the ci.yml pin-shape guard asserts against
          # release-sidecar.yml's current pin, sourced from one file so there is only one copy of
          # "what counts as an anchor" to ever get out of sync.
          source .github/workflows/scripts/ffmpeg-anchor-check.sh
          ffmpeg_live_tag=""
          for t in $(gh api repos/BtbN/FFmpeg-Builds/releases --paginate \
                       -q '[.[] | select(.tag_name | startswith("autobuild"))][].tag_name' 2>/dev/null); do
            if is_ffmpeg_anchor_tag "$t"; then
              ffmpeg_live_tag="$t"
              break
            fi
          done
          ffmpeg_live_ver=""
          if [ -n "$ffmpeg_live_tag" ]; then
            # CPE-1795: filter to the SAME release-line suffix release-sidecar.yml is already pinned
            # to (extracted in "Extract pins" above, e.g. "8.1") -- not just the first -lgpl-* asset
            # that matches. A single autobuild tag ships several parallel ffmpeg release lines (a bare
            # -lgpl master snapshot, -lgpl-7.1, -lgpl-8.1, ...) as separate asset sets, and grabbing
            # whichever sorts first recommends a version whose filename suffix release-sidecar.yml was
            # never updated to match -- producing a URL that 404s. This is exactly the bug that broke
            # a release when someone followed this check's advice.
            ffmpeg_suffix_re=$(printf '%s' "$FFMPEG_SUFFIX" | sed 's/\./\\./g')
            ffmpeg_live_ver=$(gh api "repos/BtbN/FFmpeg-Builds/releases/tags/${ffmpeg_live_tag}" \
              -q '.assets[].name' 2>/dev/null \
              | grep -oP "ffmpeg-\K.+(?=-linux64-lgpl-${ffmpeg_suffix_re}\.tar\.xz)" | head -1 || true)
          fi
          pdfium_live_tag=$(gh api repos/bblanchon/pdfium-binaries/releases/latest \
            -q '.tag_name' 2>/dev/null || true)

          # CPE-1792: these fallbacks are assigned with plain `if` statements, NOT with
          # `${var:-prose}`. Inside a `${parameter:-word}` expansion the `word` is still parsed for
          # quoting even when the whole expansion sits inside double quotes -- so an apostrophe in
          # ordinary English ("the release's asset name") opens a single-quoted section that never
          # closes, and bash fails to parse the rest of the script with
          # `unexpected EOF while looking for matching '"'"''`. That is exactly what happened on the
          # first live run of the stale path (run 32326260348): staleness was detected correctly and
          # then this step died before the issue could be filed. DO NOT move these back inline.
          if [ -z "$ffmpeg_live_tag" ]; then
            ffmpeg_live_tag="<could not determine -- query repos/BtbN/FFmpeg-Builds/releases manually; pick a month-end anchor tag, not a rolling daily -- see this workflow's cadence comment>"
          fi
          if [ -z "$ffmpeg_live_ver" ]; then
            ffmpeg_live_ver="<could not determine -- read it off the -linux64-lgpl-${FFMPEG_SUFFIX}.tar.xz asset name, on the release line release-sidecar.yml already pins>"
          fi
          if [ -z "$pdfium_live_tag" ]; then
            pdfium_live_tag="<could not query bblanchon/pdfium-binaries -- check manually>"
          fi

          echo "ffmpeg_live_tag=${ffmpeg_live_tag}" >> "$GITHUB_OUTPUT"
          echo "ffmpeg_live_ver=${ffmpeg_live_ver}" >> "$GITHUB_OUTPUT"
          echo "pdfium_live_tag=${pdfium_live_tag}" >> "$GITHUB_OUTPUT"

      # CPE-1795: this is the fix's second half. Picking the right release line (above) closes the
      # bug that actually shipped; this step is the backstop for the NEXT variant of it -- it
      # HEAD-checks the URL this workflow is about to recommend, using the exact same fetch-line
      # templates "HEAD-check pinned assets" used for the CURRENT pin (only the tag/version expanded
      # into them differ). A recommendation that itself 404s is worse than no recommendation: a human
      # trusts it, repins, and breaks the very release build this workflow exists to protect. Refuse
      # to publish an unvalidated one.
      #
      # Review finding: an earlier version of this step treated ANY non-200 (a confirmed 404, a
      # transient 403/429/5xx, or curl's connect-level "000") as equally "unverified" -- exactly the
      # "inconclusive != a confirmed problem" conflation "HEAD-check pinned assets" above already
      # guards against for the CURRENT pin, just moved one level downstream to the recommendation.
      # Mirrors that step's 200/404/inconclusive classification instead: a confirmed 404 withholds
      # the recommendation with a "this candidate is wrong" message; an inconclusive result fails
      # this step loudly (mirroring the sibling exactly) but "File an issue" below still runs
      # (`if: always()`) because the CURRENT pin's staleness is a separately-confirmed fact that a
      # rate limit while checking the *candidate* must never suppress -- it instead publishes a
      # clearly-labeled "could not confirm, re-run before trusting" note, never a confident-and-wrong
      # or a confident-and-silent one.
      - name: Validate the recommendation before publishing it
        id: validate
        if: steps.check.outputs.stale == 'true'
        timeout-minutes: 5
        env:
          FFMPEG_BUILD_TAG: ${{ steps.live.outputs.ffmpeg_live_tag }}
          FFMPEG_BUILD_VER: ${{ steps.live.outputs.ffmpeg_live_ver }}
          FFMPEG_WIN64_URL_TMPL: ${{ steps.urls.outputs.ffmpeg_win64_url_tmpl }}
          FFMPEG_LINUX64_URL_TMPL: ${{ steps.urls.outputs.ffmpeg_linux64_url_tmpl }}
        run: |
          set -uo pipefail
          export FFMPEG_BUILD_TAG FFMPEG_BUILD_VER
          verified="true"
          inconclusive="false"
          not_found_note=""
          inconclusive_note=""

          if [[ "$FFMPEG_BUILD_TAG" == "<could not determine"* || -z "$FFMPEG_BUILD_TAG" \
             || "$FFMPEG_BUILD_VER" == "<could not determine"* || -z "$FFMPEG_BUILD_VER" ]]; then
            verified="false"
            not_found_note="the live ffmpeg tag/version could not be determined upstream -- see the run log above\n"
          else
            win64_url=$(printf '%s' "$FFMPEG_WIN64_URL_TMPL" | envsubst)
            linux64_url=$(printf '%s' "$FFMPEG_LINUX64_URL_TMPL" | envsubst)
            for entry in "win64 ${win64_url}" "linux64 ${linux64_url}"; do
              label=${entry%% *}
              url=${entry#* }
              code=$(curl -sSL --max-time 30 --retry 3 --retry-delay 2 --retry-connrefused \
                -o /dev/null -w '%{http_code}' --head "$url")
              echo "  recommended ffmpeg ${label}: HTTP ${code} (${url})"
              # Same three-way split as "HEAD-check pinned assets" above: 200 fine, 404 a CONFIRMED
              # problem with this candidate, anything else inconclusive (never treated as a
              # confirmed problem, never silently swallowed either).
              case "$code" in
                200) ;;
                404)
                  verified="false"
                  not_found_note="${not_found_note}recommended ffmpeg ${label} asset confirmed missing: HTTP 404 - ${url}\n"
                  ;;
                *)
                  verified="false"
                  inconclusive="true"
                  inconclusive_note="${inconclusive_note}recommended ffmpeg ${label} check was inconclusive: HTTP ${code} - ${url}\n"
                  ;;
              esac
            done
          fi

          echo "verified=${verified}" >> "$GITHUB_OUTPUT"
          echo "inconclusive=${inconclusive}" >> "$GITHUB_OUTPUT"
          {
            echo "not_found_note<<RECNOTFOUND_EOF"
            echo -e "$not_found_note"
            echo "RECNOTFOUND_EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "inconclusive_note<<RECINCONCLUSIVE_EOF"
            echo -e "$inconclusive_note"
            echo "RECINCONCLUSIVE_EOF"
          } >> "$GITHUB_OUTPUT"

          if [ "$inconclusive" = "true" ]; then
            echo "::error::could not conclusively verify the recommended ffmpeg asset(s) (non-200, non-404 status -- looks like a transient network/CDN/rate-limit issue, NOT evidence the recommendation is wrong):"
            echo -e "$inconclusive_note"
            echo "::error::not treating this as a confirmed-bad recommendation. The filed issue will say so and ask for a re-run -- see 'File an issue' below, which still runs despite this step failing."
            exit 1
          elif [ "$verified" != "true" ]; then
            echo "::warning::the recommended ffmpeg tag/version failed its own pre-publish HEAD-check (confirmed 404, or could not be determined) -- withholding it from the issue"
          fi

      # `if: always()` is load-bearing: "Validate the recommendation" above intentionally exits 1 on
      # an inconclusive HEAD-check (mirroring "HEAD-check pinned assets"'s fail-loud convention), but
      # the CURRENT pin's staleness was already confirmed (not inconclusive) by that earlier step --
      # a rate limit while checking the *candidate* replacement must never suppress the notification
      # about the pin that is ALREADY confirmed broken. Without always() here, GitHub Actions would
      # skip this step whenever validate fails, silently dropping the primary "file an issue" signal
      # -- the exact swallowed-notification failure mode CPE-1763's design note above warns against.
      - name: File an issue (deduped) so a human sees it
        if: always() && steps.check.outputs.stale == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURES: ${{ steps.check.outputs.failures }}
          FFMPEG_LIVE_TAG: ${{ steps.live.outputs.ffmpeg_live_tag }}
          FFMPEG_LIVE_VER: ${{ steps.live.outputs.ffmpeg_live_ver }}
          PDFIUM_LIVE_TAG: ${{ steps.live.outputs.pdfium_live_tag }}
          REC_VERIFIED: ${{ steps.validate.outputs.verified }}
          REC_INCONCLUSIVE: ${{ steps.validate.outputs.inconclusive }}
          REC_NOT_FOUND_NOTE: ${{ steps.validate.outputs.not_found_note }}
          REC_INCONCLUSIVE_NOTE: ${{ steps.validate.outputs.inconclusive_note }}
          FFMPEG_SUFFIX: ${{ steps.pins.outputs.ffmpeg_suffix }}
        run: |
          set -uo pipefail
          label="dep-pin-stale"
          gh label create "$label" \
            --color d93f0b \
            --description "A pinned native-dep download (ffmpeg/pdfium) in release-sidecar.yml has gone stale" \
            2>/dev/null || true # already exists -- fine

          # Built with printf (one call per line) rather than an indented heredoc: this step's shell
          # script is itself indented for YAML readability, and a heredoc would carry that
          # indentation into the issue body, where 4+ leading spaces reads as a markdown code block.
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body_file="$(mktemp)"
          {
            printf '%s\n\n' "The ffmpeg/pdfium pin freshness check (\`.github/workflows/ffmpeg-pin-freshness.yml\`, run [${GITHUB_RUN_ID}](${run_url})) found one or more pinned native-dep downloads used by \`release-sidecar.yml\` are no longer reachable:"
            echo -e "$FAILURES"
            if [ "$REC_VERIFIED" = "true" ]; then
              printf '\n%s\n' "Upstream's current live tag to bump to (HEAD-checked 200 on the SAME release line release-sidecar.yml already pins before this issue was filed; a stable month-end anchor, not a rolling daily -- see the workflow's cadence comment):"
              printf '%s\n' "- ffmpeg (BtbN/FFmpeg-Builds): tag \`${FFMPEG_LIVE_TAG}\`, version \`${FFMPEG_LIVE_VER}\`"
            elif [ "$REC_INCONCLUSIVE" = "true" ]; then
              # Distinct from the confirmed-404 branch below on purpose (review finding): this is NOT
              # evidence the candidate is wrong, only that checking it did not conclusively succeed --
              # conflating the two would be exactly the "confident and wrong" failure mode CPE-1795
              # exists to close, moved one level downstream from the pin to the recommendation.
              printf '\n%s\n' "**Could not confirm the ffmpeg recommendation** -- this is NOT a confirmed-bad candidate, just an inconclusive check (a transient network/CDN/rate-limit issue), so treat it as unconfirmed rather than wrong:"
              printf '%s\n' "$REC_INCONCLUSIVE_NOTE" | sed '/^$/d; s/^/- /'
              printf '%s\n' "Unconfirmed candidate: tag \`${FFMPEG_LIVE_TAG}\`, version \`${FFMPEG_LIVE_VER}\` -- it may well be correct. Re-run this workflow via workflow_dispatch to get a validated recommendation before trusting it."
            else
              printf '\n%s\n' "**Could not produce a validated ffmpeg recommendation** -- the automatically-derived tag/version was confirmed unusable (see below), so it is withheld rather than risk repeating CPE-1795 (a wrong recommendation once broke the very release this check protects):"
              printf '%s\n' "$REC_NOT_FOUND_NOTE" | sed '/^$/d; s/^/- /'
              printf '%s\n' "Check https://github.com/BtbN/FFmpeg-Builds/releases manually and pick a stable month-end anchor tag (not a rolling daily -- see the workflow's cadence comment) on the SAME release line release-sidecar.yml already pins (currently suffixed -lgpl-${FFMPEG_SUFFIX}). If that release line no longer exists upstream at all, moving to a different line is a deliberate human call, not this check's -- update BOTH release-sidecar.yml's suffix and this recommendation logic to match whichever line is chosen."
            fi
            printf '%s\n\n' "- pdfium (bblanchon/pdfium-binaries): \`${PDFIUM_LIVE_TAG}\`"
            printf '%s\n' "Update \`FFMPEG_BUILD_TAG\` / \`FFMPEG_BUILD_VER\` / \`PDFIUM_TAG\` in the \"Stage native deps\" step of \`.github/workflows/release-sidecar.yml\` (see CPE-1762, and CPE-1789 for the anchor re-pin that fixed this once already). Whatever tag you pick, it must be a month-end anchor, not a rolling daily -- BtbN prunes dailies on a ~14-day window, so a daily pin here restarts this exact cycle, and ci.yml's \"ffmpeg pin is a month-end anchor\" guard (CPE-1796) will reject the PR unless FFMPEG_BUILD_TAG_OVERRIDE_REASON is deliberately set. Then re-run this workflow via workflow_dispatch to confirm the new pin is reachable before it blocks a release."
            printf '\n%s\n' "Filed automatically by CPE-1763. Please convert to a CPE-NNN ticket on triage (see Ticketing/wiki.md, \"External findings\")."
          } > "$body_file"

          existing=$(gh issue list --state open --label "$label" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            # Comment with the CURRENT findings rather than silently doing nothing: the failure set
            # can change between runs (e.g. ffmpeg alone, then pdfium too), and a label-only dedupe
            # that never updates the issue would swallow that (review finding).
            echo "an open issue already tracks this (#$existing) -- commenting with current findings instead of filing a duplicate"
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create \
              --title "ffmpeg/pdfium pin has gone stale in release-sidecar.yml" \
              --label "$label" \
              --body-file "$body_file"
          fi

          # The issue is the primary signal; this run staying red for as long as the pin is broken
          # is the backstop for anyone who isn't watching Issues either (review blocker #5).
          echo "::error::pinned asset(s) unreachable -- see the filed/updated issue above. This run is intentionally red until the pin is fixed."
          exit 1
