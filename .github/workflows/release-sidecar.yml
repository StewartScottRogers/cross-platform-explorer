name: Release (sidecar-enabled)

# Opt-in channel that builds the app WITH the sidecar platform + AI Console bundled in
# (CPE-321/382). Separate from release.yml on purpose: the public release ships the plain,
# sidecar-free explorer by default; this channel is a manual, draft-only preview of the
# sidecar-enabled build while the console matures (security sign-off CPE-304 open).
#
# Run it from the Actions tab ("Run workflow") and provide the release tag, e.g.
# v0.11.0-sidecar. It publishes a DRAFT prerelease you review before making public.
#
# The overlay gives this build a distinct product identity — "Cross-Platform Explorer
# (Sidecar)" / identifier ...crossplatformexplorer.sidecar (CPE-324) — so its installer is
# a separate app that coexists with the plain release instead of colliding on version.
#
# Cross-OS (CPE-382): builds Windows, Linux, and macOS now that the host OS-keychain secrets
# backend is cross-platform (CPE-322: Windows Credential Manager / macOS Keychain / Linux
# Secret Service). macOS builds native-arch — the bundled sidecar is single-arch, so this
# channel is not a universal binary (a preview-channel limitation). Linux links libdbus.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v0.11.0-sidecar)"
        required: true
        type: string

# Needed so the workflow can create the GitHub Release.
permissions:
  contents: write

jobs:
  # --- Single-draft-release coordination (CPE-1279) ---
  # The 3 build legs below run concurrently on separate runners. Previously each one called
  # tauri-action with just `tagName`, and tauri-action creates the GitHub Release itself if none
  # exists yet for that tag — so when none of the 3 legs could see each other's in-flight release
  # creation, two (or three) legs each independently created a release for the SAME tag, splitting
  # the assets across separate drafts (observed: v0.57.47-sidecar produced one macOS-only draft and
  # one Linux+Windows draft). This job runs FIRST, alone, on a single runner, and creates the draft
  # release exactly once via `gh release create`. Its numeric release ID is then passed to every
  # matrix leg's tauri-action call as `releaseId`, which — per tauri-action's own docs — makes that
  # leg upload assets to the given release directly instead of searching for/creating one by tag,
  # so all 3 legs converge on one draft.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the draft release once (CPE-1279)
        id: create-release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Same title/body/draft/prerelease semantics the matrix legs used to pass to tauri-action
          # directly (see the "Build and publish sidecar-enabled release" step below) — just created
          # by a single writer instead of racing.
          notes_file="$(mktemp)"
          cat > "$notes_file" <<'EOF'
          Build with the sidecar platform + AI Console bundled in — this is the shipping,
          auto-updating channel (the build `/run` installs). Publish the draft to release it;
          once public, installed apps pick it up on their next update check.
          EOF
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "Cross-Platform Explorer $TAG (sidecar)" \
            --notes-file "$notes_file" \
            --draft
          # Draft releases are NOT git-tagged until published, so `GET /releases/tags/{tag}` 404s on a
          # draft (CPE-1303). Resolve the draft's numeric id via `gh release view` (which matches drafts by
          # tag_name), and RETRY — the just-created draft can take a few seconds to become visible to the
          # API (eventual consistency), which is what failed the first attempt.
          release_id=""
          for attempt in 1 2 3 4 5 6; do
            release_id="$(gh release view "$TAG" --repo "${{ github.repository }}" \
              --json databaseId --jq '.databaseId' 2>/dev/null || true)"
            if [ -n "$release_id" ] && [ "$release_id" != "null" ]; then break; fi
            echo "draft release id for $TAG not visible yet (attempt $attempt/6) — retrying in 5s"
            sleep 5
          done
          if [ -z "$release_id" ] || [ "$release_id" = "null" ]; then
            echo "::error::could not resolve draft release id for $TAG after retries"; exit 1
          fi
          echo "resolved release_id=$release_id"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  release-sidecar:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # `pdfium_overlay` selects the CPE-1258 pdfium resource overlay (a separate small config
          # layered in with its own --config flag): pdfium's dynamic-library filename differs by OS
          # (pdfium.dll / libpdfium.so / libpdfium.dylib) even though `overlay` (windows/unix) is
          # shared between Linux and macOS for the OTHER sidecar resources — so pdfium needs its own,
          # more precise per-OS split.
          - platform: windows-latest
            overlay: windows
            pdfium_overlay: windows
          - platform: ubuntu-latest
            overlay: unix
            pdfium_overlay: linux
          - platform: macos-latest
            overlay: unix
            pdfium_overlay: macos
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # Cache the app target and the standalone sidecar target (separate crate,
          # not in the app workspace).
          workspaces: |
            ./src-tauri -> target
            ./sidecar/ai-console -> target
            ./sidecar/agent-board -> target
            ./sidecar/repos -> target

      # CPE-1824: same ForceIPv4/retry/timeout hardening CPE-1787 applied to ci.yml's identical
      # site -- a GitHub-hosted-runner IPv6-connectivity stall can hang `apt-get update` with zero
      # output before it ever falls back to IPv4, and this step has no `continue-on-error`, so an
      # unbounded hang here previously rode all the way to the job's 360-minute default before
      # anyone noticed the sidecar release wasn't shipping.
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::ForceIPv4=true -o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libdbus-1-dev \
            pkg-config

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      # The bundle overlay references the built sidecar binary as a resource, so it must
      # exist before tauri-action packages the app. Native-arch per runner.
      - name: Build the AI Console sidecar
        working-directory: sidecar/ai-console
        run: cargo build --release

      # The Agent Board sidecar (CPE-854) — bundled next to the AI Console; the overlays reference its
      # release binary + manifest, so it must be built before tauri-action packages the app.
      - name: Build the Agent Board sidecar
        working-directory: sidecar/agent-board
        run: cargo build --release

      # The Repositories sidecar (CPE-863) — bundled alongside the others so it isn't a missing binary;
      # the overlays reference its release binary + manifest, so it must be built before packaging.
      - name: Build the Repositories sidecar
        working-directory: sidecar/repos
        run: cargo build --release

      # Stage a never-executed `.pristine` copy of each sidecar (CPE-867 L2): the overlays bundle it as
      # `sidecars/<id>.pristine`, and the host self-heals a missing/stale exe from it on startup. Because
      # nothing ever runs a `.pristine`, a locked-file install skip (CPE-483) can't leave it stale.
      - name: Stage pristine sidecar copies
        shell: bash
        run: |
          # Pick the built binary by existence, NOT `ls … | head`: under the runner's
          # `bash -e -o pipefail`, `ls existing missing` exits non-zero on the missing candidate,
          # pipefail propagates it, and set -e aborts the step before the copy runs — leaving no
          # `.pristine` and failing the tauri build on the missing resource (CPE-919).
          #
          # Also self-heal a MISSING binary (CPE-920): swatinem/rust-cache prunes each workspace's own
          # final binaries before saving the cache, so on a cache hit `cargo build` can report "Finished"
          # (fingerprint fresh) without relinking the pruned exe. If the expected binary isn't there,
          # force a relink; if it still isn't, fail loudly with a listing instead of silently shipping a
          # broken bundle.
          bin_path() {
            local s="$1"
            if [ -f "sidecar/$s/target/release/$s.exe" ]; then echo "sidecar/$s/target/release/$s.exe";
            elif [ -f "sidecar/$s/target/release/$s" ]; then echo "sidecar/$s/target/release/$s"; fi
          }
          for s in ai-console agent-board repos; do
            bin="$(bin_path "$s")"
            if [ -z "$bin" ]; then
              echo "::warning::sidecar '$s' binary missing after build (likely rust-cache prune) — forcing a relink"
              # Touch the sources so cargo's fingerprint is stale and it MUST rebuild the pruned binary
              # (a plain `cargo build` would just report "Finished" again on a fresh fingerprint).
              find "sidecar/$s/src" -name '*.rs' -exec touch {} +
              ( cd "sidecar/$s" && cargo build --release )
              bin="$(bin_path "$s")"
            fi
            if [ -z "$bin" ]; then
              echo "::error::sidecar '$s' binary still missing after forced rebuild; release/ contents:"
              ls -la "sidecar/$s/target/release/" || true
              exit 1
            fi
            cp "$bin" "sidecar/$s/target/release/$s.pristine"
          done

      # --- PDF/video thumbnail native deps (CPE-1258, epic CPE-718) ---
      # `pdf-thumb` + `video-thumb` are now ON for this build (src-tauri/Cargo.toml). Without the real
      # native binaries staged here, the app still builds and runs fine — both extractors already fail
      # gracefully to the generic type icon — but every PDF/video thumbnail would silently degrade in
      # the shipped app. Staged at the exact resource source paths the sidecar-conf overlays declare:
      # `../native-deps/ffmpeg/<windows|unix>/…` (ffmpeg.exe/ffmpeg, already referenced since CPE-1257)
      # and the new `../native-deps/pdfium/<windows|unix>/…` (this ticket's pdfium overlays). Pinned,
      # versioned sources — bump both the tag/version pins AND the matching download URLs together if
      # ever updated:
      #   - pdfium: bblanchon/pdfium-binaries release chromium/7961 (BSD-3-Clause), dynamically loaded
      #     by pdfium-render at runtime — never linked into our binary (crates/server/src/thumb_pdf.rs).
      #   - ffmpeg (Windows/Linux): BtbN/FFmpeg-Builds release (see FFMPEG_BUILD_TAG below — BtbN prunes
      #     autobuilds daily, so this pin rots on a timescale of weeks; CPE-1762 re-pinned it once
      #     already and made the download fail honestly instead of a misleading tar/xz error when it
      #     rots again), the ffmpeg-n8.1.2 "lgpl" static build (`--disable-gpl --disable-nonfree` — no
      #     copyleft/patent-encumbered external codec libs linked in). Shelled out to as a separate bundled program
      #     (mere aggregation — its license never attaches to our signed binary); its LICENSE.txt is
      #     staged alongside so it's carried into the bundle, satisfying the LGPL aggregation notice
      #     requirement.
      #   - ffmpeg (macOS): BtbN doesn't publish macOS builds, and the third-party static macOS builds
      #     we could find are GPL (link libx264/libx265 etc), not LGPL — so instead this compiles a
      #     minimal LGPL ffmpeg from the OFFICIAL ffmpeg.org source at the SAME n8.1.2 tag used for
      #     Windows/Linux, with `--disable-gpl --disable-nonfree` (ffmpeg's own built-in decoders cover
      #     every extension `thumb_video::VIDEO_EXTENSIONS` claims — H.264/HEVC/VP8/VP9/etc — with no
      #     GPL library needed for DECODE-only use). This leg is the one part of this step that could
      #     not be dry-run on a real macOS runner while authoring this ticket (CPE-1258) — watch its
      #     first live run closely.
      # CPE-1824: `timeout-minutes` is new -- this step had none at all before, and it's not
      # `continue-on-error`, so an unbounded stall in any curl download OR (macOS leg) the `git
      # clone`/`make` compile-from-source below previously rode to the job's 360-minute default
      # instead of failing fast. Sized per-OS: Windows/Linux only download+extract small prebuilt
      # archives (bounded to minutes even with curl retries, see the `fetch`/`verify_btbn_checksum`
      # hardening below); macOS additionally clones ffmpeg's source and compiles it -- already
      # called out above as "the slow outlier in this job" -- so it gets a much larger budget.
      - name: Stage native deps — ffmpeg + pdfium (CPE-1258)
        timeout-minutes: ${{ matrix.platform == 'macos-latest' && 35 || 12 }}
        shell: bash
        env:
          PDFIUM_TAG: "chromium/7961"
          # CPE-1789: pinned to a BtbN MONTH-END anchor, not a rolling daily. BtbN keeps ~14 rolling
          # dailies on a ~14-day pruning window but retains one anchor per month (*-07-31-*, *-06-30-*,
          # …) indefinitely (back to 2024-09). A daily pin rots on a ~2-week clock; a month-end anchor
          # doesn't rot at all. For a shipped release, reproducibility and a build that still exists in
          # six months beat two weeks of extra freshness — so when this next needs bumping, prefer the
          # newest available month-end anchor over the newest daily. Verify the chosen tag's actual
          # asset list (both the BUILD_VER commit hash AND the release-line suffix on the filename, e.g.
          # `-lgpl-8.1`, can differ between same-dated releases) and HEAD every fetch URL below before
          # merging — see CPE-1789's Work Log for the verification this pin was set from.
          FFMPEG_BUILD_TAG: "autobuild-2026-07-31-14-10"
          FFMPEG_BUILD_VER: "n8.1.2-34-g9b6c8969e0"
          FFMPEG_SRC_TAG: "n8.1.2"
          # CPE-1796: deliberate escape hatch for ci.yml's "ffmpeg pin is a month-end anchor" guard,
          # which otherwise fails a PR that repins FFMPEG_BUILD_TAG to a rolling daily instead of a
          # month-end anchor. Leave this EMPTY on every normal pin (including this one). Only set it
          # -- to a one-line reason, e.g. "urgent decoder fix only shipped in the latest daily,
          # revert to an anchor by 2026-09-05" -- when FFMPEG_BUILD_TAG above is intentionally a
          # daily: the guard reads this exact string and prints it in its own output, so a reviewer
          # sees WHY the safety net was bypassed (right there in the PR diff), not just that it was.
          # A daily pin still has BtbN's ~14-day pruning clock running against it whether or not the
          # guard is silenced, so treat this as a short-lived, revisited override, not a way to
          # switch back to dailies permanently. CPE-1802: setting this ALSO arms a second net
          # automatically -- once this merges to main, ci.yml's guard job dispatches
          # ffmpeg-pin-freshness.yml on every push to main that reaches that job, for as long as this
          # stays set, so that ~14-day runway is actually watched instead of relying on someone
          # remembering to workflow_dispatch it by hand.
          FFMPEG_BUILD_TAG_OVERRIDE_REASON: ""
        run: |
          set -euo pipefail
          mkdir -p native-deps/ffmpeg/windows native-deps/ffmpeg/unix native-deps/pdfium/windows native-deps/pdfium/unix
          # CPE-1762: every download below goes through this. `curl -sSL` without --fail follows a 404 to
          # an error page and writes it to the output file, so the first thing that complains is tar or
          # unzip, about a "format not recognized" - which reads as a corrupt archive and sends the reader
          # after the wrong thing entirely. It cost a whole release to diagnose once. BtbN publishes a new
          # autobuild daily and PRUNES the old ones, so a pinned ffmpeg URL has a shelf life of weeks and
          # this WILL happen again; when it does, the first error line should say so.
          #
          # CPE-1764: status 200 is necessary but not sufficient - a CDN/proxy error page, a login or
          # captive-portal redirect, or a body cut short by a dropped connection can all come back 200.
          # Measured: fetching an HTML page (https://httpbin.org/html) as if it were an archive got a
          # clean 200 and the HTML was written to the output path, headed straight for tar. So every
          # `fetch` call below now also takes the type this call site expects (magic bytes + a label)
          # and checks the body actually starts with them, plus a minimum plausible size as a second,
          # independent signal - a "197-byte archive" isn't one even if its first bytes happen to line up.
          MIN_ARCHIVE_BYTES=65536
          # CPE-1824: `curl -sSL` alone has no bound on a STALLED transfer -- `--retry`/`-L` only
          # help once a connection attempt reaches a terminal state (refused, a retryable HTTP
          # status, timeout), so a connection that hangs open with zero bytes moving previously
          # rode this whole step to the job's default timeout. `--connect-timeout 15` bounds the
          # TCP/TLS handshake phase only; `--max-time 240` bounds the ENTIRE curl invocation --
          # per curl's own docs this includes time spent inside `-sSL`'s redirect follows -- so it
          # is the one that actually catches a stall mid-transfer. 240s is generous headroom for
          # the largest asset here (a BtbN ffmpeg static build, tens of MB) on a GitHub-hosted
          # runner's bandwidth; it does NOT bound retries across multiple curl invocations (there
          # is only one invocation per `fetch` call here, so that distinction doesn't apply).
          fetch() {
            url="$1"; out="$2"; magic="$3"; label="$4"
            code=$(curl -sSL --connect-timeout 15 --max-time 240 --write-out '%{http_code}' -o "$out" "$url") || true
            code="${code:-000}"
            if [ "$code" != "200" ]; then
              echo "::error::download failed (HTTP $code): $url"
              echo "::error::If this is a BtbN ffmpeg URL, the pinned autobuild has been deleted upstream -"
              echo "::error::bump FFMPEG_BUILD_TAG/FFMPEG_BUILD_VER to a current release. See CPE-1762."
              exit 1
            fi
            size=$(wc -c < "$out" | tr -d ' ')
            magic_len=$(( ${#magic} / 2 ))
            actual=$(head -c "$magic_len" "$out" | od -An -tx1 | tr -d ' \n')
            if [ "$actual" != "$magic" ]; then
              echo "::error::download body is not a $label archive: $url"
              echo "::error::expected magic bytes $magic, got ${actual:-<empty>} (HTTP 200, $size bytes)."
              echo "::error::A 200 status doesn't mean the body is right - this looks like an HTML error"
              echo "::error::page, a login/interception redirect, or a placeholder, not the archive. CPE-1764."
              exit 1
            fi
            if [ "$size" -lt "$MIN_ARCHIVE_BYTES" ]; then
              echo "::error::download body for $url is only $size bytes - too small to be a real $label"
              echo "::error::archive (minimum plausible size: $MIN_ARCHIVE_BYTES bytes), even though the"
              echo "::error::magic bytes matched. A short body with a valid header can still be a"
              echo "::error::truncated transfer that never finished. See CPE-1764."
              exit 1
            fi
          }

          # CPE-1764: BtbN publishes a `checksums.sha256` alongside every release, covering every asset
          # in it - catches a body that has the right header AND is past the size floor but is still
          # wrong (truncated past that floor, or corrupted in transit): a real gap the magic/size checks
          # above admit they can't close. So every BtbN ffmpeg download below is also checksum-verified.
          #
          # What this does NOT buy: tamper resistance. `checksums.sha256` is fetched from the SAME
          # release, the SAME origin, the SAME TLS channel, with the SAME curl as the artifact itself -
          # there is no independent trust anchor (no hash pinned in this repo, no signature, no second
          # origin). Anyone who can serve a malicious archive can serve a matching checksums.sha256 in
          # the same breath. A mismatch here means the body differs from what BtbN CURRENTLY publishes -
          # corruption, truncation, or a substitution that didn't also rewrite the checksum - not
          # "verified authentic". The real authenticity upgrade is pinning the expected hashes IN THIS
          # REPO (reviewed alongside the tag bump), not fetching them from upstream at build time. Also
          # note: PDFIUM_TAG/FFMPEG_BUILD_TAG are literal pins and nothing floats, but GitHub release
          # ASSETS are mutable within a tag - the tag pin does not pin content.
          #
          # bblanchon (pdfium) does NOT publish a plain checksum file - but it DOES publish something
          # stronger: a Sigstore attestation bundle (`pdfium-attestation.json`, Fulcio-issued cert),
          # which has a genuine independent trust anchor. That's the STRONGER mechanism, currently
          # UNUSED here (needs `gh attestation verify`/cosign, not curl+sha256sum - a heavier follow-up,
          # not built in this ticket). BtbN's same-origin sha256, wired up below, is the WEAKER of the
          # two available mechanisms - don't read "ffmpeg has a checksum, pdfium doesn't" as "ffmpeg is
          # more verified"; for authenticity it's the other way around. This layer only adds
          # integrity-over-the-wire, on top of the magic-bytes/size checks above.
          verify_btbn_checksum() {
            file="$1"; asset_name="$2"; url="$3"
            sums_url="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_BUILD_TAG}/checksums.sha256"
            # CPE-1824: same stall-bounding as the `fetch` helper above -- `--connect-timeout 15`
            # for the handshake, `--max-time 60` for the whole invocation (a plain text checksum
            # file is tiny, so 60s is already generous rather than tight).
            sums_code=$(curl -sSL --connect-timeout 15 --max-time 60 --write-out '%{http_code}' -o checksums.sha256.tmp "$sums_url") || true
            sums_code="${sums_code:-000}"
            if [ "$sums_code" != "200" ]; then
              echo "::error::couldn't fetch BtbN's checksums.sha256 (HTTP $sums_code): $sums_url"
              echo "::error::can't verify $url without it. See CPE-1764."
              exit 1
            fi
            expected=$(awk -v n="$asset_name" '$2 == n { print $1 }' checksums.sha256.tmp)
            if [ -z "$expected" ]; then
              echo "::error::no checksum entry for $asset_name in BtbN's checksums.sha256 (tag $FFMPEG_BUILD_TAG)"
              echo "::error::can't verify $url against a published checksum. See CPE-1764."
              exit 1
            fi
            actual=$(sha256sum "$file" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then
              echo "::error::checksum mismatch for $url"
              echo "::error::expected sha256 $expected (from BtbN's published checksums.sha256), got $actual."
              echo "::error::The body doesn't match BtbN's published checksum for this release -"
              echo "::error::corruption, truncation, or a substitution that didn't also rewrite the"
              echo "::error::checksum (this is NOT tamper resistance - see the comment above). CPE-1764."
              exit 1
            fi
          }

          # CPE-1762 long-term-approach decision (recorded here, not just in the PR, so it survives):
          # considered (a) self-mirroring the ffmpeg binary as a release of our own, (b) building ffmpeg
          # from source on Windows/Linux the way the macOS leg already does, (c) a scheduled weekly job
          # that curls the pin and files a ticket before it rots. Went with (c) as the recommended
          # follow-up, NOT built here: (a) adds a signing/maintenance burden for a binary we don't
          # otherwise own, and (b) would multiply Windows/Linux build time for a dependency that rarely
          # changes (the macOS from-source leg is already the slow outlier in this job). A weekly
          # freshness check is cheap and turns "release day surprise" into "ticket filed with days of
          # runway." Until that scheduled job exists, the `fetch` guard above is the safety net: a rotted
          # pin now fails loudly with the URL/status instead of masquerading as a corrupt archive.

          if [ "${{ matrix.platform }}" = "windows-latest" ]; then
            echo "--- pdfium (Windows) ---"
            fetch "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-win-x64.tgz" pdfium.tgz "1f8b" "gzip (.tgz)"
            tar xzf pdfium.tgz bin/pdfium.dll LICENSE
            mv bin/pdfium.dll native-deps/pdfium/windows/pdfium.dll
            mv LICENSE native-deps/pdfium/windows/LICENSE.txt

            echo "--- ffmpeg (Windows, BtbN LGPL static) ---"
            FFMPEG_WIN_ASSET="ffmpeg-${FFMPEG_BUILD_VER}-win64-lgpl-8.1.zip"
            FFMPEG_WIN_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_BUILD_TAG}/${FFMPEG_WIN_ASSET}"
            fetch "$FFMPEG_WIN_URL" ffmpeg.zip "504b0304" "zip"
            verify_btbn_checksum ffmpeg.zip "$FFMPEG_WIN_ASSET" "$FFMPEG_WIN_URL"
            unzip -q ffmpeg.zip "*/bin/ffmpeg.exe" "*/LICENSE.txt"
            mv */bin/ffmpeg.exe native-deps/ffmpeg/windows/ffmpeg.exe
            mv */LICENSE.txt native-deps/ffmpeg/windows/LICENSE.txt

          elif [ "${{ matrix.platform }}" = "ubuntu-latest" ]; then
            echo "--- pdfium (Linux) ---"
            fetch "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-linux-x64.tgz" pdfium.tgz "1f8b" "gzip (.tgz)"
            tar xzf pdfium.tgz lib/libpdfium.so LICENSE
            mv lib/libpdfium.so native-deps/pdfium/unix/libpdfium.so
            mv LICENSE native-deps/pdfium/unix/LICENSE.txt

            echo "--- ffmpeg (Linux, BtbN LGPL static) ---"
            FFMPEG_LINUX_ASSET="ffmpeg-${FFMPEG_BUILD_VER}-linux64-lgpl-8.1.tar.xz"
            FFMPEG_LINUX_URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_BUILD_TAG}/${FFMPEG_LINUX_ASSET}"
            fetch "$FFMPEG_LINUX_URL" ffmpeg.tar.xz "fd377a585a00" "xz (.tar.xz)"
            verify_btbn_checksum ffmpeg.tar.xz "$FFMPEG_LINUX_ASSET" "$FFMPEG_LINUX_URL"
            mkdir -p ffmpeg-extract
            tar xJf ffmpeg.tar.xz -C ffmpeg-extract --strip-components=1
            mv ffmpeg-extract/bin/ffmpeg native-deps/ffmpeg/unix/ffmpeg
            mv ffmpeg-extract/LICENSE.txt native-deps/ffmpeg/unix/LICENSE.txt

          elif [ "${{ matrix.platform }}" = "macos-latest" ]; then
            echo "--- pdfium (macOS arm64) ---"
            fetch "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_TAG}/pdfium-mac-arm64.tgz" pdfium.tgz "1f8b" "gzip (.tgz)"
            tar xzf pdfium.tgz lib/libpdfium.dylib LICENSE
            mv lib/libpdfium.dylib native-deps/pdfium/unix/libpdfium.dylib
            mv LICENSE native-deps/pdfium/unix/LICENSE.txt
            xattr -d com.apple.quarantine native-deps/pdfium/unix/libpdfium.dylib 2>/dev/null || true

            # CPE-1764: the macOS ffmpeg leg below does NOT go through `fetch` - it's a `git clone` of
            # FFmpeg's own source (built from source, not a downloaded pre-built archive), so there is
            # no single-file HTTP body for a magic-bytes/size/checksum check to examine. Confirmed out
            # of scope for this ticket; a bad clone fails at `./configure`/`make` below instead, which
            # is git's/the build's own loud failure, not a silently-accepted wrong body.
            echo "--- ffmpeg (macOS arm64, built from official source, LGPL-only) ---"
            git clone --depth 1 --branch "$FFMPEG_SRC_TAG" https://github.com/FFmpeg/FFmpeg.git ffmpeg-src
            (
              cd ffmpeg-src
              ./configure --disable-gpl --disable-nonfree --disable-doc --disable-debug \
                --disable-ffplay --disable-ffprobe
              make -j"$(sysctl -n hw.ncpu)"
            )
            mv ffmpeg-src/ffmpeg native-deps/ffmpeg/unix/ffmpeg
            cp ffmpeg-src/COPYING.LGPLv2.1 native-deps/ffmpeg/unix/LICENSE.txt
          fi

          chmod +x native-deps/ffmpeg/windows/ffmpeg.exe native-deps/ffmpeg/unix/ffmpeg 2>/dev/null || true
          echo "Staged native-deps:"
          find native-deps -type f -exec ls -la {} \;

      # --- Windows code signing (CPE-1131 — self-signed) ---
      # Same conditional pattern as release.yml: sign only when the cert secret is present, else skip
      # (unsigned, still green). The bundle.windows patch lands on the BASE tauri.conf.json; the sidecar
      # --config overlays don't set bundle.windows, so the thumbprint survives the merge.
      - name: Detect Windows signing cert (CPE-1131)
        id: wincert
        shell: bash
        env:
          PFX: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if [ "${{ matrix.platform }}" = "windows-latest" ] && [ -n "$PFX" ]; then
            echo "has=true" >> "$GITHUB_OUTPUT"
          else
            echo "has=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Windows code signing (CPE-1131 — self-signed)
        if: steps.wincert.outputs.has == 'true'
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cpe-sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $sec = ConvertTo-SecureString $env:WINDOWS_CERT_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $sec
          Remove-Item $pfx -Force
          $conf = 'src-tauri/tauri.conf.json'
          $j = Get-Content $conf -Raw | ConvertFrom-Json
          if ($null -eq $j.bundle.windows) {
            $j.bundle | Add-Member -NotePropertyName windows -NotePropertyValue ([pscustomobject]@{}) -Force
          }
          $j.bundle.windows | Add-Member -NotePropertyName certificateThumbprint -NotePropertyValue $cert.Thumbprint -Force
          $j.bundle.windows | Add-Member -NotePropertyName digestAlgorithm      -NotePropertyValue 'sha256' -Force
          $j.bundle.windows | Add-Member -NotePropertyName timestampUrl         -NotePropertyValue 'http://timestamp.digicert.com' -Force
          ($j | ConvertTo-Json -Depth 40) | Set-Content $conf -Encoding utf8
          Write-Host "Windows self-signed signing enabled (thumbprint $($cert.Thumbprint))."

      - name: Build and publish sidecar-enabled release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Reuse the updater signing secret so bundles sign identically to the main
          # release (the pubkey in tauri.conf.json requires a matching private key).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          # Upload to the single draft the create-release job already made instead of letting this
          # leg search for/create a release by tag — that per-leg creation is what raced (CPE-1279).
          # Per tauri-action's docs, when releaseId is set it's used directly and tagName/releaseName
          # are not consulted to find or create a release, so releaseName/releaseBody (set once, at
          # creation time, above) are omitted here.
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # Must match the status of the release create-release made (tauri-action requires this to
          # agree with the existing release when uploading via releaseId). Created as a draft so it
          # can be reviewed before going public, but NOT a prerelease: GitHub's `/releases/latest/`
          # (the updater endpoint) skips prereleases, so the sidecar channel must be non-prerelease to
          # serve auto-updates (CPE-768).
          releaseDraft: true
          prerelease: false
          # Build with the sidecar feature + the base overlay (product identity) + the per-OS
          # overlay (which bundles the correctly-named sidecar binary + manifest + agent catalog) +
          # the CPE-1258 pdfium overlay (bundles the correctly-named pdfium dynamic library — its
          # filename differs by OS even where the other overlay is shared between Linux and macOS).
          args: --features sidecar-platform --config src-tauri/tauri.sidecar.conf.json --config src-tauri/tauri.sidecar.${{ matrix.overlay }}.conf.json --config src-tauri/tauri.sidecar.pdfium.${{ matrix.pdfium_overlay }}.conf.json
          # This IS the auto-update channel (CPE-768): emit + upload latest.json. Combined with
          # createUpdaterArtifacts:true in tauri.sidecar.conf.json, the manifest references the
          # correctly-named `…Sidecar…` installers, signed with the shared updater key.
          includeUpdaterJson: true
