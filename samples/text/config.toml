title = "Baseline Sample Service"
version = 2
debug = false
owner.name = "CPE Test Suite"

limits = { max_connections = 100, max_body_bytes = 1048576 }

allowed_ports = [8080, 8443, 9000]

dependencies = [
  "requests>=2",  # http client
  "click",
  # a comment-only line inside the array
  "rich",
]

[server]
host = "0.0.0.0"
port = 8080
timeout_seconds = 30.5

[server.tls]
enabled = true
cert = "/etc/ssl/baseline.pem"

[[workers]]
name = "primary"
threads = 4

[[workers]]
name = "background"
threads = 2
